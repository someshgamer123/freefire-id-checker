<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .top-section {
            position: relative; z-index: 1; flex: 0 0 auto; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 0 6px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.06);
            padding: 8px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .video-container iframe, .video-container video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;
        }
        .video-container iframe { z-index: 5; }
        .video-container::before {
            content: '';
            position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: transparent; cursor: default; touch-action: none;
        }

        .headline {
            text-align: center; margin: 10px 0 4px; font-size: 17px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: fadeIn 1s ease; letter-spacing: 0.5px;
        }

        /* ===== CLAIM BUTTON - SIMPLE & ALWAYS VISIBLE ===== */
        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            position: relative;
            z-index: 999999;
        }

        .claim-btn {
            padding: 16px 60px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            -webkit-tap-highlight-color: transparent;
            z-index: 999999;
            pointer-events: auto;
            opacity: 1 !important;
            visibility: visible !important;
            display: block !important;
        }
        .claim-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 60px rgba(102, 126, 234, 0.5); }
        .claim-btn:active { transform: scale(0.97); }
        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(10px);
        }
        @keyframes btnGlow { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

        /* ===== POPUP ===== */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .popup-overlay.show { opacity: 1; visibility: visible; }
        .popup-overlay.hidden { opacity: 0; visibility: hidden; }

        .popup-card {
            background: rgba(20, 20, 50, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 24px 20px 28px;
            max-width: 380px;
            width: 92%;
            border: 2px solid rgba(102, 126, 234, 0.4);
            box-shadow: 0 0 80px rgba(102, 126, 234, 0.2), inset 0 0 80px rgba(102, 126, 234, 0.05);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
            cursor: pointer;
        }
        .popup-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1; animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(40px) rotate(-3deg); }
            60% { opacity: 1; transform: scale(1.02) translateY(-5px) rotate(0.5deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        .popup-card .popup-image {
            width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden;
            background: #1a1a3a; border: 2px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px;
        }
        .popup-card .popup-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .popup-card .popup-image .placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 48px; color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, #1a1a3a, #2a2a5a);
        }

        .popup-card .popup-title {
            text-align: center; font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            pointer-events: none;
        }
        .popup-card .popup-sub {
            text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.4); margin-bottom: 16px;
            pointer-events: none;
        }

        .popup-card .popup-claim-btn {
            width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
            position: relative; box-shadow: 0 0 40px rgba(102, 126, 234, 0.25);
            cursor: default !important;
            pointer-events: none !important;
            opacity: 1;
            text-align: center;
            display: block;
        }
        .popup-card .popup-claim-btn::before {
            content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1; animation: btnGlow 2s ease-in-out infinite; filter: blur(10px);
        }

        /* ===== CONFETTI ===== */
        .confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            pointer-events: none; overflow: hidden;
        }
        .confetti-container.active { pointer-events: none; }

        .confetti-piece {
            position: absolute; width: 10px; height: 14px;
            animation: confettiFall linear forwards; pointer-events: none; opacity: 1;
            will-change: transform, opacity; backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(0.8); }
            20% { opacity: 1; transform: translateY(20vh) rotate(72deg) scale(1.1); }
            50% { opacity: 1; transform: translateY(50vh) rotate(180deg) scale(1.3); }
            80% { opacity: 0.9; transform: translateY(80vh) rotate(288deg) scale(1.1); }
            100% { opacity: 0; transform: translateY(110vh) rotate(360deg) scale(0.6); }
        }

        .confetti-burst-piece {
            position: absolute; width: 8px; height: 12px;
            animation: confettiBurst 1.5s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            pointer-events: none; opacity: 0;
            will-change: transform, opacity; backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }
        @keyframes confettiBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(0.3) rotate(0deg); }
            35% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg); }
            70% { opacity: 0.8; transform: translate(var(--tx2), var(--ty2)) scale(0.9) rotate(300deg); }
            100% { opacity: 0; transform: translate(var(--tx3), var(--ty3)) scale(0.4) rotate(400deg); }
        }

        .sound-toggle {
            position: fixed; bottom: 80px; right: 20px; z-index: 1001;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; color: #fff;
        }
        .sound-toggle:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        .chat-section {
            position: relative; z-index: 1; flex: 1; width: 100%; max-width: 800px; margin: 0 auto;
            min-height: 0; overflow: hidden; border-radius: 12px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px); animation: fadeInUp 1s ease; margin-top: 4px;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .chat-section.show { opacity: 1; }

        .chat-section::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40px;
            background: linear-gradient(to bottom, #0a0a1a, transparent); z-index: 10; pointer-events: none;
        }
        .chat-section::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
            background: linear-gradient(to top, #0a0a1a, transparent); z-index: 10; pointer-events: none;
        }

        .chat-container {
            width: 100%; height: 100%; position: relative; overflow-y: auto; overflow-x: hidden;
            padding: 8px 14px; padding-top: 30px; padding-bottom: 20px; scroll-behavior: smooth;
        }
        .chat-messages { display: flex; flex-direction: column; gap: 5px; padding-bottom: 8px; }

        .chat-message {
            display: flex; align-items: center; gap: 8px; padding: 7px 12px;
            background: rgba(255, 255, 255, 0.04); border-radius: 10px;
            border-left: 3px solid rgba(102, 126, 234, 0.15);
            font-size: 13px; opacity: 0; transform: translateY(15px) scale(0.95);
            animation: fadeInUpChat 0.4s ease forwards;
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }
        @keyframes fadeInUpChat {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-message.fade-out {
            opacity: 0 !important; transform: translateY(-20px) scale(0.9) !important;
            pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .chat-message .avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; font-weight: 700; text-transform: uppercase;
        }
        .chat-message .username { font-weight: 600; color: rgba(255, 255, 255, 0.9); font-size: 12px; white-space: nowrap; min-width: 50px; }
        .chat-message .text { color: rgba(255, 255, 255, 0.75); font-size: 12px; font-weight: 300; word-break: break-word; flex: 1; }
        .chat-message .time { color: rgba(255, 255, 255, 0.2); font-size: 9px; margin-left: 4px; white-space: nowrap; font-weight: 300; }

        .emoji-picker-wrapper {
            position: sticky; bottom: 8px; z-index: 20; display: flex; justify-content: flex-end;
            padding-right: 6px; margin-top: auto;
        }
        .emoji-picker-btn {
            background: rgba(102, 126, 234, 0.2); border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
            color: #fff; backdrop-filter: blur(10px); position: relative;
        }
        .emoji-picker-btn:hover { background: rgba(102, 126, 234, 0.4); transform: scale(1.1); }
        .emoji-picker-btn .emoji-list {
            position: absolute; bottom: 55px; right: 0;
            background: rgba(20, 20, 40, 0.95); border-radius: 12px; padding: 8px;
            display: none; gap: 4px; border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); flex-wrap: wrap; width: 160px; justify-content: center;
        }
        .emoji-picker-btn .emoji-list.open { display: flex; }
        .emoji-picker-btn .emoji-list span {
            font-size: 24px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: 0.3s;
        }
        .emoji-picker-btn .emoji-list span:hover { background: rgba(102, 126, 234, 0.3); transform: scale(1.2); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.2); border-radius: 4px; }

        .flying-reaction {
            position: fixed; font-size: 28px; z-index: 4; pointer-events: none;
            animation: flyUpSmooth 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes flyUpSmooth {
            0% { opacity: 0; transform: translateY(0) scale(0.3) rotate(0deg); }
            15% { opacity: 1; transform: translateY(-30px) scale(1.2) rotate(8deg); }
            40% { opacity: 1; transform: translateY(-100px) scale(1.0) rotate(-5deg); }
            70% { opacity: 0.8; transform: translateY(-200px) scale(0.8) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-320px) scale(0.4) rotate(-8deg); }
        }
        .flying-reaction.type-1 { animation-duration: 2.5s; }
        .flying-reaction.type-2 { animation-duration: 3.2s; }
        .flying-reaction.type-3 { animation-duration: 2.8s; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 5px; border-radius: 12px; }
            .video-container { border-radius: 8px; }
            .video-container::before { border-radius: 10px; }
            .headline { font-size: 14px; margin: 6px 0 3px; }
            .claim-btn { padding: 12px 40px; font-size: 16px; max-width: 100%; }
            .popup-card { padding: 18px 16px 22px; max-width: 340px; }
            .popup-card .popup-title { font-size: 17px; }
            .popup-card .popup-claim-btn { font-size: 16px; padding: 12px; }
            .chat-section { border-radius: 8px; margin-top: 2px; }
            .chat-message { padding: 5px 10px; font-size: 11px; gap: 6px; }
            .chat-message .avatar { width: 26px; height: 26px; font-size: 11px; }
            .chat-message .username { font-size: 10px; min-width: 40px; }
            .chat-message .text { font-size: 10px; }
            .chat-message .time { font-size: 8px; }
            .chat-container { padding: 6px 10px; padding-top: 25px; padding-bottom: 15px; }
            .flying-reaction { font-size: 22px; }
            .emoji-picker-btn { width: 38px; height: 38px; font-size: 16px; }
            .emoji-picker-btn .emoji-list { width: 140px; bottom: 48px; }
            .emoji-picker-btn .emoji-list span { font-size: 20px; }
            .confetti-piece { width: 8px; height: 10px; }
            .confetti-burst-piece { width: 6px; height: 9px; }
            .sound-toggle { width: 34px; height: 34px; font-size: 15px; bottom: 70px; right: 14px; }
        }
        @media (max-width: 400px) {
            .headline { font-size: 12px; }
            .claim-btn { padding: 10px 30px; font-size: 14px; max-width: 100%; }
            .popup-card { padding: 14px 12px 18px; max-width: 300px; }
            .popup-card .popup-title { font-size: 15px; }
            .popup-card .popup-claim-btn { font-size: 14px; padding: 10px; }
            .chat-message { padding: 4px 8px; font-size: 10px; gap: 4px; }
            .chat-message .avatar { width: 22px; height: 22px; font-size: 9px; }
            .chat-message .username { font-size: 9px; min-width: 35px; }
            .chat-message .text { font-size: 9px; }
            .chat-message .time { font-size: 7px; }
            .chat-container { padding: 4px 6px; padding-top: 20px; padding-bottom: 12px; }
            .flying-reaction { font-size: 18px; }
            .emoji-picker-btn { width: 32px; height: 32px; font-size: 14px; }
            .emoji-picker-btn .emoji-list { width: 120px; bottom: 42px; }
            .emoji-picker-btn .emoji-list span { font-size: 16px; }
            .confetti-piece { width: 6px; height: 8px; }
            .confetti-burst-piece { width: 5px; height: 7px; }
            .sound-toggle { width: 30px; height: 30px; font-size: 13px; bottom: 60px; right: 10px; }
        }
        :-webkit-full-screen .video-container { border-radius: 0; }
        :-webkit-full-screen .video-wrapper { border-radius: 0; padding: 0; border: none; box-shadow: none; background: transparent; }
        :-webkit-full-screen .video-container::before { display: none; }
        :-webkit-full-screen .top-section { max-width: 100%; }
        :-webkit-full-screen .chat-section { max-width: 100%; border-radius: 0; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container" id="videoContainer">
                <div id="videoPlayer"></div>
                <div class="video-overlay" id="videoOverlay"></div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video</div>
            <!-- ===== CLAIM BUTTON - ALWAYS VISIBLE ===== -->
            <div class="claim-btn-wrapper">
                <button class="claim-btn" id="mainClaimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <div class="chat-section" id="chatSection">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="emoji-picker-wrapper">
                <div class="emoji-picker-btn" id="emojiPickerBtn" onclick="toggleEmojiPicker()">
                    😊
                    <div class="emoji-list" id="emojiList">
                        <span onclick="triggerReaction('🥳', event)">🥳</span>
                        <span onclick="triggerReaction('🤩', event)">🤩</span>
                        <span onclick="triggerReaction('😍', event)">😍</span>
                        <span onclick="triggerReaction('😎', event)">😎</span>
                        <span onclick="triggerReaction('😮', event)">😮</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== POPUP ===== -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card" id="popupCard">
            <div class="popup-image" id="popupImage">
                <div class="placeholder" id="popupPlaceholder">🎬</div>
                <img id="popupImg" style="display:none;" alt="Popup Image">
            </div>
            <div class="popup-title" id="popupTitle">🎁 Claim Your Reward</div>
            <div class="popup-sub" id="popupSub">Tap anywhere to unlock your reward</div>
            <div class="popup-claim-btn" id="popupClaimBtn">🎁 Claim Now</div>
        </div>
    </div>

    <!-- ===== CONFETTI ===== -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- ===== SOUND TOGGLE ===== -->
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

    <script>
        // ==================== CONFIG ====================
        var linkId = window.location.pathname.split('/').pop() || 'default';
        var urlParams = new URLSearchParams(window.location.search);
        var videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        var claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        var buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        var headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video';

        document.getElementById('headline').textContent = headline;
        document.getElementById('mainClaimBtn').textContent = buttonText;
        document.getElementById('popupClaimBtn').textContent = buttonText;

        function fixYouTubeUrl(url) {
            if (!url) return 'https://youtu.be/dQw4w9WgXcQ';
            if (url.includes('youtube.com/watch?v=')) {
                var videoId = url.split('v=')[1].split('&')[0];
                return 'https://youtu.be/' + videoId;
            }
            if (url.includes('youtu.be/')) return url;
            if (url.includes('youtube.com/embed/')) return url;
            if (url.match(/^[a-zA-Z0-9_-]{11}$/)) return 'https://youtu.be/' + url;
            return url;
        }
        videoUrl = fixYouTubeUrl(videoUrl);

        // ==================== STATE ====================
        var isUnlocked = false;
        var isPopupClaimed = false;
        var isCelebrationActive = false;
        var isVideoPlaying = false;
        var videoPlayCount = 0;
        var backPressCount = 0;
        var isExiting = false;
        var pageLoadTime = Date.now();
        var isSoundEnabled = true;

        // ==================== SCREEN LOCK ====================
        document.getElementById('videoOverlay').addEventListener('touchstart', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, { passive: false });
        document.getElementById('videoOverlay').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); return false; });

        function loadVideo() {
            var container = document.getElementById('videoPlayer');
            container.innerHTML = '';
            var ytId = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (ytId) {
                var videoId = ytId[1];
                var iframe = document.createElement('iframe');
                iframe.id = 'ytPlayer';
                iframe.src = 'https://www.youtube.com/embed/' + videoId +
                    '?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&showinfo=0&fs=1&loop=1&playlist=' + videoId +
                    '&disablekb=1&iv_load_policy=3&cc_load_policy=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(window.location.origin);
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                container.appendChild(iframe);
                iframe.onload = function() {
                    forcePlayVideo(iframe);
                    setTimeout(function() { forcePlayVideo(iframe); }, 300);
                    setTimeout(function() { forcePlayVideo(iframe); }, 600);
                    trackVideoPlay();
                };
                var attempts = 0;
                var interval = setInterval(function() {
                    if (attempts > 15) { clearInterval(interval); return; }
                    forcePlayVideo(iframe);
                    attempts++;
                }, 1500);
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden && !isVideoPlaying) forcePlayVideo(iframe);
                });
                setTimeout(function() { trackVideoPlay(); }, 3000);
                return;
            }

            var video = document.createElement('video');
            video.muted = false;
            video.playsInline = true;
            video.webkitPlaysInline = true;
            video.autoplay = true;
            video.loop = true;
            video.controls = true;
            video.style.cssText = 'width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:5;background:#000;';
            var source = document.createElement('source');
            source.src = videoUrl;
            source.type = videoUrl.match(/\.mp4/i) ? 'video/mp4' : videoUrl.match(/\.webm/i) ? 'video/webm' : videoUrl.match(/\.ogg/i) ? 'video/ogg' : 'video/mp4';
            video.appendChild(source);
            video.onerror = function() {
                var iframe = document.createElement('iframe');
                iframe.src = videoUrl + '?autoplay=1&playsinline=1&loop=1';
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                container.innerHTML = '';
                container.appendChild(iframe);
            };
            container.appendChild(video);
            video.onloadedmetadata = function() {
                video.play().then(function() { trackVideoPlay(); }).catch(function() {
                    var playOnInteraction = function() {
                        video.play().then(function() { trackVideoPlay(); }).catch(function() {});
                        document.removeEventListener('click', playOnInteraction);
                        document.removeEventListener('touchstart', playOnInteraction);
                    };
                    document.addEventListener('click', playOnInteraction, { once: true });
                    document.addEventListener('touchstart', playOnInteraction, { once: true });
                });
            };
            video.addEventListener('pause', function() { if (!video.ended) video.play().catch(function() {}); });
            if (video.readyState >= 2) { video.play().then(function() { trackVideoPlay(); }).catch(function() {}); }
            var retryCount = 0;
            var retryInterval = setInterval(function() {
                if (retryCount < 10 && video.paused) {
                    video.play().then(function() { trackVideoPlay(); clearInterval(retryInterval); }).catch(function() {});
                } else if (retryCount >= 10) { clearInterval(retryInterval); }
                retryCount++;
            }, 1500);
        }

        for (var i = 0; i < 10; i++) setTimeout(addChat, i * 120);
        setInterval(function() { addChat(); if (Math.random() > 0.6) setTimeout(addChat, 300); }, 1400 + Math.random() * 1000);

        // ==================== KEEP AWAKE ====================
        async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
        keepAwake();

        // ==================== FULLSCREEN ====================
        document.getElementById('videoContainer').addEventListener('click', function() {
            var elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(function() {});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            }
        });

        // ==================== INIT ====================
        async function init() {
            await loadPopupData();
            setTimeout(function() { showPopup(); }, 500);
        }
        init();

        console.log('🎬 Video URL:', videoUrl);
        console.log('🎁 Claim URL:', claimUrl);
        console.log('🔘 Button Text:', buttonText);
        console.log('✅ MAIN CLAIM BUTTON: SIMPLE & ALWAYS VISIBLE');
    </script>
