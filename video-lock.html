<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Rewards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        window.addEventListener('keydown', e => {
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        }, true);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            user-select: none;
        }

        .player-card {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            background: #131722;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        .video-box iframe, .video-box video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .headline {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin: 14px 0 10px;
            color: #e2e8f0;
        }

        .btn-claim {
            width: 100%;
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #9333ea);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-claim:active { transform: scale(0.98); }

        .chat-wrap {
            flex: 1;
            width: 100%;
            max-width: 760px;
            margin: 12px auto 0;
            background: #131722;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        .chat-scroll {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
        }

        .chat-user { font-weight: 700; color: #818cf8; }
        .chat-text { color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="video-box" id="videoContainer">
            <div id="videoPlayer"></div>
        </div>
        <div class="headline" id="headline">🎬 Watch Stream & Unlock Reward</div>
        <button class="btn-claim" id="claimBtn" onclick="handleClaim()">🎁 Claim Reward Now</button>
    </div>

    <div class="chat-wrap">
        <div class="chat-scroll" id="chatScroll"></div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const linkId = pathParts[pathParts.length - 1] || 'default';
        let claimDestination = '#';

        function sanitizeYt(url) {
            if (!url) return 'https://www.youtube.com/embed/dQw4w9WgXcQ';
            if (url.includes('youtube.com/watch?v=')) {
                return 'https://www.youtube.com/embed/' + url.split('v=').split('&')[0];
            }
            if (url.includes('youtu.be/')) {
                return 'https://www.youtube.com/embed/' + url.split('youtu.be/').split('?')[0];
            }
            return url;
        }

        fetch('/api/link/' + linkId)
            .then(r => r.json())
            .then(data => {
                const videoUrl = sanitizeYt(data.video);
                claimDestination = data.claim || '#';
                if (data.headline) document.getElementById('headline').textContent = data.headline;
                document.getElementById('videoPlayer').innerHTML = `<iframe src="${videoUrl}?autoplay=1&mute=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            })
            .catch(() => {
                document.getElementById('videoPlayer').innerHTML = `<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            });

        function handleClaim() {
            fetch('/api/track-claim/' + linkId, { method: 'POST' }).catch(() => {});
            if (claimDestination && claimDestination !== '#') {
                window.location.href = claimDestination;
            } else {
                alert('🎉 Reward verified successfully for UID: ' + (localStorage.getItem('playerUID') || 'Player'));
            }
        }

        const names = ['DemonKing', 'Phoenix', 'DarkKnight', 'StarGamer', 'SniperPro', 'GhostRider'];
        const msgs = ['Redeem code working!', 'Got 500₹ successfully!', 'Thanks bhai code mil gaya', 'Superb stream!', 'Redeemed!'];
        const chatBox = document.getElementById('chatScroll');

        setInterval(() => {
            const n = names[Math.floor(Math.random() * names.length)];
            const m = msgs[Math.floor(Math.random() * msgs.length)];
            const div = document.createElement('div');
            div.className = 'chat-row';
            div.innerHTML = `<span class="chat-user">${n}:</span> <span class="chat-text">${m}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (chatBox.children.length > 15) chatBox.removeChild(chatBox.firstChild);
        }, 2000);
    </script>
</body>
</html>
