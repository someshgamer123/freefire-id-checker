<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reward Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SAFE ANTI-F12 & ANTI-INSPECT SHIELD -->
    <script>
        (function() {
            document.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, true);
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
                if ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
            }, true);
            try {
                const noop = () => {};
                ['log', 'debug', 'info', 'warn', 'error', 'table', 'trace'].forEach(m => window.console[m] = noop);
            } catch(e) {}
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: #080c16;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            padding: 14px;
            user-select: none;
            -webkit-user-select: none;
        }

        .ambient-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 12%, rgba(99, 102, 241, 0.16) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 15% 75%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
            z-index: 0; pointer-events: none;
        }

        .top-section {
            position: relative; z-index: 1; flex: 0 0 auto; width: 100%; max-width: 820px; margin: 0 auto;
        }

        .video-wrapper {
            background: rgba(16, 23, 41, 0.82);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            padding: 10px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
        }
        .video-container iframe, .video-container video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;
        }
        .video-container iframe { z-index: 5; }

        .video-badge-live {
            position: absolute; top: 12px; left: 12px; z-index: 8;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
            padding: 4px 12px; font-size: 11px; font-weight: 800; color: #fff;
            display: flex; align-items: center; gap: 6px; pointer-events: none;
        }
        .video-badge-live .live-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #f43f5e;
            animation: pulseLive 1.4s infinite;
        }
        @keyframes pulseLive { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.3); } }

        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: transparent; pointer-events: none !important;
        }

        .headline {
            text-align: center; margin: 12px 0 6px; font-size: 17px; font-weight: 800;
            color: #ffffff; letter-spacing: -0.2px; opacity: 0; transition: opacity 0.5s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .headline.show { opacity: 1; }

        .claim-btn-wrapper {
            display: flex; justify-content: center; margin-top: 4px; opacity: 0; transition: opacity 0.5s ease;
        }
        .claim-btn-wrapper.show { opacity: 1; }

        /* ✨ GLOWING SHINING CLAIM BUTTON ✨ */
        .claim-btn {
            position: relative;
            padding: 16px 54px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            color: #ffffff;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 35px rgba(79, 70, 229, 0.45), 0 0 25px rgba(124, 58, 237, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 20;
        }
        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 18px 45px rgba(79, 70, 229, 0.6), 0 0 35px rgba(124, 58, 237, 0.45);
        }
        .claim-btn:active { transform: scale(0.97); }

        /* Continuous Holographic Light Sweep */
        .claim-btn::after, .popup-claim-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -160%;
            width: 75%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1) 20%,
                rgba(255, 255, 255, 0.85) 50%,
                rgba(255, 255, 255, 0.1) 80%,
                transparent
            );
            transform: rotate(25deg);
            animation: shineSweep 2.8s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes shineSweep {
            0% { left: -160%; }
            35% { left: 160%; }
            100% { left: 160%; }
        }

        .claim-btn .ripple, .popup-claim-btn .ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.4);
            transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        /* ==================== ✨ ENTRANCE POPUP MODAL ✨ ==================== */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            background: rgba(4, 7, 15, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            pointer-events: none !important;
        }
        .popup-overlay.show { opacity: 1; visibility: visible; pointer-events: all !important; }
        .popup-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none !important; }

        .popup-card {
            background: rgba(17, 25, 44, 0.98);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: 28px;
            padding: 22px;
            max-width: 440px;
            width: 94%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(99, 102, 241, 0.2);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
            cursor: pointer; text-align: center;
            pointer-events: all !important;
        }
        .popup-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.45), rgba(168, 85, 247, 0.45), rgba(236, 72, 153, 0.35));
            z-index: -1; animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 16:9 BANNER CONTAINER (Clean Aspect Ratio, Zero Cropping) */
        .popup-image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #060913;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .popup-main-img {
            width: 100%;
            height: 100%;
            object-fit: contain !important;
            object-position: center !important;
            display: block;
            pointer-events: none !important;
            border-radius: 14px;
        }

        .popup-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 46px; color: rgba(255, 255, 255, 0.2); gap: 6px; padding: 20px 0;
        }
        .popup-placeholder span { font-size: 12px; color: #94a3b8; font-weight: 700; }

        .popup-pill-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(99, 102, 241, 0.14); border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;
            color: #818cf8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .popup-pill-tag .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

        .popup-title {
            font-size: 22px; font-weight: 900; color: #ffffff; margin-bottom: 4px;
            letter-spacing: -0.4px;
        }
        .popup-sub {
            font-size: 13.5px; color: #94a3b8; margin-bottom: 18px; font-weight: 500;
        }

        .popup-claim-btn {
            width: 100%; padding: 15px; border: none; border-radius: 16px; font-size: 17px; font-weight: 900;
            cursor: pointer; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: #fff;
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.25s ease; position: relative; overflow: hidden;
            pointer-events: all !important; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .popup-claim-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(79, 70, 229, 0.55); }
        .popup-claim-btn:active { transform: scale(0.97); }

        /* CONFETTI ENGINE */
        .confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            pointer-events: none; overflow: hidden;
        }
        .confetti-container.active { pointer-events: none; }

        .confetti-piece {
            position: absolute; width: 8px; height: 12px;
            animation: confettiFall 2.2s linear forwards; pointer-events: none; opacity: 0;
            will-change: transform, opacity;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(0.8); }
            50% { opacity: 1; transform: translateY(50vh) rotate(180deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
        }

        .confetti-burst-piece {
            position: absolute; width: 6px; height: 10px;
            animation: confettiBurst 1.2s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            pointer-events: none; opacity: 0;
        }
        @keyframes confettiBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(0.3); }
            40% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(200deg); }
            100% { opacity: 0; transform: translate(var(--tx3), var(--ty3)) scale(0.2) rotate(400deg); }
        }

        .sound-toggle {
            position: fixed; bottom: 85px; right: 20px; z-index: 1001;
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; backdrop-filter: blur(12px); transition: 0.3s; color: #e2e8f0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .sound-toggle:hover { background: rgba(99, 102, 241, 0.3); transform: scale(1.08); }

        /* LIVE CHAT WITH HUMAN TIMESTAMPS */
        .chat-section {
            position: relative; z-index: 1; flex: 1; width: 100%; max-width: 820px; margin: 8px auto 0;
            min-height: 0; overflow: hidden; border-radius: 20px;
            background: rgba(16, 23, 41, 0.68); border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px); animation: fadeInUp 1s ease;
            opacity: 0; transition: opacity 0.5s ease; display: flex; flex-direction: column;
        }
        .chat-section.show { opacity: 1; }

        .chat-header-bar {
            padding: 8px 16px; background: rgba(11, 15, 25, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-header-bar .chat-title {
            font-size: 12.5px; font-weight: 800; color: #cbd5e1; display: flex; align-items: center; gap: 6px;
        }
        .chat-header-bar .online-badge {
            font-size: 11px; color: #10b981; font-weight: 800; display: flex; align-items: center; gap: 5px;
        }
        .chat-header-bar .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: pulseDot 1.5s infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-section::before {
            content: ''; position: absolute; top: 32px; left: 0; right: 0; height: 35px;
            background: linear-gradient(to bottom, #080c16, transparent); z-index: 10; pointer-events: none;
        }
        .chat-section::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 35px;
            background: linear-gradient(to top, #080c16, transparent); z-index: 10; pointer-events: none;
        }

        .chat-container {
            width: 100%; height: 100%; position: relative; overflow-y: auto; overflow-x: hidden;
            padding: 8px 14px 20px; scroll-behavior: smooth;
        }
        .chat-messages { display: flex; flex-direction: column; gap: 7px; padding-top: 15px; }

        .chat-message {
            display: flex; align-items: center; gap: 10px; padding: 9px 14px;
            background: rgba(255, 255, 255, 0.035); border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 3px solid #6366f1;
            font-size: 13px; opacity: 0; transform: translateY(12px) scale(0.97);
            animation: fadeInUpChat 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }
        @keyframes fadeInUpChat {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-message.fade-out {
            opacity: 0 !important; transform: translateY(-20px) scale(0.9) !important;
            pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .chat-message .avatar {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0; background: linear-gradient(135deg, rgba(79, 70, 229, 0.3), rgba(124, 58, 237, 0.35));
            border: 1px solid rgba(255,255,255,0.12);
        }
        .chat-message .vip-tag {
            font-size: 9.5px; font-weight: 800; color: #f59e0b; background: rgba(245, 158, 11, 0.15);
            padding: 1px 6px; border-radius: 6px; text-transform: uppercase;
        }
        .chat-message .username { font-weight: 800; color: #f1f5f9; font-size: 12.5px; white-space: nowrap; }
        .chat-message .text { color: #cbd5e1; font-size: 13px; font-weight: 500; word-break: break-word; flex: 1; }
        .chat-message .time { color: #64748b; font-size: 10.5px; margin-left: auto; white-space: nowrap; font-weight: 600; }

        .emoji-picker-wrapper {
            position: sticky; bottom: 8px; z-index: 20; display: flex; justify-content: flex-end;
            padding-right: 6px; margin-top: auto;
        }
        .emoji-picker-btn {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer;
            transition: 0.25s; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            color: #e2e8f0; position: relative;
        }
        .emoji-picker-btn:hover { transform: scale(1.1); background: rgba(99, 102, 241, 0.35); }
        .emoji-picker-btn .emoji-list {
            position: absolute; bottom: 56px; right: 0;
            background: #111726; border-radius: 16px; padding: 8px 10px;
            display: none; gap: 6px; border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 35px rgba(0,0,0,0.7); width: 180px; justify-content: center;
        }
        .emoji-picker-btn .emoji-list.open { display: flex; }
        .emoji-picker-btn .emoji-list span {
            font-size: 22px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: 0.2s;
        }
        .emoji-picker-btn .emoji-list span:hover { background: rgba(99, 102, 241, 0.25); transform: scale(1.2); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.25); border-radius: 6px; }

        .flying-reaction {
            position: fixed; font-size: 30px; z-index: 4; pointer-events: none;
            animation: flyUpSmooth 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes flyUpSmooth {
            0% { opacity: 0; transform: translateY(0) scale(0.3) rotate(0deg); }
            15% { opacity: 1; transform: translateY(-30px) scale(1.2) rotate(8deg); }
            40% { opacity: 1; transform: translateY(-110px) scale(1.0) rotate(-5deg); }
            70% { opacity: 0.85; transform: translateY(-220px) scale(0.85) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-340px) scale(0.4) rotate(-8deg); }
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 6px; border-radius: 16px; }
            .headline { font-size: 14.5px; margin: 8px 0 4px; }
            .claim-btn { padding: 14px 28px; font-size: 16px; max-width: 100%; }
            .popup-card { padding: 18px 16px; max-width: 360px; }
            .popup-title { font-size: 19px; }
            .popup-claim-btn { font-size: 15.5px; padding: 13px; }
            .chat-section { border-radius: 14px; margin-top: 4px; }
            .chat-message { padding: 7px 10px; font-size: 12px; gap: 6px; }
            .chat-message .avatar { width: 28px; height: 28px; font-size: 12px; }
            .sound-toggle { width: 36px; height: 36px; font-size: 16px; bottom: 75px; right: 14px; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container" id="videoContainer">
                <div class="video-badge-live">
                    <span class="live-dot"></span> HD 1080P
                </div>
                <div id="videoPlayer"></div>
                <div class="video-overlay" id="videoOverlay"></div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video & Unlock Reward</div>
            <div class="claim-btn-wrapper" id="claimBtnWrapper">
                <button class="claim-btn" id="claimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <!-- Live Chat Section -->
    <div class="chat-section" id="chatSection">
        <div class="chat-header-bar">
            <span class="chat-title">💬 Live Activity Chat</span>
            <span class="online-badge"><span class="online-dot"></span> 1.8k Online</span>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="emoji-picker-wrapper">
                <div class="emoji-picker-btn" id="emojiPickerBtn" onclick="toggleEmojiPicker()">
                    😊
                    <div class="emoji-list" id="emojiList">
                        <span onclick="triggerReaction('🥳', event)">🥳</span>
                        <span onclick="triggerReaction('🤩', event)">🤩</span>
                        <span onclick="triggerReaction('😍', event)">😍</span>
                        <span onclick="triggerReaction('🔥', event)">🔥</span>
                        <span onclick="triggerReaction('💎', event)">💎</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== ✨ STRICT 16:9 ENTRANCE POPUP MODAL ✨ ==================== -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card" id="popupCard">
            <!-- Strict 16:9 Aspect Ratio Container (No image cropping) -->
            <div class="popup-image-container" id="popupImageContainer">
                <div class="popup-placeholder" id="popupPlaceholder">
                    🎬
                    <span>Reward Banner (16:9)</span>
                </div>
                <img id="popupImg" class="popup-main-img" referrerpolicy="no-referrer" style="display:none;" alt="16:9 Banner Image">
            </div>

            <div class="popup-pill-tag">
                <span class="tag-dot"></span> Special Reward Unlocked
            </div>
            <div class="popup-title" id="popupTitle">🎁 Claim Your Reward</div>
            <div class="popup-sub" id="popupSub">Tap below to unlock your reward</div>
            <button class="popup-claim-btn" id="popupClaimBtn">
                <span>🔓 Unlock Now</span> <span>➜</span>
            </button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

    <script>
        // ==================== CONFIG ====================
        const pathSegments = window.location.pathname.split('/');
        const linkId = pathSegments[pathSegments.length - 1] || 'default';
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        let claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        let buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        let headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video & Unlock Reward';

        document.getElementById('headline').textContent = headline;
        document.getElementById('claimBtn').textContent = buttonText ? '🎁 ' + buttonText : '🎁 Claim Now';

        // Robust YouTube Video ID Extractor
        function extractYouTubeId(url) {
            if (!url) return null;
            const clean = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
            const match = clean.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match : null;
        }

        // ==================== STATE ====================
        let backPressCount = 0, isUnlocked = false, isExiting = false;
        let isVideoPlaying = false, isPopupClaimed = false, isSoundEnabled = true, isCelebrationActive = false;
        let isPopupClickProcessed = false;
        let isRedirecting = false;
        let isClaimTracked = false;

        const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // ==================== STRICT VIDEO LOCK & BACK PRESS TRAP ====================
        function pushHistoryTrap() {
            for (let i = 0; i < 10; i++) {
                history.pushState({ trap: i }, null, window.location.href);
            }
        }
        pushHistoryTrap();

        function handleBackPress() {
            if (isExiting) return true;

            // Agar video complete ho chuki hai, tab normal exit allow karo
            if (isUnlocked) {
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            // Agar video poori nahi dekhi gayi hai:
            // User ko baar baar (kam se kam 6 baar) phone ka back button press karna hoga tab jaake exit hoga
            backPressCount++;
            if (backPressCount >= 6) {
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            // Re-lock the history stack
            history.pushState({ trap: Date.now() }, null, window.location.href);
            return false;
        }

        window.addEventListener('popstate', function() {
            handleBackPress();
        });

        document.addEventListener('keydown', function(e) {
            if (['Escape', 'F5'].includes(e.key) || (e.ctrlKey && ['w', 'r'].includes(e.key)) || (e.altKey && e.key === 'F4') || (e.metaKey && e.key === 'w')) {
                e.preventDefault(); e.stopPropagation();
                if (!isUnlocked) {
                    handleBackPress();
                } else {
                    isExiting = true;
                    document.body.innerHTML = '';
                    window.location.href = 'about:blank';
                }
                return false;
            }
        }, true);

        // ==================== AUDIO SYNTHESIZER ====================
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('soundToggle').textContent = isSoundEnabled ? '🔊' : '🔇';
        }

        function playCelebrationSound() {
            if (!isSoundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 587.33, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.frequency.value = freq; osc.type = 'sine';
                        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.35);
                    }, index * 120);
                });
                setTimeout(() => {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain); gain.connect(audioCtx.destination);
                            osc.frequency.value = freq; osc.type = 'sine';
                            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.6);
                        }, i * 80);
                    });
                }, 550);
            } catch(e) {}
        }

        // ==================== CONFETTI ENGINE ====================
        function triggerCelebration() {
            if (isCelebrationActive) return;
            isCelebrationActive = true;
            const container = document.getElementById('confettiContainer');
            container.innerHTML = ''; container.classList.add('active');
            playCelebrationSound();

            const colors = ['#6366f1', '#8b5cf6', '#10b981', '#3b82f6', '#f59e0b', '#f43f5e', '#ec4899', '#14b8a6', '#f97316'];
            const burstCount = isMobile ? 35 : 60;
            const fallCount = isMobile ? 50 : 80;

            for (let i = 0; i < burstCount; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-burst-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const w = isMobile ? 3 + Math.random() * 5 : 6 + Math.random() * 12;
                const h = isMobile ? 4 + Math.random() * 7 : 8 + Math.random() * 14;
                el.style.width = w + 'px'; el.style.height = h + 'px';
                el.style.background = color;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                const angle = Math.random() * 2 * Math.PI;
                const dist = isMobile ? 80 + Math.random() * 200 : 150 + Math.random() * 400;
                const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist - (isMobile ? 50 : 100);
                const tx3 = Math.cos(angle + 0.8) * (dist * 0.25), ty3 = Math.sin(angle + 0.8) * (dist * 0.25) - (isMobile ? 15 : 20);
                el.style.setProperty('--tx', tx + 'px'); el.style.setProperty('--ty', ty + 'px');
                el.style.setProperty('--tx3', tx3 + 'px'); el.style.setProperty('--ty3', ty3 + 'px');
                el.style.left = (50 + Math.random() * 6 - 3) + '%';
                el.style.top = (45 + Math.random() * 10 - 5) + '%';
                el.style.animationDelay = (Math.random() * 0.15) + 's';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(el);
            }

            for (let i = 0; i < fallCount; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const w = isMobile ? 3 + Math.random() * 5 : 6 + Math.random() * 12;
                const h = isMobile ? 4 + Math.random() * 7 : 8 + Math.random() * 14;
                el.style.width = w + 'px'; el.style.height = h + 'px';
                el.style.background = color;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                const angle = Math.random() * 2 * Math.PI;
                el.style.left = Math.random() * 100 + '%';
                el.style.top = '-10%';
                const duration = isMobile ? (1.2 + Math.random() * 1.5) : (1.5 + Math.random() * 2);
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = (Math.random() * 0.4) + 's';
                container.appendChild(el);
            }

            setTimeout(() => { 
                container.innerHTML = ''; 
                container.classList.remove('active'); 
                isCelebrationActive = false; 
            }, isMobile ? 1800 : 2500);
        }

        // ==================== STRICT 16:9 IMAGE LOADING SYSTEM ====================
        async function loadPopupData() {
            try {
                const response = await fetch(`/api/link/${linkId}`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update latest link details from server
                    if (data.video) videoUrl = data.video;
                    if (data.claim) claimUrl = data.claim;
                    if (data.buttonText) {
                        buttonText = data.buttonText;
                        document.getElementById('claimBtn').textContent = '🎁 ' + buttonText;
                    }
                    if (data.headline) {
                        headline = data.headline;
                        document.getElementById('headline').textContent = headline;
                    }

                    const popup = data.popupSettings || {};
                    if (popup.title) document.getElementById('popupTitle').textContent = popup.title;
                    if (popup.subtitle) document.getElementById('popupSub').textContent = popup.subtitle;
                    if (popup.buttonText) document.getElementById('popupClaimBtn').querySelector('span').textContent = '🔓 ' + popup.buttonText;
                    
                    const imgUrl = popup.image || data.image;
                    if (imgUrl && typeof imgUrl === 'string' && imgUrl.trim().length > 4) {
                        const img = document.getElementById('popupImg');
                        img.referrerPolicy = 'no-referrer';
                        img.src = imgUrl.trim();
                        img.onload = () => {
                            img.style.display = 'block';
                            document.getElementById('popupPlaceholder').style.display = 'none';
                        };
                        img.onerror = () => {
                            tryFallback();
                        };
                        return;
                    }
                }
            } catch (e) {
                tryFallback();
                return;
            }
            tryFallback();
        }

        async function tryFallback() {
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const s = await res.json();
                    if (s && s.background && s.background.trim().length > 4) {
                        const img = document.getElementById('popupImg');
                        img.referrerPolicy = 'no-referrer';
                        img.src = s.background.trim();
                        img.onload = () => {
                            img.style.display = 'block';
                            document.getElementById('popupPlaceholder').style.display = 'none';
                        };
                        return;
                    }
                }
            } catch(e) {}
            document.getElementById('popupImg').style.display = 'none';
            document.getElementById('popupPlaceholder').style.display = 'flex';
        }

        function showPopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function hidePopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.remove('show');
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ==================== UNLOCK & PLAY SYSTEM ====================
        function unlockAndPlay() {
            if (isPopupClaimed) return;
            isPopupClaimed = true;
            hidePopup();
            
            // Video starts in LOCKED state until completed
            isUnlocked = false;
            backPressCount = 0;
            
            setTimeout(() => {
                document.getElementById('headline').classList.add('show');
                document.getElementById('claimBtnWrapper').classList.add('show');
                document.getElementById('chatSection').classList.add('show');
                loadVideo();
            }, 200);
        }

        // Called when user finishes watching the video
        function onVideoFinished() {
            if (isUnlocked) return;
            isUnlocked = true;
            document.getElementById('headline').textContent = '🎉 Video Completed! Reward Unlocked!';
            document.getElementById('claimBtn').style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            document.getElementById('claimBtn').textContent = buttonText ? '🎁 ' + buttonText : '🎁 Claim Reward Now';
            triggerCelebration();
        }

        function trackClaimOnce() {
            if (isClaimTracked) return;
            isClaimTracked = true;
            fetch(`/api/track-claim/${linkId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }).catch(() => {});
        }

        function handleClaimClick() {
            if (!isUnlocked) {
                alert('⚠️ Please watch the complete video to unlock your reward!');
                return;
            }
            if (isRedirecting) return;
            isRedirecting = true;
            trackClaimOnce();
            
            if (claimUrl && claimUrl !== '#' && claimUrl !== '') {
                setTimeout(() => { window.location.replace(claimUrl); }, 300);
            } else {
                setTimeout(() => { alert('🎉 Reward Claimed Successfully!'); }, 300);
            }
        }

        function addRipple(e, btn) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        document.getElementById('popupClaimBtn').addEventListener('click', function(e) {
            e.stopPropagation(); e.preventDefault();
            if (isPopupClaimed || isPopupClickProcessed) return;
            isPopupClickProcessed = true;
            addRipple(e, this);
            unlockAndPlay();
        });

        document.getElementById('popupCard').addEventListener('click', function(e) {
            if (e.target.closest('.popup-claim-btn') || isPopupClaimed || isPopupClickProcessed) return;
            isPopupClickProcessed = true;
            unlockAndPlay();
        });

        document.getElementById('claimBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            addRipple(e, this);
            handleClaimClick();
        });

        // ==================== VIDEO PLAYBACK (YOUTUBE + MP4) ====================
        function forcePlayVideo(iframe) {
            try {
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[100]}', '*');
            } catch(e) {}
        }

        function loadVideo() {
            const container = document.getElementById('videoPlayer');
            container.innerHTML = '';
            
            const ytVideoId = extractYouTubeId(videoUrl);
            if (ytVideoId) {
                const iframe = document.createElement('iframe');
                iframe.id = 'ytPlayer';
                iframe.src = `https://www.youtube.com/embed/${ytVideoId}?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                container.appendChild(iframe);
                
                iframe.onload = function() {
                    forcePlayVideo(iframe);
                    setTimeout(() => forcePlayVideo(iframe), 400);
                    setTimeout(() => forcePlayVideo(iframe), 1200);
                };
                return;
            }

            // Native MP4/WebM Video Fallback
            const video = document.createElement('video');
            video.muted = false;
            video.playsInline = true;
            video.autoplay = true;
            video.loop = false; // Video poori hone par unlock hoga
            video.controls = true;
            video.style.cssText = 'width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:5;background:#000;';
            const source = document.createElement('source');
            source.src = videoUrl;
            video.appendChild(source);
            container.appendChild(video);
            
            video.onended = function() {
                onVideoFinished();
            };
            
            video.play().catch(() => {
                video.muted = true;
                video.play().catch(() => {});
            });
        }

        // Listen for YouTube API State Changes via postMessage
        window.addEventListener('message', function(event) {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (data && data.event === 'onStateChange') {
                    if (data.info === 0) { // YT.PlayerState.ENDED (Video watched completely)
                        onVideoFinished();
                    } else if (data.info === 1) { // YT.PlayerState.PLAYING
                        isVideoPlaying = true;
                    }
                }
            } catch (err) {}
        });

        // ==================== EMOJI PICKER & REACTIONS ====================
        function toggleEmojiPicker() {
            document.getElementById('emojiList').classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            const picker = document.getElementById('emojiPickerBtn');
            if (picker && !picker.contains(e.target)) document.getElementById('emojiList').classList.remove('open');
        });

        const flyingEmojis = ['🎁', '💎', '🥳', '🎊', '🎉', '❤️', '🤩', '🔥', '🤑', '👑'];
        function createFlyingReaction(emoji) {
            const el = document.createElement('div');
            el.className = 'flying-reaction';
            el.textContent = emoji || flyingEmojis[Math.floor(Math.random() * flyingEmojis.length)];
            el.style.left = (10 + Math.random() * 80) + '%';
            el.style.top = (55 + Math.random() * 35) + '%';
            document.body.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 3200);
        }

        function triggerReaction(emoji, event) {
            document.getElementById('emojiList').classList.remove('open');
            createFlyingReaction(emoji);
        }

        // ==================== LIVE ACTIVITY CHAT ====================
        const users = [
            { name: 'GamerPro', emoji: '🎮', vip: true }, { name: 'KingSlayer', emoji: '👑', vip: true }, { name: 'NightWolf', emoji: '🐺', vip: false },
            { name: 'ShadowX', emoji: '🌙', vip: false }, { name: 'BlazeIt', emoji: '🔥', vip: true }, { name: 'SniperPro', emoji: '🎯', vip: false },
            { name: 'DemonKing', emoji: '😈', vip: true }, { name: 'Phoenix', emoji: '🐦', vip: false }, { name: 'DarkKnight', emoji: '🦇', vip: true },
            { name: 'StarGamer', emoji: '⭐', vip: false }, { name: 'ThunderX', emoji: '⚡', vip: true }, { name: 'IceQueen', emoji: '❄️', vip: false },
            { name: 'FireLord', emoji: '🔥', vip: true }, { name: 'CryptoKing', emoji: '💰', vip: true }, { name: 'GhostRider', emoji: '👻', vip: false },
            { name: 'Venom', emoji: '🕷️', vip: false }, { name: 'WizardX', emoji: '🧙', vip: true }, { name: 'NinjaPro', emoji: '🥷', vip: false },
            { name: 'DragonSlayer', emoji: '🐉', vip: true }, { name: 'MysticMoon', emoji: '🌙', vip: false }
        ];
        const messages = [
            'Thanks bhai! 500₹ ka code mil gaya!', 'Redeem code working 100%!', '1000₹ ka redeem code instant!',
            'Best website ever bro!', 'Got my diamond bundle, superb!', 'Bro thanks a lot for the code!',
            'Amazing! 100% trusted!', 'Got 500₹ Google play card!', 'Love this reward!', 'Best app for gamers!',
            'Working perfectly bhai!', 'Awesome experience!', 'Claimed successfully!', 'Super fast reward!',
            'Thanks team!', 'Nice! Working 100%!', 'Love it, instant delivery!', 'Booyah! Got the skin!'
        ];
        const chatContainer = document.getElementById('chatMessages');
        let activeChatList = [];

        function formatHumanTime(diffSec) {
            if (diffSec <= 1) return 'just now';
            if (diffSec < 60) return diffSec + 's ago';
            const m = Math.floor(diffSec / 60);
            return m + 'm ago';
        }

        function updateChatTimes() {
            const now = Date.now();
            activeChatList.forEach(item => {
                const diff = Math.max(0, Math.floor((now - item.created) / 1000));
                const timeSpan = item.el.querySelector('.time');
                if (timeSpan) timeSpan.textContent = formatHumanTime(diff);
            });
        }

        function addChat() {
            const user = users[Math.floor(Math.random() * users.length)];
            const msg = messages[Math.floor(Math.random() * messages.length)];
            const el = document.createElement('div');
            el.className = 'chat-message';
            el.innerHTML = `
                <span class="avatar">${user.emoji}</span>
                <span class="username">${user.name}</span>
                ${user.vip ? '<span class="vip-tag">VIP</span>' : ''}
                <span class="text">${msg}</span>
                <span class="time">just now</span>
            `;
            chatContainer.appendChild(el);
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;

            activeChatList.push({ el: el, created: Date.now() });

            while (activeChatList.length > 25) {
                const oldest = activeChatList.shift();
                if (oldest && oldest.el && oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
            }
            applyFadeEffect();
        }

        function applyFadeEffect() {
            const msgs = chatContainer.querySelectorAll('.chat-message');
            const total = msgs.length;
            msgs.forEach((msg, index) => {
                if (index >= total - 4) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '1';
                } else if (index >= total - 8) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '0.75';
                } else {
                    msg.classList.add('fade-out');
                }
            });
        }

        for (let i = 0; i < 3; i++) {
            setTimeout(addChat, i * 400);
        }
        setInterval(addChat, 2200);
        setInterval(updateChatTimes, 1000);
        setInterval(() => { if (Math.random() > 0.5) createFlyingReaction(); }, 3500);

        // ==================== FULLSCREEN & WAKELOCK ====================
        async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
        keepAwake();

        document.getElementById('videoContainer').addEventListener('click', function() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            }
        });

        // ==================== INIT ====================
        async function init() {
            await loadPopupData();
            showPopup();
        }
        init();
    </script>
</body>
</html>
