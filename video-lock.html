<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .top-section {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 6px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.06);
            padding: 8px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .video-container iframe {
            z-index: 5;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ===== OVERLAY TO BLOCK CLICKS ===== */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            cursor: default;
            touch-action: none;
        }

        .headline {
            text-align: center;
            margin: 10px 0 4px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 4px;
            animation: fadeIn 1.2s ease;
        }

        .claim-btn {
            padding: 14px 60px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 400px;
        }

        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.4);
        }

        .claim-btn:active {
            transform: scale(0.97);
        }

        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(10px);
        }

        @keyframes btnGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== LIVE CHAT ===== */
        .chat-section {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease;
            margin-top: 4px;
        }

        /* ===== TOP FADE GRADIENT (Blue Line Area - Chat Fades Out Here) ===== */
        .chat-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, #0a0a1a, transparent);
            z-index: 10;
            pointer-events: none;
        }

        /* ===== BOTTOM FADE GRADIENT ===== */
        .chat-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to top, #0a0a1a, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 14px;
            padding-top: 30px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-bottom: 8px;
        }

        /* ===== CHAT MESSAGE ===== */
        .chat-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            border-left: 3px solid rgba(102, 126, 234, 0.15);
            font-size: 13px;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            animation: fadeInUpChat 0.4s ease forwards;
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }

        @keyframes fadeInUpChat {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== FADE OUT AT TOP (Blue Line Area) - CHATS & REACTIONS BOTH FADE ===== */
        .chat-message.fade-out {
            opacity: 0 !important;
            transform: translateY(-20px) scale(0.9) !important;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* ===== REACTION BUTTONS INSIDE CHAT - FADE WITH CHAT ===== */
        .chat-message .reaction-btn {
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            padding: 2px 5px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: #fff;
            line-height: 1;
        }

        .chat-message .reaction-btn:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chat-message .username {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            white-space: nowrap;
            min-width: 50px;
        }

        .chat-message .text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            font-weight: 300;
            word-break: break-word;
            flex: 1;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.2);
            font-size: 9px;
            margin-left: 4px;
            white-space: nowrap;
            font-weight: 300;
        }

        .chat-message .reactions {
            display: flex;
            gap: 3px;
            margin-left: 6px;
            flex-shrink: 0;
            align-items: center;
        }

        /* ===== EMOJI PICKER - STABLE AT BOTTOM RIGHT ===== */
        .emoji-picker-wrapper {
            position: sticky;
            bottom: 8px;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            padding-right: 6px;
            margin-top: auto;
        }

        .emoji-picker-btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .emoji-picker-btn:hover {
            background: rgba(102, 126, 234, 0.4);
            transform: scale(1.1);
        }

        .emoji-picker-btn .emoji-list {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 12px;
            padding: 8px;
            display: none;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            width: 160px;
            justify-content: center;
        }

        .emoji-picker-btn .emoji-list.open {
            display: flex;
        }

        .emoji-picker-btn .emoji-list span {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .emoji-picker-btn .emoji-list span:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: scale(1.2);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.2);
            border-radius: 4px;
        }

        /* ===== FLYING REACTIONS - BEHIND VIDEO (z-index: 4) ===== */
        .flying-reaction {
            position: fixed;
            font-size: 28px;
            z-index: 4;
            pointer-events: none;
            animation: flyUpSmooth 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes flyUpSmooth {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.3) rotate(0deg);
            }
            15% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2) rotate(8deg);
            }
            40% {
                opacity: 1;
                transform: translateY(-100px) scale(1.0) rotate(-5deg);
            }
            70% {
                opacity: 0.8;
                transform: translateY(-200px) scale(0.8) rotate(10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-320px) scale(0.4) rotate(-8deg);
            }
        }

        .flying-reaction.type-1 { animation-duration: 2.5s; }
        .flying-reaction.type-2 { animation-duration: 3.2s; }
        .flying-reaction.type-3 { animation-duration: 2.8s; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 5px; border-radius: 12px; }
            .video-container { border-radius: 8px; }
            .video-container::before { border-radius: 10px; }
            .headline { font-size: 14px; margin: 6px 0 3px; }
            .claim-btn { padding: 12px 40px; font-size: 16px; max-width: 100%; }
            .claim-btn::before { border-radius: 40px; }
            .chat-section { border-radius: 8px; margin-top: 2px; }
            .chat-message { padding: 5px 10px; font-size: 11px; gap: 6px; }
            .chat-message .avatar { width: 26px; height: 26px; font-size: 11px; }
            .chat-message .username { font-size: 10px; min-width: 40px; }
            .chat-message .text { font-size: 10px; }
            .chat-message .time { font-size: 8px; }
            .chat-container { padding: 6px 10px; padding-top: 25px; padding-bottom: 15px; }
            .flying-reaction { font-size: 22px; }
            .emoji-picker-btn { width: 38px; height: 38px; font-size: 16px; }
            .emoji-picker-btn .emoji-list { width: 140px; bottom: 48px; }
            .emoji-picker-btn .emoji-list span { font-size: 20px; }
        }

        @media (max-width: 400px) {
            .headline { font-size: 12px; }
            .claim-btn { padding: 10px 30px; font-size: 14px; max-width: 100%; }
            .chat-message { padding: 4px 8px; font-size: 10px; gap: 4px; }
            .chat-message .avatar { width: 22px; height: 22px; font-size: 9px; }
            .chat-message .username { font-size: 9px; min-width: 35px; }
            .chat-message .text { font-size: 9px; }
            .chat-message .time { font-size: 7px; }
            .chat-container { padding: 4px 6px; padding-top: 20px; padding-bottom: 12px; }
            .flying-reaction { font-size: 18px; }
            .emoji-picker-btn { width: 32px; height: 32px; font-size: 14px; }
            .emoji-picker-btn .emoji-list { width: 120px; bottom: 42px; }
            .emoji-picker-btn .emoji-list span { font-size: 16px; }
        }

        :-webkit-full-screen .video-container { border-radius: 0; }
        :-webkit-full-screen .video-wrapper { border-radius: 0; padding: 0; border: none; box-shadow: none; background: transparent; }
        :-webkit-full-screen .video-container::before { display: none; }
        :-webkit-full-screen .top-section { max-width: 100%; }
        :-webkit-full-screen .chat-section { max-width: 100%; border-radius: 0; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container">
                <div id="videoContainer">
                    <!-- Video will be inserted here -->
                </div>
                <!-- OVERLAY TO BLOCK CLICKS - SCREEN LOCK -->
                <div class="video-overlay" id="videoOverlay"></div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video</div>
            <div class="claim-btn-wrapper">
                <button class="claim-btn" id="claimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
            <!-- EMOJI PICKER - RIGHT SIDE, STABLE -->
            <div class="emoji-picker-wrapper">
                <div class="emoji-picker-btn" id="emojiPickerBtn" onclick="toggleEmojiPicker()">
                    😊
                    <div class="emoji-list" id="emojiList">
                        <span onclick="triggerReaction('🥳', event)">🥳</span>
                        <span onclick="triggerReaction('🤩', event)">🤩</span>
                        <span onclick="triggerReaction('😍', event)">😍</span>
                        <span onclick="triggerReaction('😎', event)">😎</span>
                        <span onclick="triggerReaction('😮', event)">😮</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== PARAMS ====================
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        const claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        const buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        const headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video';

        document.getElementById('headline').textContent = headline;
        document.getElementById('claimBtn').textContent = buttonText || '🎁 Claim Now';

        // ==================== FIX YOUTUBE URL ====================
        function fixYouTubeUrl(url) {
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1].split('&')[0];
                return 'https://youtu.be/' + videoId;
            }
            if (url.includes('youtu.be/')) return url;
            if (url.includes('youtube.com/embed/')) return url;
            if (url.match(/^[a-zA-Z0-9_-]{11}$/)) return 'https://youtu.be/' + url;
            return url;
        }

        videoUrl = fixYouTubeUrl(videoUrl);
        console.log('🎬 Fixed YouTube URL:', videoUrl);

        // ==================== SCREEN LOCK - IMMEDIATE ====================
        // Block all touch events on video area
        const overlay = document.getElementById('videoOverlay');
        overlay.addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, { passive: false });

        overlay.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });

        overlay.addEventListener('touchmove', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, { passive: false });

        // Lock screen orientation
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function() {});
        }

        // Prevent any touch events from leaving the page
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // ==================== SMART EXIT SYSTEM ====================
        let backPressCount = 0;
        let videoPlayCount = 0;
        let isUnlocked = false;
        let pageLoadTime = Date.now();
        let isExiting = false;
        let backPressTimer = null;

        function trackVideoPlay() {
            videoPlayCount++;
            console.log('🎬 Video play count:', videoPlayCount);
            if (videoPlayCount >= 2) {
                isUnlocked = true;
                console.log('✅ UNLOCKED after 2 video plays');
            }
        }

        function handleBackPress() {
            if (isExiting) return true;

            const timeElapsed = (Date.now() - pageLoadTime) / 1000;

            console.log('⬅️ Back press - Time:', timeElapsed.toFixed(1) + 's');

            // Exit if unlocked
            if (isUnlocked) {
                console.log('🚪 Exiting (unlocked)');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            // Exit after 3 minutes (180 seconds)
            if (timeElapsed >= 180) {
                console.log('🚪 Exiting after 3+ minutes');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            // Increment back press count
            backPressCount++;
            console.log('⬅️ Back press count:', backPressCount);

            // Show toast message on first back press
            if (backPressCount === 1) {
                showToast('Press back 3 more times to exit');
            } else if (backPressCount === 2) {
                showToast('2 more back presses to exit');
            } else if (backPressCount === 3) {
                showToast('1 more back press to exit');
            }

            // Exit after 4 back presses
            if (backPressCount >= 4) {
                console.log('🚪 Exiting after 4 back presses');
                isExiting = true;
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            history.pushState(null, null, window.location.href);
            return false;
        }

        // ===== TOAST MESSAGE =====
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                color: #fff;
                padding: 12px 24px;
                border-radius: 12px;
                font-size: 14px;
                z-index: 9999;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                animation: fadeIn 0.3s ease;
                max-width: 90%;
                text-align: center;
                font-weight: 500;
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2000);
        }

        // Push initial state
        history.pushState(null, null, window.location.href);

        // Handle back button (popstate)
        window.addEventListener('popstate', function(e) {
            handleBackPress();
        });

        // ===== BLOCK EXIT ATTEMPTS =====
        document.addEventListener('keydown', function(e) {
            const isExitKey = e.key === 'Escape' || e.key === 'F5' || 
                (e.ctrlKey && (e.key === 'w' || e.key === 'r')) || 
                (e.altKey && e.key === 'F4') ||
                (e.metaKey && e.key === 'w');

            if (isExitKey) {
                e.preventDefault();
                e.stopPropagation();
                if (!isUnlocked) {
                    handleBackPress();
                } else {
                    isExiting = true;
                    document.body.innerHTML = '';
                    window.location.href = 'about:blank';
                }
                return false;
            }
        }, true);

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ===== BLOCK SWIPE BACK =====
        let touchStartX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (diff > 80) {
                e.preventDefault();
                if (!isUnlocked) {
                    handleBackPress();
                }
                return false;
            }
        }, { passive: false });

        // ===== BLOCK TAB SWITCH =====
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && !isUnlocked) {
                setTimeout(function() { window.focus(); }, 50);
                handleBackPress();
            }
        });

        // ===== LOAD VIDEO =====
        function loadVideo() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            console.log('🎬 Loading video:', videoUrl);

            const ytId = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);

            if (ytId) {
                console.log('📺 YouTube Video ID:', ytId[1]);
                const iframe = document.createElement('iframe');
                iframe.src = 'https://www.youtube.com/embed/' + ytId[1] + 
                    '?autoplay=1&controls=1&modestbranding=1&rel=0&showinfo=0&fs=1&loop=1&playlist=' + ytId[1] +
                    '&disablekb=1&iv_load_policy=3&cc_load_policy=0';
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                
                iframe.onload = function() {
                    console.log('✅ YouTube iframe loaded');
                    trackVideoPlay();
                };

                container.appendChild(iframe);

                setTimeout(function() {
                    trackVideoPlay();
                }, 4000);

                return;
            }

            console.log('🎥 Loading as iframe:', videoUrl);
            const iframe = document.createElement('iframe');
            iframe.src = videoUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';

            iframe.onload = function() {
                console.log('✅ Iframe loaded');
                trackVideoPlay();
            };

            container.appendChild(iframe);

            setTimeout(function() {
                trackVideoPlay();
            }, 4000);
        }

        // ==================== EMOJI PICKER ====================
        function toggleEmojiPicker() {
            const list = document.getElementById('emojiList');
            list.classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            const picker = document.getElementById('emojiPickerBtn');
            if (!picker.contains(e.target)) {
                document.getElementById('emojiList').classList.remove('open');
            }
        });

        // ==================== FLYING REACTIONS - BEHIND VIDEO (z-index: 4) ====================
        const flyingEmojis = ['🎁', '💎', '🥳', '🎊', '🎉', '❤️', '🤩', '😮', '🤑', '😱'];

        function createFlyingReaction(emoji) {
            const emojiToUse = emoji || flyingEmojis[Math.floor(Math.random() * flyingEmojis.length)];
            const el = document.createElement('div');
            el.className = 'flying-reaction';
            el.textContent = emojiToUse;
            
            const x = 10 + Math.random() * 80;
            const y = 55 + Math.random() * 35;
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (24 + Math.random() * 32) + 'px';
            
            const type = Math.floor(Math.random() * 3) + 1;
            el.classList.add('type-' + type);
            
            document.body.appendChild(el);
            
            setTimeout(function() {
                if (el.parentNode) el.remove();
            }, 3500);
        }

        // ==================== CHAT SYSTEM ====================
        const users = [
            { name: 'GamerPro', emoji: '🎮' },
            { name: 'KingSlayer', emoji: '👑' },
            { name: 'NightWolf', emoji: '🐺' },
            { name: 'ShadowX', emoji: '🌙' },
            { name: 'BlazeIt', emoji: '🔥' },
            { name: 'SniperPro', emoji: '🎯' },
            { name: 'DemonKing', emoji: '😈' },
            { name: 'Phoenix', emoji: '🐦' },
            { name: 'DarkKnight', emoji: '🦇' },
            { name: 'StarGamer', emoji: '⭐' },
            { name: 'ThunderX', emoji: '⚡' },
            { name: 'IceQueen', emoji: '❄️' },
            { name: 'FireLord', emoji: '🔥' },
            { name: 'CryptoKing', emoji: '💰' },
            { name: 'GhostRider', emoji: '👻' },
            { name: 'Venom', emoji: '🕷️' },
            { name: 'WizardX', emoji: '🧙' },
            { name: 'NinjaPro', emoji: '🥷' },
            { name: 'DragonSlayer', emoji: '🐉' },
            { name: 'MysticMoon', emoji: '🌙' }
        ];

        const messages = [
            'Thanks bhai!', 'Redeem code mil gaya!', '1000₹ ka redeem code!',
            'Best website ever!', 'Bro thanks a lot!', 'Redeem code working!',
            'Amazing!', 'Got 500₹!', 'Love this!', 'Best app!',
            'Thank you!', 'Working perfectly!', 'Awesome!', 'Great!',
            'Superb!', 'Thanks team!', 'Nice!', 'Love it!',
            'Working!', 'Super!'
        ];

        const chatContainer = document.getElementById('chatMessages');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomTime() {
            const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            const s = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            return m + ':' + s;
        }

        // ===== ADD CHAT =====
        function addChat() {
            const user = getRandom(users);
            const msg = getRandom(messages);
            const time = getRandomTime();

            const el = document.createElement('div');
            el.className = 'chat-message';
            el.innerHTML = `
                <span class="avatar">${user.emoji}</span>
                <span class="username">${user.name}</span>
                <span class="text">${msg}</span>
                <span class="time">${time}</span>
            `;
            chatContainer.appendChild(el);

            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;

            while (chatContainer.children.length > 25) {
                chatContainer.removeChild(chatContainer.firstChild);
            }

            applyFadeEffect();

            if (Math.random() > 0.5) {
                setTimeout(function() {
                    createFlyingReaction();
                }, 300);
            }
        }

        // ===== APPLY FADE EFFECT - CHATS FADE AT BLUE LINE =====
        function applyFadeEffect() {
            const messages = chatContainer.querySelectorAll('.chat-message');
            const total = messages.length;

            messages.forEach((msg, index) => {
                // Bottom 3 messages - Fully visible
                if (index >= total - 3) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '1';
                    msg.style.transform = 'translateY(0) scale(1)';
                    msg.style.animation = 'none';
                } 
                // Middle messages - Slightly faded
                else if (index >= total - 8) {
                    msg.classList.remove('fade-out');
                    msg.style.opacity = '0.8';
                    msg.style.transform = 'translateY(0) scale(0.98)';
                } 
                // Old messages (top) - Fade out at blue line
                else {
                    msg.classList.add('fade-out');
                }
            });
        }

        // ===== TRIGGER REACTION =====
        function triggerReaction(emoji, event) {
            document.getElementById('emojiList').classList.remove('open');
            
            const rect = (event && event.target) ? event.target.getBoundingClientRect() : null;
            const x = rect ? ((rect.left + rect.width/2) / window.innerWidth * 100) : (20 + Math.random() * 60);
            const y = rect ? ((rect.top) / window.innerHeight * 100) : (70 + Math.random() * 20);

            const el = document.createElement('div');
            el.className = 'flying-reaction';
            el.textContent = emoji;
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (26 + Math.random() * 28) + 'px';
            
            const type = Math.floor(Math.random() * 3) + 1;
            el.classList.add('type-' + type);
            
            document.body.appendChild(el);
            
            setTimeout(function() {
                if (el.parentNode) el.remove();
            }, 3500);

            setTimeout(function() {
                createFlyingReaction();
            }, 200);
        }

        window.triggerReaction = triggerReaction;

        // ===== AUTO FLYING REACTIONS =====
        setInterval(function() {
            if (Math.random() > 0.6) {
                createFlyingReaction();
            }
        }, 3000);

        // ===== CHAT INIT =====
        for (let i = 0; i < 10; i++) {
            setTimeout(addChat, i * 120);
        }

        setInterval(function() {
            addChat();
            if (Math.random() > 0.6) {
                setTimeout(addChat, 300);
            }
        }, 1400 + Math.random() * 1000);

        // ==================== CLAIM BUTTON ====================
        document.getElementById('claimBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            var rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);

            for (let i = 0; i < 10; i++) {
                setTimeout(function() {
                    createFlyingReaction();
                }, i * 80);
            }

            isUnlocked = true;
            console.log('🔓 Unlocked via claim button');
            console.log('🔗 Redirecting to:', claimUrl);

            if (claimUrl && claimUrl !== '#') {
                window.location.href = claimUrl;
            } else {
                alert('🎉 You have been unlocked!');
                document.body.style.overflow = 'auto';
            }
        });

        // ==================== KEEP AWAKE ====================
        async function keepAwake() {
            try {
                await navigator.wakeLock.request('screen');
            } catch (e) {}
        }
        keepAwake();

        // ==================== FULLSCREEN ====================
        document.querySelector('.video-container').addEventListener('click', function() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(function() {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
        });

        // ==================== INIT ====================
        loadVideo();

        console.log('🎬 Video URL:', videoUrl);
        console.log('🎁 Claim URL:', claimUrl);
        console.log('🔘 Button Text:', buttonText);
        console.log('📝 Headline:', headline);
        console.log('🔒 SCREEN LOCK: Active');
        console.log('⏱️ EXIT RULES: 3 mins OR 4 back presses OR unlocked');
        console.log('📍 Emoji Picker: Right side, stable, below chat');
        console.log('🚫 Reactions: Behind video (z-index: 4)');
        console.log('💬 Chat: Fades out at blue line (top)');
    </script>
</body>
</html>
