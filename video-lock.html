<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .top-section {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 6px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.06);
            padding: 8px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .video-container iframe {
            z-index: 5;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .headline {
            text-align: center;
            margin: 10px 0 4px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 4px;
            animation: fadeIn 1.2s ease;
        }

        .claim-btn {
            padding: 10px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.4);
        }

        .claim-btn:active {
            transform: scale(0.97);
        }

        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(10px);
        }

        @keyframes btnGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== LIVE CHAT ===== */
        .chat-section {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease;
            margin-top: 4px;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 14px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 10px;
        }

        .chat-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid rgba(102, 126, 234, 0.2);
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateX(-8px);
            font-size: 14px;
        }

        .chat-message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chat-message .username {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            white-space: nowrap;
        }

        .chat-message .text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 300;
            word-break: break-word;
            flex: 1;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            margin-left: auto;
            white-space: nowrap;
            font-weight: 300;
        }

        .chat-message .reactions {
            display: flex;
            gap: 4px;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .chat-message .reactions .reaction-btn {
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            padding: 2px 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
        }

        .chat-message .reactions .reaction-btn:hover {
            transform: scale(1.3);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 4px;
        }

        /* ===== FLYING REACTIONS - LIMITED TO CHAT AREA ===== */
        .flying-reaction {
            position: fixed;
            font-size: 28px;
            z-index: 9999;
            pointer-events: none;
            animation: flyUp 3s ease-out forwards;
        }

        /* Reactions only fly from chat area to claim button */
        .flying-reaction.from-chat {
            animation: flyUpFromChat 3s ease-out forwards;
        }

        @keyframes flyUpFromChat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translateY(-80px) scale(1.3) rotate(10deg);
            }
            60% {
                opacity: 1;
                transform: translateY(-160px) scale(1.0) rotate(-5deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-280px) scale(0.6) rotate(8deg);
            }
        }

        .flying-reaction.type-1 { animation: flyUp1 2.5s ease-out forwards; }
        .flying-reaction.type-2 { animation: flyUp2 3.2s ease-out forwards; }
        .flying-reaction.type-3 { animation: flyUp3 2.8s ease-out forwards; }

        @keyframes flyUp1 {
            0% { opacity: 1; transform: translateY(0) scale(0.3) rotate(0deg); }
            20% { transform: translateY(-50px) scale(1.3) rotate(15deg); }
            50% { transform: translateY(-120px) scale(1.1) rotate(-10deg); }
            80% { transform: translateY(-200px) scale(0.9) rotate(8deg); }
            100% { opacity: 0; transform: translateY(-300px) scale(0.5) rotate(-5deg); }
        }

        @keyframes flyUp2 {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(-10deg); }
            25% { transform: translateY(-60px) scale(1.4) rotate(20deg); }
            55% { transform: translateY(-140px) scale(1.0) rotate(-15deg); }
            85% { transform: translateY(-220px) scale(0.8) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-320px) scale(0.4) rotate(-8deg); }
        }

        @keyframes flyUp3 {
            0% { opacity: 1; transform: translateY(0) scale(0.4) rotate(5deg); }
            30% { transform: translateY(-70px) scale(1.5) rotate(-12deg); }
            60% { transform: translateY(-160px) scale(1.1) rotate(18deg); }
            90% { transform: translateY(-240px) scale(0.7) rotate(-6deg); }
            100% { opacity: 0; transform: translateY(-340px) scale(0.3) rotate(12deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 5px; border-radius: 12px; }
            .video-container { border-radius: 8px; }
            .video-container::before { border-radius: 10px; }
            .headline { font-size: 14px; margin: 6px 0 3px; }
            .claim-btn { padding: 8px 28px; font-size: 14px; }
            .claim-btn::before { border-radius: 36px; }
            .chat-section { border-radius: 8px; margin-top: 2px; }
            .chat-message { padding: 6px 10px; font-size: 12px; gap: 6px; }
            .chat-message .avatar { width: 26px; height: 26px; font-size: 11px; }
            .chat-message .username { font-size: 11px; }
            .chat-message .text { font-size: 11px; }
            .chat-message .time { font-size: 8px; }
            .chat-message .reactions .reaction-btn { font-size: 12px; }
            .chat-container { padding: 6px 10px; }
            .flying-reaction { font-size: 22px; }
        }

        @media (max-width: 400px) {
            .headline { font-size: 12px; }
            .claim-btn { padding: 6px 18px; font-size: 12px; }
            .chat-message { padding: 4px 8px; font-size: 10px; gap: 4px; }
            .chat-message .avatar { width: 20px; height: 20px; font-size: 9px; }
            .chat-message .username { font-size: 9px; }
            .chat-message .text { font-size: 9px; }
            .chat-message .time { font-size: 7px; }
            .chat-message .reactions .reaction-btn { font-size: 10px; }
            .chat-container { padding: 4px 6px; }
            .flying-reaction { font-size: 18px; }
        }

        :-webkit-full-screen .video-container { border-radius: 0; }
        :-webkit-full-screen .video-wrapper { border-radius: 0; padding: 0; border: none; box-shadow: none; background: transparent; }
        :-webkit-full-screen .video-container::before { display: none; }
        :-webkit-full-screen .top-section { max-width: 100%; }
        :-webkit-full-screen .chat-section { max-width: 100%; border-radius: 0; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container">
                <div id="videoContainer">
                    <!-- Video will be inserted here -->
                </div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video</div>
            <div class="claim-btn-wrapper">
                <button class="claim-btn" id="claimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>

    <script>
        // ==================== PARAMS ====================
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        const claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        const buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        const headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video';

        document.getElementById('headline').textContent = headline;
        document.getElementById('claimBtn').textContent = buttonText || '🎁 Claim Now';

        // ==================== FIX YOUTUBE URL ====================
        function extractYouTubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^"&?\/\s]{11})/,
                /youtube\.com\/shorts\/([^"&?\/\s]{11})/
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            // If it's just the ID
            if (url.match(/^[a-zA-Z0-9_-]{11}$/)) return url;
            return null;
        }

        const videoId = extractYouTubeId(videoUrl);

        // ==================== INVISIBLE SCREEN LOCK ====================
        let backPressCount = 0;
        let videoPlayCount = 0;
        let isUnlocked = false;
        let lastVideoEndTime = 0;
        let videoReplayCount = 0;
        let isVideoLoaded = false;

        function trackVideoPlay() {
            videoPlayCount++;
            console.log('🎬 Video play count:', videoPlayCount);
            if (videoPlayCount >= 2) {
                isUnlocked = true;
                console.log('✅ UNLOCKED after 2 video plays');
            }
        }

        function trackVideoEnd() {
            const now = Date.now();
            if (now - lastVideoEndTime > 3000) {
                videoReplayCount++;
                console.log('🔄 Video replay count:', videoReplayCount);
                if (videoReplayCount >= 2) {
                    isUnlocked = true;
                    console.log('✅ UNLOCKED after 2 replays');
                }
                lastVideoEndTime = now;
            }
        }

        // ===== BACK BUTTON HANDLER =====
        function handleBackPress() {
            if (isUnlocked) {
                console.log('🚪 Exiting (unlocked)');
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            backPressCount++;
            console.log('⬅️ Back press:', backPressCount);

            if (backPressCount >= 5) {
                console.log('🚪 Exiting after 5 back presses');
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return true;
            }

            history.pushState(null, null, window.location.href);
            return false;
        }

        // Push initial state
        history.pushState(null, null, window.location.href);

        // Popstate handler
        window.addEventListener('popstate', function(e) {
            handleBackPress();
        });

        // ===== BLOCK ALL EXIT ATTEMPTS =====
        document.addEventListener('keydown', function(e) {
            const isExitKey = e.key === 'Escape' || e.key === 'F5' || 
                (e.ctrlKey && (e.key === 'w' || e.key === 'r')) || 
                (e.altKey && e.key === 'F4') ||
                (e.metaKey && e.key === 'w');

            if (isExitKey) {
                e.preventDefault();
                e.stopPropagation();
                if (!isUnlocked) {
                    handleBackPress();
                } else {
                    document.body.innerHTML = '';
                    window.location.href = 'about:blank';
                }
                return false;
            }
        }, true);

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ===== BLOCK SWIPE BACK =====
        let touchStartX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (diff > 80) {
                e.preventDefault();
                if (!isUnlocked) {
                    handleBackPress();
                }
                return false;
            }
        }, { passive: false });

        // ===== BLOCK TAB SWITCH =====
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && !isUnlocked) {
                setTimeout(function() { window.focus(); }, 50);
                handleBackPress();
            }
        });

        // ===== LOAD VIDEO (YOUTUBE FIXED) =====
        function loadVideo() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            console.log('🎬 Loading video:', videoUrl);

            // Try to extract YouTube ID
            const ytId = extractYouTubeId(videoUrl);

            if (ytId) {
                console.log('📺 YouTube Video ID:', ytId);
                const iframe = document.createElement('iframe');
                iframe.src = 'https://www.youtube.com/embed/' + ytId + 
                    '?autoplay=1&controls=1&modestbranding=1&rel=0&showinfo=0&fs=1&loop=1&playlist=' + ytId +
                    '&disablekb=1&iv_load_policy=3&cc_load_policy=0';
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';
                
                iframe.onload = function() {
                    console.log('✅ YouTube iframe loaded');
                    if (!isVideoLoaded) {
                        isVideoLoaded = true;
                        trackVideoPlay();
                    }
                };

                container.appendChild(iframe);

                // Track video end with interval
                let checkInterval = setInterval(function() {
                    // YouTube doesn't expose ended event easily, use time-based tracking
                    if (isVideoLoaded) {
                        // Consider replay after 30 seconds if video is still playing
                        // For simplicity, track after 20 seconds
                    }
                }, 5000);

                setTimeout(function() {
                    if (!isVideoLoaded) {
                        isVideoLoaded = true;
                        trackVideoPlay();
                    }
                }, 4000);

                return;
            }

            // ===== MP4 / DIRECT VIDEO =====
            console.log('🎥 Loading as iframe:', videoUrl);
            const iframe = document.createElement('iframe');
            iframe.src = videoUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';

            iframe.onload = function() {
                console.log('✅ Iframe loaded');
                if (!isVideoLoaded) {
                    isVideoLoaded = true;
                    trackVideoPlay();
                }
            };

            container.appendChild(iframe);

            setTimeout(function() {
                if (!isVideoLoaded) {
                    isVideoLoaded = true;
                    trackVideoPlay();
                }
            }, 4000);
        }

        // ==================== FLYING REACTIONS (FROM CHAT AREA) ====================
        const flyingEmojis = ['🎁', '💎', '🥳', '🔥', '🎊', '🎉', '❤️', '🤩', '😮', '🤑', '😱'];

        function createFlyingReaction() {
            const emoji = flyingEmojis[Math.floor(Math.random() * flyingEmojis.length)];
            const el = document.createElement('div');
            el.className = 'flying-reaction from-chat';
            el.textContent = emoji;
            
            // Position only in chat area (bottom portion)
            const x = 15 + Math.random() * 70;
            const y = 65 + Math.random() * 25; // 65% to 90% (chat area)
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (22 + Math.random() * 30) + 'px';
            
            document.body.appendChild(el);
            
            setTimeout(function() {
                if (el.parentNode) el.remove();
            }, 3200);
        }

        // ==================== FAKE CHAT ====================
        const users = [
            { name: 'GamerPro', emoji: '🎮' }, { name: 'KingSlayer', emoji: '👑' },
            { name: 'NightWolf', emoji: '🐺' }, { name: 'ShadowX', emoji: '🌙' },
            { name: 'BlazeIt', emoji: '🔥' }, { name: 'SniperPro', emoji: '🎯' },
            { name: 'DemonKing', emoji: '😈' }, { name: 'Phoenix', emoji: '🐦' },
            { name: 'DarkKnight', emoji: '🦇' }, { name: 'StarGamer', emoji: '⭐' },
            { name: 'ThunderX', emoji: '⚡' }, { name: 'IceQueen', emoji: '❄️' },
            { name: 'FireLord', emoji: '🔥' }, { name: 'CryptoKing', emoji: '💰' },
            { name: 'GhostRider', emoji: '👻' }, { name: 'Venom', emoji: '🕷️' },
            { name: 'WizardX', emoji: '🧙' }, { name: 'NinjaPro', emoji: '🥷' },
            { name: 'DragonSlayer', emoji: '🐉' }, { name: 'MysticMoon', emoji: '🌙' }
        ];

        const messages = [
            'Thanks bhai! 🎉', 'Redeem code mil gaya! 💰', '1000₹ ka redeem code! 🎁',
            'Best website ever! ⭐', 'Bro thanks a lot! 🙏', 'Redeem code working! ✅',
            'Amazing! 🔥', 'Got 500₹! 💵', 'Love this! ❤️', 'Best app! 🏆',
            'Thank you! 🙌', 'Working perfectly! 💯', 'Awesome! 😍', 'Great! 👍',
            'Superb! 🌟', 'Thanks team! 🤝', 'Nice! 👌', 'Love it! 💖',
            'Working! ✅', 'Super! 🚀'
        ];

        const chatContainer = document.getElementById('chatMessages');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomTime() {
            const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            const s = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            return m + ':' + s;
        }

        function addChat() {
            const user = getRandom(users);
            const msg = getRandom(messages);
            const time = getRandomTime();

            const el = document.createElement('div');
            el.className = 'chat-message';
            el.innerHTML = `
                <span class="avatar">${user.emoji}</span>
                <span class="username">${user.name}</span>
                <span class="text">${msg}</span>
                <span class="time">${time}</span>
                <span class="reactions">
                    <button class="reaction-btn" onclick="triggerReaction('🎁', event)">🎁</button>
                    <button class="reaction-btn" onclick="triggerReaction('🔥', event)">🔥</button>
                    <button class="reaction-btn" onclick="triggerReaction('❤️', event)">❤️</button>
                </span>
            `;
            chatContainer.appendChild(el);

            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;

            while (chatContainer.children.length > 40) {
                chatContainer.removeChild(chatContainer.firstChild);
            }

            if (Math.random() > 0.5) {
                setTimeout(createFlyingReaction, 300);
            }
        }

        function triggerReaction(emoji, event) {
            // Get click position
            const rect = (event && event.target) ? event.target.getBoundingClientRect() : null;
            const x = rect ? ((rect.left + rect.width/2) / window.innerWidth * 100) : (20 + Math.random() * 60);
            const y = rect ? ((rect.top) / window.innerHeight * 100) : (70 + Math.random() * 20);

            const el = document.createElement('div');
            el.className = 'flying-reaction from-chat';
            el.textContent = emoji;
            
            el.style.left = x + '%';
            el.style.top = y + '%';
            el.style.fontSize = (26 + Math.random() * 28) + 'px';
            
            document.body.appendChild(el);
            
            setTimeout(function() {
                if (el.parentNode) el.remove();
            }, 3200);
        }

        window.triggerReaction = triggerReaction;

        // ==================== AUTO FLYING REACTIONS ====================
        setInterval(function() {
            if (Math.random() > 0.5) {
                createFlyingReaction();
            }
        }, 3500);

        // ==================== CHAT INIT ====================
        for (let i = 0; i < 12; i++) {
            setTimeout(addChat, i * 200);
        }

        setInterval(function() {
            addChat();
            if (Math.random() > 0.6) {
                setTimeout(addChat, 400);
            }
        }, 1200 + Math.random() * 1500);

        // ==================== CLAIM BUTTON ====================
        document.getElementById('claimBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            var rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);

            // Celebration reactions
            for (let i = 0; i < 15; i++) {
                setTimeout(createFlyingReaction, i * 100);
            }

            isUnlocked = true;
            console.log('🔓 Unlocked via claim button');

            if (claimUrl && claimUrl !== '#') {
                setTimeout(function() {
                    window.location.href = claimUrl;
                }, 1500);
            } else {
                alert('🎉 You have been unlocked!');
                document.body.style.overflow = 'auto';
            }
        });

        // ==================== KEEP AWAKE ====================
        async function keepAwake() {
            try {
                await navigator.wakeLock.request('screen');
            } catch (e) {}
        }
        keepAwake();

        // ==================== FULLSCREEN ====================
        document.addEventListener('click', function fullscreenOnClick() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(function() {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
            document.removeEventListener('click', fullscreenOnClick);
        }, { once: true });

        // ==================== INIT ====================
        loadVideo();

        console.log('🎬 Video URL:', videoUrl);
        console.log('🎁 Claim URL:', claimUrl);
        console.log('🔘 Button Text:', buttonText);
        console.log('📝 Headline:', headline);
        console.log('🔒 INVISIBLE LOCK: 2 video plays OR 5 back presses to exit');
        console.log('💥 Flying reactions from chat area only');
    </script>
</body>
</html>
