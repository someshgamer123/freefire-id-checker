<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }
        .lock-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
        }
        .lock-header .timer {
            font-size: 32px;
            font-weight: bold;
            color: #ff6b6b;
        }
        .lock-header .timer.unlocked {
            color: #4CAF50;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.3);
        }
        .video-container iframe {
            width: 100%;
            height: 400px;
            border: none;
        }
        .lock-info {
            color: #888;
            margin: 20px 0;
            font-size: 14px;
            text-align: center;
        }
        .claim-btn {
            background: #666;
            color: white;
            padding: 18px 60px;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: not-allowed;
            transition: 0.3s;
            margin-top: 10px;
            opacity: 0.5;
            position: relative;
            overflow: hidden;
        }
        .claim-btn.unlocked {
            background: #4CAF50;
            cursor: pointer;
            opacity: 1;
            animation: pulse 1.5s infinite;
        }
        .claim-btn.unlocked:hover {
            transform: scale(1.05);
        }
        .claim-btn:active {
            transform: scale(0.95);
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }
        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .lock-status {
            color: #ff6b6b;
            font-size: 16px;
            margin: 10px 0;
            font-weight: bold;
        }
        .lock-status.unlocked {
            color: #4CAF50;
        }
        .progress-bar {
            width: 80%;
            max-width: 400px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #ff6b6b;
            border-radius: 2px;
            transition: width 1s linear;
            width: 0%;
        }
        .progress-bar .fill.unlocked {
            background: #4CAF50;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 600px) {
            .video-container iframe {
                height: 250px;
            }
            .claim-btn {
                padding: 15px 40px;
                font-size: 18px;
            }
            .lock-header .timer {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-header">
            🔒 Screen Locked
            <div>
                <span class="timer" id="timer">10:00</span>
            </div>
        </div>
        <div class="video-container">
            <iframe id="videoFrame" src="" allowfullscreen></iframe>
        </div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="lock-status" id="lockStatus">🔒 Screen Locked - Watch video to unlock</div>
        <button class="claim-btn" id="claimBtn">⏳ Please Wait 10 Minutes</button>
        <div class="lock-info">⚠️ Do not close this page • Screen locked for 10 minutes</div>
    </div>

    <script>
        const LOCK_DURATION = 10;
        let timeLeft = LOCK_DURATION * 60,
            isUnlocked = false,
            timerInterval, progressInterval;
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        const claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        const buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';

        function loadVideo() {
            const id = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            document.getElementById('videoFrame').src = id ?
                `https://www.youtube.com/embed/${id[1]}?autoplay=1&controls=1&rel=0` :
                videoUrl;
        }

        function startLock() {
            updateDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(progressInterval);
                    unlockScreen();
                }
            }, 1000);
            progressInterval = setInterval(() => {
                document.getElementById('progressFill').style.width = ((LOCK_DURATION * 60 - timeLeft) / (LOCK_DURATION *
                    60) * 100) + '%';
            }, 100);
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60),
                s = timeLeft % 60;
            document.getElementById('timer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            document.getElementById('claimBtn').textContent = `⏳ Please Wait ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function unlockScreen() {
            isUnlocked = true;
            document.getElementById('timer').classList.add('unlocked');
            document.getElementById('lockStatus').textContent = '✅ Screen Unlocked! Click Claim Now!';
            document.getElementById('lockStatus').classList.add('unlocked');
            document.getElementById('progressFill').classList.add('unlocked');
            const btn = document.getElementById('claimBtn');
            btn.textContent = buttonText || '🎁 Claim Now!';
            btn.classList.add('unlocked');
            btn.disabled = false;
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = this.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
                if (claimUrl && claimUrl !== '#') window.location.href = claimUrl;
                else {
                    alert('🎉 Unlocked!');
                    document.getElementById('lockOverlay').style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
        }

        window.addEventListener('popstate', function(e) {
            if (!isUnlocked) { history.pushState(null, null, window.location.href);
                showExitWarning(); }
        });
        history.pushState(null, null, window.location.href);
        document.addEventListener('keydown', function(e) {
            if (!isUnlocked && (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'w') || (e
                    .altKey && e.key === 'F4') || e.key === 'Escape')) {
                e.preventDefault();
                showExitWarning();
                return false;
            }
        });
        document.addEventListener('contextmenu', e => { if (!isUnlocked) e.preventDefault(); });
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { if (!isUnlocked) touchStartX = e.touches[0].clientX; });
        document.addEventListener('touchmove', e => {
            if (!isUnlocked && Math.abs(e.touches[0].clientX - touchStartX) > 50) {
                e.preventDefault();
                showExitWarning();
            }
        }, { passive: false });
        document.addEventListener('visibilitychange', function() {
            if (!isUnlocked && document.hidden) {
                showExitWarning();
                setTimeout(() => window.focus(), 100);
            }
        });
        async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
        keepAwake();

        function showExitWarning() {
            if (!isUnlocked) {
                const status = document.getElementById('lockStatus');
                status.textContent = '🚫 Cannot Exit! Wait 10 minutes!';
                status.style.color = '#ff6b6b';
                setTimeout(() => {
                    status.textContent = '🔒 Screen Locked - Watch video to unlock';
                    status.style.color = '#ff6b6b';
                }, 2000);
            }
        }

        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }
        setTimeout(requestFullscreen, 1000);
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement && !isUnlocked) setTimeout(requestFullscreen, 500);
        });
        loadVideo();
        startLock();
    </script>
</body>
</html>
