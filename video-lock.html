<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        /* ===== BACKGROUND GLOW ===== */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        /* ===== TOP SECTION (Video + Headline + Claim) ===== */
        .top-section {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 8px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.08), inset 0 0 50px rgba(102, 126, 234, 0.03);
            padding: 10px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            /* 16:9 */
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.1), inset 0 0 40px rgba(102, 126, 234, 0.03);
            border: 2px solid rgba(102, 126, 234, 0.12);
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        .headline {
            text-align: center;
            margin: 12px 0 6px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease;
            letter-spacing: 0.5px;
            text-shadow: 0 0 40px rgba(102, 126, 234, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 8px;
            animation: fadeIn 1.2s ease;
        }

        .claim-btn {
            padding: 12px 45px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3), 0 0 60px rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.5), 0 0 100px rgba(102, 126, 234, 0.2);
        }

        .claim-btn:active {
            transform: scale(0.97);
        }

        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5), rgba(102, 126, 234, 0.5));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(12px);
        }

        @keyframes btnGlow {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ===== BOTTOM SECTION - FAKE LIVE CHAT ===== */
        .chat-section {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease;
            margin-top: 4px;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            padding: 8px 12px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: scrollUp 0.5s linear;
            padding-bottom: 10px;
        }

        .chat-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border-left: 2px solid rgba(102, 126, 234, 0.15);
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateX(-10px);
            font-size: 13px;
        }

        .chat-message .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chat-message .username {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            white-space: nowrap;
        }

        .chat-message .text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 300;
            word-break: break-word;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.25);
            font-size: 9px;
            margin-left: auto;
            white-space: nowrap;
            font-weight: 300;
        }

        /* Chat animations */
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-100%);
            }
        }

        /* Custom scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .video-wrapper {
                padding: 6px;
                border-radius: 14px;
            }
            .video-container {
                border-radius: 10px;
            }
            .video-container::before {
                border-radius: 12px;
            }
            .headline {
                font-size: 14px;
                margin: 8px 0 4px;
            }
            .claim-btn {
                padding: 10px 30px;
                font-size: 15px;
            }
            .claim-btn::before {
                border-radius: 40px;
            }
            .chat-section {
                border-radius: 10px;
                margin-top: 2px;
            }
            .chat-message {
                padding: 4px 10px;
                font-size: 11px;
                gap: 6px;
            }
            .chat-message .avatar {
                width: 22px;
                height: 22px;
                font-size: 10px;
            }
            .chat-message .username {
                font-size: 10px;
            }
            .chat-message .text {
                font-size: 10px;
            }
            .chat-container {
                padding: 4px 8px;
            }
        }

        @media (max-width: 400px) {
            .headline {
                font-size: 12px;
            }
            .claim-btn {
                padding: 8px 20px;
                font-size: 13px;
            }
            .chat-message {
                font-size: 10px;
                padding: 3px 8px;
            }
            .chat-message .avatar {
                width: 18px;
                height: 18px;
                font-size: 8px;
            }
            .chat-message .username {
                font-size: 9px;
            }
            .chat-message .text {
                font-size: 9px;
            }
            .chat-message .time {
                font-size: 7px;
            }
        }

        /* Fullscreen fixes */
        :-webkit-full-screen .video-container {
            border-radius: 0;
        }
        :-webkit-full-screen .video-wrapper {
            border-radius: 0;
            padding: 0;
            border: none;
            box-shadow: none;
            background: transparent;
        }
        :-webkit-full-screen .video-container::before {
            display: none;
        }
        :-webkit-full-screen .top-section {
            max-width: 100%;
        }
        :-webkit-full-screen .chat-section {
            max-width: 100%;
            border-radius: 0;
        }
    </style>
</head>

            const frame = document.getElementById('videoFrame');
            let src = '';

            const youtubeMatch = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);

            } else if (videoUrl.match(/\.(mp4|webm|ogg)$/i)) {
                const video = document.createElement('video');
                video.src = videoUrl;
                video.autoplay = true;
                video.loop = true;
                video.controls = false;
                video.playsInline = true;
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
                const container = document.querySelector('.video-container');
                container.innerHTML = '';
                container.appendChild(video);
                video.play().catch(() => {});
                return;
            } else {
                src = videoUrl;
            }

            frame.src = src;

        const chatMessagesContainer = document.getElementById('chatMessages');
        let messageCount = 0;
        let chatInterval;

        function getRandomUser() {
            return fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
        }

        function getRandomMessage(user) {
            return user.messages[Math.floor(Math.random() * user.messages.length)];
        }

        function getRandomTime() {
            const now = new Date();
            const minutes = Math.floor(Math.random() * 60);
            const seconds = Math.floor(Math.random() * 60);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function addChatMessage() {
            const user = getRandomUser();
            const message = getRandomMessage(user);
            const time = getRandomTime();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message';
            msgDiv.innerHTML = `
                <span class="avatar">${user.avatar}</span>
                <span class="username">${user.name}</span>
                <span class="text">${message}</span>
                <span class="time">${time}</span>
            `;

            chatMessagesContainer.appendChild(msgDiv);
            messageCount++;

            // Keep only last 50 messages to avoid overflow
            while (chatMessagesContainer.children.length > 50) {
                chatMessagesContainer.removeChild(chatMessagesContainer.firstChild);
            }

            // Auto scroll to bottom
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Start chat with initial messages
        function startFakeChat() {
            // Add 10 initial messages quickly
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    addChatMessage();
                }, i * 100);
            }

            // Then add messages randomly every 0.5-2 seconds
            chatInterval = setInterval(() => {
                // Sometimes add multiple messages at once
                const count = Math.random() > 0.7 ? Math.floor(Math.random() * 3) + 1 : 1;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        addChatMessage();
                    }, i * 200);
                }
            }, 500 + Math.random() * 1500);
        }

        // ==================== CLAIM BUTTON ====================
        document.getElementById('claimBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            if (claimUrl && claimUrl !== '#') {
                window.location.href = claimUrl;
            } else {
                alert('🎉 You have been unlocked! Screen is now free.');
                document.body.style.overflow = 'auto';
            }

            history.pushState(null, null, window.location.href);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'w') ||
                (e.altKey && e.key === 'F4') || e.key === 'Escape') {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
        });

        document.addEventListener('touchmove', function(e) {
            if (Math.abs(e.touches[0].clientX - touchStartX) > 50) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                setTimeout(() => window.focus(), 100);
            }
        });

        async function keepAwake() {
            try {
                const wakeLock = await navigator.wakeLock.request('screen');
                console.log('Screen wake lock active');
            } catch (e) {
                console.log('Wake lock not supported');
            }
        }
        keepAwake();

        // ==================== FULLSCREEN ====================
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        setTimeout(requestFullscreen, 500);

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                setTimeout(requestFullscreen, 500);
            }
