<!DOCTYPE html>
<html>
<head>
    <title>Video Lock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* ===== TOP SECTION - VIDEO + HEADLINE + CLAIM ===== */
        .top-section {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 6px 0;
        }

        .video-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.06);
            padding: 8px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .video-container iframe {
            z-index: 5;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25), rgba(102, 126, 234, 0.25));
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .headline {
            text-align: center;
            margin: 10px 0 4px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .claim-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 4px;
            animation: fadeIn 1.2s ease;
        }

        .claim-btn {
            padding: 10px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .claim-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.4);
        }

        .claim-btn:active {
            transform: scale(0.97);
        }

        .claim-btn::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 54px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4), rgba(102, 126, 234, 0.4));
            z-index: -1;
            animation: btnGlow 2s ease-in-out infinite;
            filter: blur(10px);
        }

        @keyframes btnGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        .claim-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== LIVE CHAT ===== */
        .chat-section {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease;
            margin-top: 2px;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            padding: 4px 10px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-bottom: 6px;
        }

        .chat-message {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border-left: 2px solid rgba(102, 126, 234, 0.1);
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateX(-8px);
            font-size: 11px;
        }

        .chat-message .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chat-message .username {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            white-space: nowrap;
        }

        .chat-message .text {
            color: rgba(255, 255, 255, 0.65);
            font-size: 10px;
            font-weight: 300;
            word-break: break-word;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.2);
            font-size: 7px;
            margin-left: auto;
            white-space: nowrap;
            font-weight: 300;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .video-wrapper { padding: 5px; border-radius: 12px; }
            .video-container { border-radius: 8px; }
            .video-container::before { border-radius: 10px; }
            .headline { font-size: 14px; margin: 6px 0 3px; }
            .claim-btn { padding: 8px 28px; font-size: 14px; }
            .claim-btn::before { border-radius: 36px; }
            .chat-section { border-radius: 8px; margin-top: 2px; }
            .chat-message { padding: 2px 6px; font-size: 9px; gap: 3px; }
            .chat-message .avatar { width: 16px; height: 16px; font-size: 8px; }
            .chat-message .username { font-size: 8px; }
            .chat-message .text { font-size: 8px; }
            .chat-message .time { font-size: 6px; }
            .chat-container { padding: 3px 6px; }
        }

        @media (max-width: 400px) {
            .headline { font-size: 12px; }
            .claim-btn { padding: 6px 18px; font-size: 12px; }
            .chat-message { font-size: 8px; padding: 2px 4px; }
            .chat-message .avatar { width: 14px; height: 14px; font-size: 7px; }
            .chat-message .username { font-size: 7px; }
            .chat-message .text { font-size: 7px; }
            .chat-message .time { font-size: 5px; }
        }

        /* Fullscreen override */
        :-webkit-full-screen .video-container { border-radius: 0; }
        :-webkit-full-screen .video-wrapper { border-radius: 0; padding: 0; border: none; box-shadow: none; background: transparent; }
        :-webkit-full-screen .video-container::before { display: none; }
        :-webkit-full-screen .top-section { max-width: 100%; }
        :-webkit-full-screen .chat-section { max-width: 100%; border-radius: 0; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- ===== TOP SECTION ===== -->
    <div class="top-section">
        <div class="video-wrapper">
            <div class="video-container">
                <div id="videoContainer">
                    <!-- Video will be inserted here -->
                </div>
            </div>
            <div class="headline" id="headline">🎬 Watch Video</div>
            <div class="claim-btn-wrapper">
                <button class="claim-btn" id="claimBtn">🎁 Claim Now</button>
            </div>
        </div>
    </div>

    <!-- ===== LIVE CHAT ===== -->
    <div class="chat-section">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>

    <script>
        // ==================== PARAMS ====================
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video') || localStorage.getItem('videoUrl') || 'https://youtu.be/dQw4w9WgXcQ';
        const claimUrl = urlParams.get('claim') || localStorage.getItem('claimUrl') || '#';
        const buttonText = urlParams.get('btn') || localStorage.getItem('buttonText') || 'Claim Now';
        const headline = urlParams.get('headline') || localStorage.getItem('headline') || '🎬 Watch Video';

        document.getElementById('headline').textContent = headline;
        document.getElementById('claimBtn').textContent = buttonText || '🎁 Claim Now';

        // ==================== SMART EXIT SYSTEM ====================
        let backPressCount = 0;
        let videoPlayCount = 0;
        let isExitable = false;

        // ===== Video play counter =====
        function trackVideoPlay() {
            videoPlayCount++;
            console.log('🎬 Video play count:', videoPlayCount);
            if (videoPlayCount >= 2) {
                isExitable = true;
                console.log('✅ Exit enabled after 2 video plays');
            }
        }

        // ===== Back button handler =====
        window.addEventListener('popstate', function(e) {
            if (isExitable) {
                // After 2 video plays, 1 back press = exit
                console.log('🚪 Exiting on back press');
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return;
            }

            backPressCount++;
            console.log('⬅️ Back press count:', backPressCount);

            if (backPressCount >= 5) {
                // 5 back presses = exit
                console.log('🚪 Exiting after 5 back presses');
                document.body.innerHTML = '';
                window.location.href = 'about:blank';
                return;
            }

            // Push state again to prevent exit
            history.pushState(null, null, window.location.href);

            // Show warning
            showExitWarning(5 - backPressCount);
        });

        // ===== Exit warning =====
        function showExitWarning(remaining) {
            const existing = document.getElementById('exitWarning');
            if (existing) existing.remove();

            const warn = document.createElement('div');
            warn.id = 'exitWarning';
            warn.style.cssText = `
                position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                background: rgba(255, 0, 0, 0.85); color: #fff; padding: 10px 24px;
                border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 9999;
                text-align: center; max-width: 90%; backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                animation: fadeIn 0.3s ease;
            `;
            warn.textContent = remaining > 0 ?
                `⚠️ Press back ${remaining} more time${remaining > 1 ? 's' : ''} to exit` :
                '⚠️ Press back to exit now';

            document.body.appendChild(warn);

            setTimeout(() => {
                if (warn.parentNode) warn.remove();
            }, 3000);
        }

        // ===== Inject styles for warning =====
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);

        // Push initial state
        history.pushState(null, null, window.location.href);

        // ==================== LOAD VIDEO ====================
        function loadVideo() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            console.log('🎬 Loading video:', videoUrl);

            // ===== YOUTUBE =====
            const youtubeMatch = videoUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);

            if (youtubeMatch) {
                const videoId = youtubeMatch[1];
                console.log('📺 YouTube Video ID:', videoId);

                const iframe = document.createElement('iframe');
                iframe.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&controls=1&modestbranding=1&rel=0&showinfo=0&fs=1&loop=1&playlist=' + videoId;
                iframe.allow = 'autoplay; encrypted-media; fullscreen';
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';

                // Track video play
                iframe.onload = function() {
                    trackVideoPlay();
                };

                container.appendChild(iframe);

                // Fallback: track after 3 seconds
                setTimeout(trackVideoPlay, 3000);
                return;
            }

            // ===== MP4 / DIRECT VIDEO =====
            console.log('🎥 Loading as iframe to bypass CSP:', videoUrl);
            const iframe = document.createElement('iframe');
            iframe.src = videoUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:5;';

            iframe.onload = function() {
                trackVideoPlay();
            };

            container.appendChild(iframe);

            // Fallback: track after 3 seconds
            setTimeout(trackVideoPlay, 3000);
        }

        // ==================== FAKE CHAT ====================
        const users = [
            { name: 'GamerPro', emoji: '🎮' }, { name: 'KingSlayer', emoji: '👑' },
            { name: 'NightWolf', emoji: '🐺' }, { name: 'ShadowX', emoji: '🌙' },
            { name: 'BlazeIt', emoji: '🔥' }, { name: 'SniperPro', emoji: '🎯' },
            { name: 'DemonKing', emoji: '😈' }, { name: 'Phoenix', emoji: '🐦' },
            { name: 'DarkKnight', emoji: '🦇' }, { name: 'StarGamer', emoji: '⭐' },
            { name: 'ThunderX', emoji: '⚡' }, { name: 'IceQueen', emoji: '❄️' },
            { name: 'FireLord', emoji: '🔥' }, { name: 'CryptoKing', emoji: '💰' },
            { name: 'GhostRider', emoji: '👻' }, { name: 'Venom', emoji: '🕷️' },
            { name: 'WizardX', emoji: '🧙' }, { name: 'NinjaPro', emoji: '🥷' },
            { name: 'DragonSlayer', emoji: '🐉' }, { name: 'MysticMoon', emoji: '🌙' }
        ];

        const messages = [
            'Thanks bhai! 🎉', 'Redeem code mil gaya! 💰', '1000₹ ka redeem code! 🎁',
            'Best website ever! ⭐', 'Bro thanks a lot! 🙏', 'Redeem code working! ✅',
            'Amazing! 🔥', 'Got 500₹! 💵', 'Love this! ❤️', 'Best app! 🏆',
            'Thank you! 🙌', 'Working perfectly! 💯', 'Awesome! 😍', 'Great! 👍',
            'Superb! 🌟', 'Thanks team! 🤝', 'Nice! 👌', 'Love it! 💖',
            'Working! ✅', 'Super! 🚀'
        ];

        const chatContainer = document.getElementById('chatMessages');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomTime() {
            const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            const s = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            return m + ':' + s;
        }

        function addChat() {
            const user = getRandom(users);
            const msg = getRandom(messages);
            const time = getRandomTime();

            const el = document.createElement('div');
            el.className = 'chat-message';
            el.innerHTML = `
                <span class="avatar">${user.emoji}</span>
                <span class="username">${user.name}</span>
                <span class="text">${msg}</span>
                <span class="time">${time}</span>
            `;
            chatContainer.appendChild(el);

            while (chatContainer.children.length > 30) {
                chatContainer.removeChild(chatContainer.firstChild);
            }
        }

        for (let i = 0; i < 8; i++) {
            setTimeout(addChat, i * 150);
        }

        setInterval(function() {
            addChat();
            if (Math.random() > 0.6) {
                setTimeout(addChat, 300);
            }
        }, 800 + Math.random() * 1200);

        // ==================== CLAIM BUTTON ====================
        document.getElementById('claimBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            var rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);

            if (claimUrl && claimUrl !== '#') {
                window.location.href = claimUrl;
            } else {
                alert('🎉 You have been unlocked!');
                document.body.style.overflow = 'auto';
                // Allow exit
                isExitable = true;
            }
        });

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                // Simulate back press
                window.dispatchEvent(new PopStateEvent('popstate'));
            }
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // ==================== KEEP AWAKE ====================
        async function keepAwake() {
            try {
                await navigator.wakeLock.request('screen');
            } catch (e) {}
        }
        keepAwake();

        // ==================== INIT ====================
        loadVideo();

        console.log('🎬 Video URL:', videoUrl);
        console.log('🎁 Claim URL:', claimUrl);
        console.log('🔘 Button Text:', buttonText);
        console.log('📝 Headline:', headline);
        console.log('🔒 Smart Exit System: 5 back presses OR 2 video plays + 1 back press');
    </script>
</body>
</html>
