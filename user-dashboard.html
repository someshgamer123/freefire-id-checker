<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Insights & Renewal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            window.addEventListener('keydown', e => {
                if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                    e.preventDefault();
                }
            }, true);
            try { ['log', 'debug', 'info', 'warn', 'error'].forEach(m => window.console[m] = () => {}); } catch(e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a10;
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 680px;
            background: rgba(18, 21, 31, 0.85);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .head { text-align: center; margin-bottom: 24px; }
        .head h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .head p { font-size: 13px; color: #94a3b8; margin-top: 4px; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: rgba(10, 12, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .stat-val { font-size: 28px; font-weight: 800; color: #818cf8; }
        .stat-lbl { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-top: 4px; }

        .plans-box {
            background: rgba(10, 12, 19, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin: 16px 0;
        }

        .plan-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .plan-card.active {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.15);
        }

        .plan-card .price { display: block; font-size: 18px; font-weight: 800; color: #fff; margin-top: 4px; }

        .btn-wa {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="head">
            <h1>📊 Link Analytics & Extension</h1>
            <p>Track visitor performance and renew your link validity</p>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><div class="stat-val" id="vVisits">0</div><div class="stat-lbl">Total Visits</div></div>
            <div class="stat-item"><div class="stat-val" id="vClaims">0</div><div class="stat-lbl">Total Claims</div></div>
        </div>

        <div class="plans-box">
            <h3>⚡ Extend Link Validity</h3>
            <div class="plans-grid">
                <div class="plan-card active" onclick="pickPlan('3days', 50)">3 Days<span class="price">₹50</span></div>
                <div class="plan-card" onclick="pickPlan('7days', 100)">7 Days<span class="price">₹100</span></div>
                <div class="plan-card" onclick="pickPlan('15days', 200)">15 Days<span class="price">₹200</span></div>
                <div class="plan-card" onclick="pickPlan('1month', 500)">1 Mo<span class="price">₹500</span></div>
            </div>
            <button class="btn-wa" onclick="sendRenewal()">📱 Contact on WhatsApp for Renewal</button>
        </div>
    </div>

    <script>
        let selectedPlan = '3days';
        let planPrice = 50;
        let adminPhone = '916372923348';

        function pickPlan(plan, price) {
            selectedPlan = plan;
            planPrice = price;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function sendRenewal() {
            const msg = encodeURIComponent(`Hello Admin, I want to renew my link with ${selectedPlan} plan for ₹${planPrice}.`);
            window.open(`https://wa.me/${adminPhone}?text=${msg}`, '_blank');
        }

        // Fetch live stats for dashboard link
        const linkId = window.location.pathname.split('/').pop();
        if (linkId) {
            fetch('/api/visit-stats/' + linkId)
                .then(r => r.json())
                .then(d => {
                    if (d && d.totalVisits !== undefined) {
                        document.getElementById('vVisits').textContent = d.totalVisits;
                        document.getElementById('vClaims').textContent = d.totalClaims;
                    }
                }).catch(() => {});
        }
    </script>
</body>
</html>
