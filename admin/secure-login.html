<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Secure Admin Login</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .lock-icon { text-align: center; font-size: 48px; margin-bottom: 10px; }
        h1 { text-align: center; color: #333; font-size: 24px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; color: #555; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 18px;
            pointer-events: none;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 14px 14px 46px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
            color: #333;
            letter-spacing: 2px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            padding: 0;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
        }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }
        .error-message {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            border-left: 4px solid #c0392b;
        }
        .error-message.show { display: block; animation: shake 0.5s; }
        .error-message.info {
            background: #e3f2fd;
            color: #0d47a1;
            border-left-color: #0d47a1;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
        .security-badge span { display: flex; align-items: center; gap: 5px; }
        .security-badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .security-badge .dot.green { background: #27ae60; }
        .twofa-section { display: none; animation: slideUp 0.3s ease-out; }
        .twofa-section.show { display: block; }
        .phishing-warning {
            background: #fff3cd;
            color: #856404;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffc107;
        }
        .session-info {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }
        .admin-path-display {
            font-size: 10px;
            color: #667eea;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 15px;
            background: rgba(102,126,234,0.08);
            padding: 4px 10px;
            border-radius: 6px;
            display: block;
            word-break: break-all;
        }
        .admin-path-display.warning {
            color: #c0392b;
            background: rgba(192,57,43,0.08);
        }
        .passcode-hint {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
        @media (max-width: 480px) {
            .login-container { padding: 25px; }
            h1 { font-size: 20px; }
            input[type="password"], input[type="text"] { font-size: 14px; padding: 12px 12px 12px 40px; }
        }
        .no-right-click { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body>

    <div class="login-container no-right-click">
        <div class="lock-icon">🔐</div>
        <h1>Secure Admin Login</h1>
        <p class="subtitle">🔒 Enter your passcode to access the admin panel</p>

        <div class="admin-path-display" id="adminPathDisplay">🔐 Secure Path: Detecting...</div>

        <div class="error-message" id="loginError"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="passcode">🔑 Passcode</label>
                <div class="input-wrapper">
                    <span class="icon">🔑</span>
                    <input type="password" id="passcode" placeholder="Enter your secure passcode" required autocomplete="off" maxlength="50">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>

            <div class="twofa-section" id="twofaSection">
                <div class="form-group">
                    <label for="twofaToken">📱 2FA Token</label>
                    <div class="input-wrapper">
                        <span class="icon">📱</span>
                        <input type="text" id="twofaToken" placeholder="Enter 6-digit 2FA code" maxlength="6" autocomplete="off" pattern="[0-9]{6}">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">🔓 Sign In</span>
                <span class="spinner"></span>
            </button>

            <div class="passcode-hint">💡 Default passcode: 951753</div>

            <div class="phishing-warning">⚠️ Always verify the URL before logging in</div>

            <div class="security-badge">
                <span><span class="dot green"></span> Secure Connection</span>
                <span>🛡️ Rate Limited</span>
                <span>🔒 Encrypted</span>
            </div>

            <div class="session-info" id="sessionInfo">🔐 Session timeout: 60 minutes</div>
        </form>
    </div>

    <script>
    // ============================================================
    // DYNAMIC ADMIN PATH DETECTION
    // ============================================================
    function getAdminPath() {
        const path = window.location.pathname;
        const match = path.match(/^\/admin_[a-f0-9]+/);
        if (match) {
            return match[0];
        }
        return '';
    }

    const ADMIN_PATH = getAdminPath();
    console.log('🔐 Admin Path:', ADMIN_PATH || 'Not found');

    // Display admin path
    const pathDisplay = document.getElementById('adminPathDisplay');
    if (ADMIN_PATH) {
        pathDisplay.textContent = '🔐 Secure Path: ' + ADMIN_PATH;
        pathDisplay.className = 'admin-path-display';
    } else {
        pathDisplay.textContent = '⚠️ Warning: Not on secure admin path!';
        pathDisplay.className = 'admin-path-display warning';
    }

    // ============================================================
    // DOM ELEMENTS
    // ============================================================
    const form = document.getElementById('loginForm');
    const passcodeInput = document.getElementById('passcode');
    const twofaInput = document.getElementById('twofaToken');
    const twofaSection = document.getElementById('twofaSection');
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');
    const togglePassword = document.getElementById('togglePassword');

    // ============================================================
    // TOGGLE PASSWORD VISIBILITY
    // ============================================================
    let isPasswordVisible = false;
    togglePassword.addEventListener('click', function() {
        isPasswordVisible = !isPasswordVisible;
        passcodeInput.type = isPasswordVisible ? 'text' : 'password';
        this.textContent = isPasswordVisible ? '🙈' : '👁️';
    });

    // ============================================================
    // SHOW ERROR FUNCTION
    // ============================================================
    function showError(message, type = 'error') {
        errorDiv.textContent = message;
        errorDiv.className = 'error-message show';
        if (type === 'info') {
            errorDiv.classList.add('info');
        } else {
            errorDiv.classList.remove('info');
        }
    }

    function hideError() {
        errorDiv.className = 'error-message';
        errorDiv.textContent = '';
    }

    // ============================================================
    // LOGIN FUNCTION - USING DYNAMIC PATH
    // ============================================================
    async function handleLogin(event) {
        event.preventDefault();
        
        hideError();

        const passcode = passcodeInput.value.trim();
        if (!passcode) {
            showError('Please enter your passcode');
            passcodeInput.focus();
            return;
        }

        // Check if passcode is 6 digits
        if (passcode.length !== 6 || !/^\d+$/.test(passcode)) {
            showError('Passcode must be 6 digits');
            passcodeInput.value = '';
            passcodeInput.focus();
            return;
        }

        const twofaToken = twofaSection.classList.contains('show') ? twofaInput.value.trim() : null;

        // Show loading state
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;

        try {
            const requestBody = { passcode: passcode };
            if (twofaToken) {
                requestBody.token = twofaToken;
            }

            // IMPORTANT: Use the dynamic admin path for the API call
            const apiUrl = ADMIN_PATH ? `${ADMIN_PATH}/api/login` : '/api/login';
            console.log('📡 API URL:', apiUrl);
            console.log('📤 Request Body:', { passcode: '******', token: twofaToken ? '******' : null });
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(requestBody),
                credentials: 'include'
            });

            console.log('📥 Response Status:', response.status);

            // Parse response - READ ONCE
            let data;
            try {
                data = await response.json();
                console.log('📥 Response Data:', data);
            } catch (e) {
                console.error('❌ Failed to parse response:', e);
                throw new Error('Invalid server response. Please try again.');
            }

            // Handle response
            if (!response.ok) {
                if (response.status === 429) {
                    throw new Error(data.error || 'Too many login attempts. Please try again later.');
                }
                if (response.status === 401) {
                    throw new Error(data.error || 'Invalid passcode. Please try again.');
                }
                throw new Error(data.error || 'Login failed. Please try again.');
            }

            // Check if 2FA is required
            if (data.requires2FA) {
                twofaSection.classList.add('show');
                twofaInput.focus();
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                loginBtn.querySelector('.btn-text').textContent = '✅ Verify 2FA';
                showError('2FA token required. Please enter your authenticator code.', 'info');
                return;
            }

            // Login successful
            if (data.success) {
                console.log('✅ Login successful!');
                
                if (data.csrfToken) {
                    localStorage.setItem('adminCsrfToken', data.csrfToken);
                    localStorage.setItem('csrfToken', data.csrfToken);
                }

                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminLoginTime', Date.now().toString());

                const dashboardUrl = ADMIN_PATH ? `${ADMIN_PATH}/index.html` : '/admin/index.html';
                console.log('🚀 Redirecting to:', dashboardUrl);
                
                // Show success message before redirect
                showError('✅ Login successful! Redirecting...', 'info');
                
                setTimeout(() => {
                    window.location.href = dashboardUrl;
                }, 500);
                
            } else {
                throw new Error(data.error || 'Login failed');
            }

        } catch (error) {
            console.error('❌ Login error:', error);
            showError(error.message || 'An error occurred during login');
            
            // Reset 2FA if login failed
            if (twofaSection.classList.contains('show') && !error.message.includes('2FA')) {
                twofaSection.classList.remove('show');
                twofaInput.value = '';
                loginBtn.querySelector('.btn-text').textContent = '🔓 Sign In';
            }
            
            // Clear passcode on error
            passcodeInput.value = '';
            passcodeInput.focus();
            
        } finally {
            if (!window.location.href.includes('index.html')) {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }
    }

    // ============================================================
    // FORM SUBMIT
    // ============================================================
    form.addEventListener('submit', handleLogin);

    // ============================================================
    // ENTER KEY HANDLING
    // ============================================================
    passcodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            form.dispatchEvent(new Event('submit'));
        }
    });

    twofaInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            form.dispatchEvent(new Event('submit'));
        }
    });

    // ============================================================
    // AUTO FOCUS
    // ============================================================
    setTimeout(() => {
        passcodeInput.focus();
    }, 300);

    // ============================================================
    // SESSION INFO
    // ============================================================
    document.getElementById('sessionInfo').textContent = 
        `🔐 Session timeout: 60 minutes • ${ADMIN_PATH ? 'Secure Path: Active' : '⚠️ Standard Path'}`;

    // ============================================================
    // KEYBOARD SHORTCUTS BLOCK
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 's' || e.key === 'p')) {
            e.preventDefault();
            return false;
        }
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
    });

    // ============================================================
    // CONTEXT MENU BLOCK
    // ============================================================
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // ============================================================
    // 2FA INPUT HANDLING
    // ============================================================
    twofaInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length === 6) {
            form.dispatchEvent(new Event('submit'));
        }
    });

    // ============================================================
    // CLEAR PASSCODE ON PAGE LOAD
    // ============================================================
    window.addEventListener('load', function() {
        passcodeInput.value = '';
        passcodeInput.focus();
    });

    // ============================================================
    // ANTI-PHISHING CHECK
    // ============================================================
    if (!ADMIN_PATH) {
        console.warn('⚠️ Not on a secure admin path!');
        showError('⚠️ Warning: You are not on a secure admin path. Please verify the URL.', 'info');
    }

    // ============================================================
    // CONSOLE LOGS
    // ============================================================
    console.log('🛡️ IP-Based Rate Limiting: Enabled');
    console.log('🔒 Token: ❌ Not Present');
    console.log('🔐 Admin Path:', ADMIN_PATH || 'Not found');
    console.log('✅ Secure Login Panel Loaded');
    console.log('📌 Default passcode: 951753');
    </script>
</body>
</html>
