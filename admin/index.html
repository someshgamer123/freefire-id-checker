<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        window.addEventListener('keydown', e => {
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        }, true);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        :root {
            --primary: #6366f1; --secondary: #8b5cf6; --success: #22c55e;
            --danger: #ef4444; --bg: #090a0f; --card-bg: #131722;
            --text: #f8fafc; --text-light: #94a3b8; --border: #232838;
        }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }

        .admin-wrap { max-width: 1200px; margin: 0 auto; }

        .header {
            background: var(--card-bg); padding: 18px 24px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-logout { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        .menu-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .menu-btn {
            padding: 10px 18px; border: 1px solid transparent; border-radius: 12px;
            background: var(--card-bg); color: var(--text-light); cursor: pointer; font-size: 13px; font-weight: 700;
        }
        .menu-btn.active { background: var(--primary); color: #fff; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: 800; color: #fff; }
        .stat-card .label { color: var(--text-light); font-size: 12px; margin-top: 4px; font-weight: 600; }

        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card h3 { font-size: 17px; margin-bottom: 16px; }
        .card input {
            width: 100%; padding: 12px 16px; margin-bottom: 12px; background: #090a0f;
            border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none;
        }
        .card input:focus { border-color: var(--primary); }

        .btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; color: #fff; }
        .btn-primary { background: var(--primary); width: 100%; font-size: 15px; }

        .link-row {
            background: #090a0f; border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .link-row .title { font-weight: 700; font-size: 14px; }
        .link-row .meta { font-size: 12px; color: var(--text-light); margin-top: 3px; }
        .btn-copy { background: var(--success); padding: 6px 14px; font-size: 12px; border-radius: 8px; }
        .btn-del { background: var(--danger); padding: 6px 14px; font-size: 12px; border-radius: 8px; margin-left: 6px; }

        .tab-section { display: none; }
        .tab-section.active { display: block; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <div class="header">
            <h1>⚡ Admin Control Center</h1>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>

        <div class="menu-bar">
            <button class="menu-btn active" onclick="showTab('dash')">📊 Overview</button>
            <button class="menu-btn" onclick="showTab('links')">🔗 Links Manager</button>
            <button class="menu-btn" onclick="showTab('create')">➕ Create Link</button>
        </div>

        <!-- DASHBOARD TAB -->
        <div class="tab-section active" id="tab-dash">
            <div class="stats-grid">
                <div class="stat-card"><div class="num" id="statTotLinks">0</div><div class="label">Total Links</div></div>
                <div class="stat-card"><div class="num" id="statTotVisits">0</div><div class="label">Total Visits</div></div>
                <div class="stat-card"><div class="num" id="statTotClaims">0</div><div class="label">Total Claims</div></div>
            </div>
        </div>

        <!-- LINKS TAB -->
        <div class="tab-section" id="tab-links">
            <div class="card">
                <h3>Active Tracking Links</h3>
                <div id="linksList">Loading links...</div>
            </div>
        </div>

        <!-- CREATE TAB -->
        <div class="card tab-section" id="tab-create">
            <h3>➕ Generate New Rewarded Link</h3>
            <input type="text" id="linkName" placeholder="Link Name (e.g. Free Fire Promo 1)">
            <input type="text" id="videoUrl" placeholder="Video URL (YouTube or MP4)" value="https://youtu.be/dQw4w9WgXcQ">
            <input type="text" id="claimUrl" placeholder="Claim Destination URL (Reward URL)" value="#">
            <input type="text" id="headline" placeholder="Headline" value="🎬 Watch Stream & Unlock Reward">
            <button class="btn btn-primary" onclick="createLink()">Generate Tracking Link ➜</button>
        </div>
    </div>

    <script>
        const csrfToken = localStorage.getItem('csrfToken') || '';

        function showTab(id) {
            document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
            if (id === 'links') loadLinks();
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/all-stats');
                const data = await res.json();
                if (data && data.global) {
                    document.getElementById('statTotVisits').textContent = data.global.totalVisitors || 0;
                    document.getElementById('statTotClaims').textContent = data.global.totalClaims || 0;
                }
                if (data && data.links) {
                    document.getElementById('statTotLinks').textContent = data.links.length || 0;
                }
            } catch(e) {}
        }

        async function loadLinks() {
            const list = document.getElementById('linksList');
            try {
                const res = await fetch('/api/links');
                const links = await res.json();
                if (!links || links.length === 0) {
                    list.innerHTML = '<p style="color:#94a3b8;font-size:13px;">No links created yet.</p>';
                    return;
                }
                list.innerHTML = '';
                links.forEach(l => {
                    const row = document.createElement('div');
                    row.className = 'link-row';
                    row.innerHTML = `
                        <div>
                            <div class="title">${l.name}</div>
                            <div class="meta">Visits: <b>${l.visits || 0}</b> | Claims: <b>${l.claims || 0}</b></div>
                        </div>
                        <div>
                            <button class="btn btn-copy" onclick="copyLink('${l.id}')">📋 Copy</button>
                            <button class="btn btn-del" onclick="deleteLink('${l.id}')">🗑️ Delete</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
            } catch(e) {
                list.innerHTML = 'Error loading links';
            }
        }

        function copyLink(id) {
            const full = window.location.origin + '/uid?link=' + id;
            navigator.clipboard.writeText(full).then(() => alert('✅ Link copied: ' + full));
        }

        async function deleteLink(id) {
            if (!confirm('Delete this link?')) return;
            await fetch('/api/links/' + id, { method: 'DELETE' });
            loadLinks();
            loadStats();
        }

        async function createLink() {
            const name = document.getElementById('linkName').value.trim();
            const video = document.getElementById('videoUrl').value.trim();
            const claim = document.getElementById('claimUrl').value.trim();
            const headline = document.getElementById('headline').value.trim();

            if (!name) return alert('Enter link name');

            const res = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, video, claim, headline })
            });
            const d = await res.json();
            if (d && d.id) {
                alert('✅ Link Created! You can copy it from Links Manager.');
                document.getElementById('linkName').value = '';
                loadStats();
                showTab('links');
            }
        }

        function logout() {
            document.cookie = 'adminToken=; Max-Age=0; path=/;';
            localStorage.removeItem('csrfToken');
            window.location.href = '/admin/login.html';
        }

        loadStats();
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
