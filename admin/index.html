<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Control Center</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    
    <!-- ANTI-F12, DEVTOOLS & ACTIVITY TRACKING SHIELD -->
    <script>
        (function() {
            'use strict';
            // Disable context menu
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);

            // Disable shortcut inspection keys
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
                if ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
            }, true);

            // Neutralize console logs
            try {
                const noop = function() {};
                ['log', 'debug', 'info', 'warn', 'error', 'table', 'trace'].forEach(function(m) {
                    window.console[m] = noop;
                });
            } catch(err) {}

            // Anti-debugger loop trap
            setInterval(function() {
                const start = performance.now();
                (function() {}['constructor']('debugger')());
                if (performance.now() - start > 100) {
                    document.body.innerHTML = '';
                    window.location.replace('about:blank');
                }
            }, 1000);
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #8b5cf6;
            --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
            --bg: #0b0d14; --card-bg: #131722; --text: #e2e8f0;
            --text-light: #94a3b8; --border: #232838; --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        body.light { --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --text-light: #64748b; --border: #e2e8f0; }

        .admin-container { max-width: 1360px; margin: 0 auto; }

        .header {
            background: var(--card-bg); padding: 16px 24px; border-radius: var(--radius);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            border: 1px solid var(--border); box-shadow: var(--shadow); flex-wrap: wrap; gap: 12px;
        }
        .header h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-actions button { padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); transition: 0.2s; }
        .header-actions button:hover { transform: translateY(-1px); }
        .btn-logout { background: var(--danger) !important; color: #fff !important; border: none !important; }

        .menu-container {
            display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
            background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .menu-btn {
            padding: 8px 16px; border: 1px solid transparent; border-radius: 10px;
            background: transparent; color: var(--text-light); cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;
        }
        .menu-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
        .menu-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,0.3); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card {
            background: var(--card-bg); padding: 18px 14px; border-radius: var(--radius);
            text-align: center; border: 1px solid var(--border);
        }
        .stat-card .number { font-size: 26px; font-weight: 800; color: #fff; }
        .stat-card .label { color: var(--text-light); font-size: 12px; margin-top: 4px; font-weight: 500; }

        .live-visitors {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px 20px;
            margin-bottom: 20px; border: 1px solid var(--border); border-left: 4px solid var(--success);
        }
        .live-visitors .lv-title {
            font-size: 13px; font-weight: 700; color: var(--success); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .live-visitors .lv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .live-visitors .lv-item {
            background: var(--bg); border-radius: 12px; padding: 12px; text-align: center;
            border: 1px solid var(--border);
        }
        .live-visitors .lv-item .lv-number { font-size: 24px; font-weight: 800; }
        .live-visitors .lv-item .lv-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg); padding: 22px 24px; border-radius: var(--radius);
            margin-bottom: 20px; border: 1px solid var(--border);
        }
        .card h3 { font-size: 16px; margin-bottom: 14px; font-weight: 700; color: #fff; }
        .card input, .card select, .card textarea {
            width: 100%; padding: 10px 14px; margin: 6px 0; border: 1px solid var(--border);
            border-radius: 10px; font-size: 13px; background: var(--bg); color: var(--text); outline: none;
        }
        .card input:focus, .card select:focus { border-color: var(--primary); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            padding: 10px 20px; border: none; border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 8px; }
        .btn-block { width: 100%; }

        .link-item {
            background: var(--bg); padding: 12px 16px; margin: 8px 0; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            gap: 8px; border-left: 3px solid var(--primary);
        }
        .link-item .info .name { font-weight: 700; font-size: 14px; color: var(--text); margin-right: 12px; }
        .link-item .info .details { font-size: 12px; color: var(--text-light); }

        .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .status-active { background: rgba(34,197,94,0.15); color: var(--success); }
        .status-disabled { background: rgba(239,68,68,0.15); color: var(--danger); }

        .toast {
            position: fixed; bottom: 30px; right: 30px; padding: 12px 22px; border-radius: 12px;
            color: white; font-weight: 600; font-size: 13px; z-index: 99999;
            transform: translateY(100px); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="admin-container">
        <header class="header">
            <h1>⚡ Admin Control Center</h1>
            <div class="header-actions">
                <button onclick="logout()" class="btn-logout">🚪 Logout</button>
            </div>
        </header>

        <div class="menu-container">
            <button class="menu-btn active" onclick="switchTab('dashboard')">📊 Overview</button>
            <button class="menu-btn" onclick="switchTab('links')">🔗 Links Manager</button>
            <button class="menu-btn" onclick="switchTab('create')">➕ New Link</button>
            <button class="menu-btn" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div class="section active" id="sec-dashboard">
            <div class="stats-grid">
                <div class="stat-card"><div class="number" id="totLinks">0</div><div class="label">Total Links</div></div>
                <div class="stat-card"><div class="number" id="totVisits">0</div><div class="label">Total Visits</div></div>
                <div class="stat-card"><div class="number" id="totClaims">0</div><div class="label">Total Claims</div></div>
            </div>

            <div class="live-visitors">
                <div class="lv-title">🟢 Real-Time Signal Stream (Auto-Refreshing)</div>
                <div class="lv-grid">
                    <div class="lv-item"><div class="lv-number" id="liveLifetimeVisits" style="color:var(--primary);">0</div><div class="lv-label">Lifetime Visitors</div></div>
                    <div class="lv-item"><div class="lv-number" id="liveLifetimeClaims" style="color:var(--warning);">0</div><div class="lv-label">Total Claims</div></div>
                    <div class="lv-item"><div class="lv-number" id="liveActiveVisits" style="color:var(--success);">0</div><div class="lv-label">Active Users (Live)</div></div>
                </div>
            </div>
        </div>

        <!-- LINKS SECTION -->
        <div class="section" id="sec-links">
            <div class="card">
                <h3>Managed Tracking Links</h3>
                <div id="linksContainer">Loading links...</div>
            </div>
        </div>

        <!-- CREATE SECTION -->
        <div class="section" id="sec-create">
            <div class="card">
                <h3>➕ Create New Rewarded Link</h3>
                <input type="text" id="newLinkName" placeholder="Link Name (e.g. Free Fire Promo 1)">
                <div class="grid-2">
                    <input type="text" id="newVideoUrl" placeholder="Video URL (YouTube embed or MP4)" value="https://youtu.be/dQw4w9WgXcQ">
                    <input type="text" id="newClaimUrl" placeholder="Claim Destination URL" value="#">
                </div>
                <input type="text" id="newHeadline" placeholder="Headline text" value="🎬 Watch Stream & Unlock Reward">
                <button onclick="createNewLink()" class="btn btn-primary btn-block" style="margin-top:14px;">🚀 Generate Tracking Link</button>
            </div>
        </div>

        <!-- SETTINGS SECTION -->
        <div class="section" id="sec-settings">
            <div class="card">
                <h3>🔑 Secret Gateway Passphrase</h3>
                <input type="text" id="adminSecretKey" placeholder="Current Secret Key">
                <button onclick="updateSecretKey()" class="btn btn-primary btn-sm" style="margin-top:10px;">Update Secret Key</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const csrfToken = localStorage.getItem('csrfToken') || '';

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.className = 'toast', 3000);
        }

        function switchTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${id}`).classList.add('active');
            event.currentTarget.classList.add('active');
            if (id === 'links') fetchLinks();
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/all-stats', { headers: { 'X-CSRF-Token': csrfToken } });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }
                const data = await res.json();
                if (data && data.global) {
                    document.getElementById('totVisits').textContent = data.global.totalVisitors || 0;
                    document.getElementById('totClaims').textContent = data.global.totalClaims || 0;
                    document.getElementById('liveLifetimeVisits').textContent = data.global.totalVisitors || 0;
                    document.getElementById('liveLifetimeClaims').textContent = data.global.totalClaims || 0;
                    document.getElementById('liveActiveVisits').textContent = Math.max(1, Math.round((data.global.totalVisitors || 0) * 0.05));
                }
                if (data && data.links) {
                    document.getElementById('totLinks').textContent = data.links.length || 0;
                }
            } catch(e) {}
        }

        async function fetchLinks() {
            const box = document.getElementById('linksContainer');
            try {
                const res = await fetch('/api/links', { headers: { 'X-CSRF-Token': csrfToken } });
                const links = await res.json();
                if (!links || links.length === 0) {
                    box.innerHTML = '<p style="color:#94a3b8;font-size:13px;">No active links created yet.</p>';
                    return;
                }
                box.innerHTML = '';
                links.forEach(l => {
                    const row = document.createElement('div');
                    row.className = 'link-item';
                    row.innerHTML = `
                        <div class="info">
                            <span class="name">${l.name}</span>
                            <span class="details">Visits: <b>${l.visits || 0}</b> | Claims: <b>${l.claims || 0}</b></span>
                        </div>
                        <div>
                            <button onclick="copyLinkUrl('${l.id}')" class="btn btn-success btn-sm">📋 Copy</button>
                            <button onclick="deleteLink('${l.id}')" class="btn btn-danger btn-sm">🗑️ Delete</button>
                        </div>
                    `;
                    box.appendChild(row);
                });
            } catch(e) {
                box.innerHTML = 'Error loading links';
            }
        }

        function copyLinkUrl(id) {
            const fullUrl = window.location.origin + '/uid?link=' + id;
            navigator.clipboard.writeText(fullUrl).then(() => showToast('✅ Link copied!', 'success'));
        }

        async function deleteLink(id) {
            if (!confirm('Are you sure you want to delete this link?')) return;
            await fetch('/api/links/' + id, { method: 'DELETE', headers: { 'X-CSRF-Token': csrfToken } });
            showToast('Link deleted', 'info');
            fetchLinks();
            fetchStats();
        }

        async function createNewLink() {
            const name = document.getElementById('newLinkName').value.trim();
            const video = document.getElementById('newVideoUrl').value.trim();
            const claim = document.getElementById('newClaimUrl').value.trim();
            const headline = document.getElementById('newHeadline').value.trim();

            if (!name) return showToast('Please enter link name', 'error');

            const res = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                body: JSON.stringify({ name, video, claim, headline })
            });
            const data = await res.json();
            if (data && data.id) {
                showToast('✅ Link generated successfully!', 'success');
                document.getElementById('newLinkName').value = '';
                fetchStats();
            }
        }

        async function logout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            localStorage.removeItem('csrfToken');
            window.location.href = 'login.html';
        }

        // Initialize & Live Polling
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
