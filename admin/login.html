<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-box {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }
        .login-box .logo { font-size: 60px; margin-bottom: 10px; }
        .login-box h2 { color: #fff; margin-bottom: 6px; font-size: 24px; font-weight: 700; }
        .login-box .sub-title { color: rgba(255,255,255,0.6); margin-bottom: 25px; font-size: 14px; }
        
        .google-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            background: #fff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        .google-btn:active {
            transform: scale(0.97);
        }
        .google-btn svg { width: 24px; height: 24px; }
        
        .error {
            color: #fc8181;
            margin: 10px 0;
            font-weight: 600;
            min-height: 24px;
            font-size: 14px;
        }
        .error:empty { display: none; }
        
        .footer-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 20px;
        }
        .footer-text .email { color: #667eea; font-weight: 600; }
        
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub-title">Sign in with your Google account</p>
        
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </button>
        
        <div id="error" class="error"></div>
        <div class="footer-text">
            🔒 Secure | Only <span class="email">mikunkumar242@gmail.com</span> can access
        </div>
    </div>

    <script>
        function showError(message) {
            var el = document.getElementById('error');
            el.textContent = '❌ ' + message;
        }

        function loginWithGoogle() {
            window.location.href = '/auth/google';
        }

        // Check if already logged in
        async function checkLoginStatus() {
            try {
                var r = await fetch('/api/auth/google/status');
                var data = await r.json();
                if (data.authenticated) {
                    window.location.href = '/admin/index.html';
                }
            } catch (e) {}
        }

        // Check URL for error parameter
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'unauthorized') {
            showError('Unauthorized email. Only primary admin email can login.');
        } else if (urlParams.get('error') === 'server_error') {
            showError('Server error. Please try again later.');
        }

        checkLoginStatus();

        console.log('🔐 Admin Login - Google OAuth 2.0');
        console.log('👤 Primary Email: mikunkumar242@gmail.com');
        console.log('⏰ Session: 7 days');
    </script>
</body>
</html>
