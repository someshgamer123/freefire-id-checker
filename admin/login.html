<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            window.addEventListener('keydown', e => {
                if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                    e.preventDefault();
                }
            }, true);
            try { ['log', 'debug', 'info', 'warn', 'error'].forEach(m => window.console[m] = () => {}); } catch(e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: rgba(18, 21, 31, 0.85);
            border-radius: 22px;
            padding: 34px 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 22px 0;
        }

        .pin-inputs input {
            width: 44px;
            height: 52px;
            background: #0c0e15;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .pin-inputs input:focus { border-color: #6366f1; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .msg-box { margin-top: 14px; font-size: 13px; color: #ef4444; min-height: 18px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Portal</h2>
        <p style="color:#94a3b8;font-size:13px;margin-top:4px;">Enter your 6-digit passcode to authenticate</p>

        <div class="pin-inputs" id="pinGroup">
            <input type="password" maxlength="1" autofocus>
            <input type="password" maxlength="1">
            <input type="password" maxlength="1">
            <input type="password" maxlength="1">
            <input type="password" maxlength="1">
            <input type="password" maxlength="1">
        </div>

        <button class="btn-submit" onclick="submitPasscode()">Sign In ➜</button>
        <div class="msg-box" id="statusMsg"></div>
    </div>

    <script>
        const inputs = Array.from(document.querySelectorAll('.pin-inputs input'));

        inputs.forEach((inp, i) => {
            inp.addEventListener('input', e => {
                if (inp.value.length === 1 && i < 5) inputs[i + 1].focus();
                if (inputs.every(x => x.value.length === 1)) submitPasscode();
            });
            inp.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
            });
        });

        async function submitPasscode() {
            const passcode = inputs.map(x => x.value).join('');
            const status = document.getElementById('statusMsg');

            if (passcode.length !== 6) {
                status.textContent = 'Enter all 6 digits';
                return;
            }

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passcode })
                });
                const data = await res.json();
                if (data && data.success) {
                    localStorage.setItem('csrfToken', data.csrfToken);
                    window.location.href = '/admin/index.html';
                } else {
                    status.textContent = data.error || 'Authentication failed';
                }
            } catch (e) {
                status.textContent = 'Server connection error';
            }
        }
    </script>
</body>
</html>
