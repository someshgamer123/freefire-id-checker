<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SAFE ANTI-F12 SHIELD -->
    <script>
        (function() {
            document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, true);
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
            }, true);
            try { ['log', 'debug', 'info', 'warn', 'error'].forEach(m => window.console[m] = () => {}); } catch(e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #131722;
            border-radius: 22px;
            padding: 34px 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .icon { font-size: 40px; margin-bottom: 10px; }
        h2 { font-size: 22px; font-weight: 800; }
        p.sub { color: #94a3b8; font-size: 13px; margin: 4px 0 20px; }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
        }

        .pin-inputs input {
            width: 44px;
            height: 52px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        .pin-inputs input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .status-msg {
            margin-top: 14px;
            font-size: 13px;
            color: #ef4444;
            min-height: 18px;
            font-weight: 600;
        }

        .blocked-banner {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: #f87171;
            font-size: 13px;
            font-weight: 700;
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon" id="cardIcon">🔐</div>
        <h2 id="cardTitle">Admin Authentication</h2>
        <p class="sub" id="cardSub">Enter 6-digit passcode to open dashboard</p>

        <div class="pin-inputs" id="pinGroup">
            <input type="password" maxlength="1" autofocus inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
        </div>

        <button class="btn-submit" id="loginBtn" onclick="submitPasscode()">Sign In ➜</button>
        <div class="status-msg" id="statusMsg"></div>
        <div class="blocked-banner" id="blockedBanner">
            ⛔ YOUR DEVICE IS PERMANENTLY BLOCKED!
            <span style="display:block;font-size:11px;font-weight:400;margin-top:4px;color:#cbd5e1;">Banned due to 3 failed passcode attempts. Contact administrator to unblock.</span>
        </div>
    </div>

    <script>
        const inputs = Array.from(document.querySelectorAll('.pin-inputs input'));
        const btn = document.getElementById('loginBtn');
        const status = document.getElementById('statusMsg');
        const banner = document.getElementById('blockedBanner');

        // Check if device is banned on load
        async function checkInitialBlock() {
            try {
                const res = await fetch('/api/admin/block-status');
                const data = await res.json();
                if (data.blocked) lockDeviceUI(data.reason);
            } catch(e) {}
        }
        checkInitialBlock();

        function lockDeviceUI(reason) {
            banner.style.display = 'block';
            inputs.forEach(i => { i.disabled = true; i.value = ''; });
            btn.disabled = true;
            btn.style.opacity = '0.4';
            status.textContent = '';
            document.getElementById('cardIcon').textContent = '⛔';
            document.getElementById('cardTitle').textContent = 'Access Banned';
            document.getElementById('cardSub').textContent = reason || 'Device permanently blocked';
        }

        inputs.forEach((inp, i) => {
            inp.addEventListener('input', () => {
                if (inp.value.length === 1 && i < 5) inputs[i + 1].focus();
                if (inputs.every(x => x.value.length === 1)) submitPasscode();
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
                if (e.key === 'Enter') submitPasscode();
            });
        });

        async function submitPasscode() {
            const passcode = inputs.map(x => x.value).join('');
            if (passcode.length !== 6) {
                status.textContent = '❌ Enter all 6 digits';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            status.textContent = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passcode })
                });
                const data = await res.json();

                if (res.status === 403 || data.error === 'permanently_blocked') {
                    lockDeviceUI(data.message);
                    return;
                }

                if (data && data.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Sign In ➜';
                    status.textContent = '❌ ' + (data.error || 'Incorrect Passcode');
                    inputs.forEach(x => x.value = '');
                    inputs[0].focus();
                }
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Sign In ➜';
                status.textContent = '❌ Connection error';
            }
        }
    </script>
</body>
</html>
