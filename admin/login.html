<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }
        .login-box .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .login-box h2 {
            color: #333;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
        }
        .login-box .sub-title {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .login-box .passcode-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .login-box .passcode-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #ddd;
            border-radius: 12px;
            transition: 0.3s;
            background: #f8f9fa;
            color: #333;
            caret-color: #667eea;
        }
        .login-box .passcode-inputs input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: white;
        }
        .login-box .passcode-inputs input.filled {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .login-box .passcode-inputs input.error {
            border-color: #fc8181;
            background: rgba(252, 129, 129, 0.05);
            animation: shake 0.5s ease;
        }
        .login-box .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .login-box .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .login-box .btn:active {
            transform: scale(0.97);
        }
        .login-box .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #fc8181;
            margin: 10px 0;
            font-weight: 600;
            min-height: 24px;
            font-size: 14px;
        }
        .error:empty {
            display: none;
        }
        .passcode-hint {
            color: #999;
            font-size: 13px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .passcode-hint .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
            transition: 0.3s;
        }
        .passcode-hint .dot.filled {
            background: #667eea;
        }
        .passcode-hint .dot.active {
            background: #667eea;
            animation: pulse 1s infinite;
        }
        .footer-text {
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
        }
        .footer-text a {
            color: #667eea;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            .login-box .passcode-inputs input {
                width: 42px;
                height: 50px;
                font-size: 20px;
            }
            .login-box .passcode-inputs {
                gap: 8px;
            }
        }
        @media (max-width: 380px) {
            .login-box .passcode-inputs input {
                width: 35px;
                height: 42px;
                font-size: 16px;
            }
            .login-box .passcode-inputs {
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub-title">Enter your 6-digit passcode</p>
        
        <div class="passcode-inputs" id="passcodeContainer">
            <input type="password" id="pin1" maxlength="1" autofocus inputmode="numeric">
            <input type="password" id="pin2" maxlength="1" inputmode="numeric">
            <input type="password" id="pin3" maxlength="1" inputmode="numeric">
            <input type="password" id="pin4" maxlength="1" inputmode="numeric">
            <input type="password" id="pin5" maxlength="1" inputmode="numeric">
            <input type="password" id="pin6" maxlength="1" inputmode="numeric">
        </div>
        
        <div class="passcode-hint" id="passcodeHint">
            <span class="dot" id="dot1"></span>
            <span class="dot" id="dot2"></span>
            <span class="dot" id="dot3"></span>
            <span class="dot" id="dot4"></span>
            <span class="dot" id="dot5"></span>
            <span class="dot" id="dot6"></span>
        </div>
        
        <button onclick="login()" class="btn" id="loginBtn">🔑 Login</button>
        <div id="error" class="error"></div>
        <div class="footer-text">
            🔒 Secure | <a href="#" onclick="clearAll()">Clear</a>
        </div>
    </div>
    
    <script>
        // ==================== DOM REFERENCES ====================
        const inputs = ['pin1', 'pin2', 'pin3', 'pin4', 'pin5', 'pin6'];
        const dots = ['dot1', 'dot2', 'dot3', 'dot4', 'dot5', 'dot6'];
        const errorEl = document.getElementById('error');
        const loginBtn = document.getElementById('loginBtn');

        // ==================== FOCUS FIRST INPUT ON LOAD ====================
        window.addEventListener('load', () => {
            document.getElementById('pin1').focus();
        });

        // ==================== INPUT HANDLING ====================
        inputs.forEach((id, index) => {
            const input = document.getElementById(id);
            const dot = document.getElementById(dots[index]);
            
            // Input event
            input.addEventListener('input', function() {
                // Only allow digits
                this.value = this.value.replace(/\D/g, '');
                
                if (this.value.length === 1) {
                    this.classList.add('filled');
                    dot.classList.add('filled');
                    dot.classList.remove('active');
                    errorEl.textContent = '';
                    
                    // Auto-focus next input
                    if (index < 5) {
                        document.getElementById(inputs[index + 1]).focus();
                    } else {
                        // All filled - auto login
                        setTimeout(() => {
                            login();
                        }, 300);
                    }
                } else {
                    this.classList.remove('filled');
                    dot.classList.remove('filled');
                }
                
                // Update dots
                updateDots();
            });

            // Keydown event (Backspace support)
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    document.getElementById(inputs[index - 1]).focus();
                    document.getElementById(inputs[index - 1]).select();
                }
                if (e.key === 'Enter') {
                    login();
                }
                if (e.key === 'Escape') {
                    clearAll();
                }
            });

            // Focus event
            input.addEventListener('focus', function() {
                this.select();
                // Highlight current dot
                dots.forEach((d, i) => {
                    const dotEl = document.getElementById(d);
                    if (i === index && !dotEl.classList.contains('filled')) {
                        dotEl.classList.add('active');
                    } else if (!dotEl.classList.contains('filled')) {
                        dotEl.classList.remove('active');
                    }
                });
            });

            // Blur event
            input.addEventListener('blur', function() {
                dots.forEach((d) => {
                    const dotEl = document.getElementById(d);
                    if (!dotEl.classList.contains('filled')) {
                        dotEl.classList.remove('active');
                    }
                });
            });

            // Paste support
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/\D/g, '').slice(0, 6);
                if (digits) {
                    for (let i = 0; i < digits.length && i < 6; i++) {
                        const inp = document.getElementById(inputs[i]);
                        inp.value = digits[i];
                        inp.classList.add('filled');
                    }
                    // Focus next empty or last
                    const nextIndex = Math.min(digits.length, 5);
                    document.getElementById(inputs[nextIndex]).focus();
                    updateDots();
                    if (digits.length === 6) {
                        setTimeout(login, 300);
                    }
                }
            });
        });

        // ==================== UPDATE DOTS ====================
        function updateDots() {
            dots.forEach((id, index) => {
                const dot = document.getElementById(id);
                const input = document.getElementById(inputs[index]);
                if (input.value.length === 1) {
                    dot.classList.add('filled');
                    dot.classList.remove('active');
                } else {
                    dot.classList.remove('filled');
                }
            });
        }

        // ==================== GET PASSCODE ====================
        function getPasscode() {
            let code = '';
            for (let i = 0; i < 6; i++) {
                const val = document.getElementById(inputs[i]).value;
                if (val === '') return null;
                code += val;
            }
            return code;
        }

        // ==================== CLEAR ALL ====================
        function clearAll() {
            for (let i = 0; i < 6; i++) {
                const input = document.getElementById(inputs[i]);
                input.value = '';
                input.classList.remove('filled', 'error');
                const dot = document.getElementById(dots[i]);
                dot.classList.remove('filled', 'active');
            }
            errorEl.textContent = '';
            document.getElementById('pin1').focus();
            loginBtn.disabled = false;
        }

        // ==================== SHOW ERROR ====================
        function showError(message) {
            errorEl.textContent = '❌ ' + message;
            for (let i = 0; i < 6; i++) {
                const input = document.getElementById(inputs[i]);
                input.classList.add('error');
                setTimeout(() => {
                    input.classList.remove('error');
                }, 600);
            }
            setTimeout(() => {
                clearAll();
            }, 800);
        }

        // ==================== LOGIN ====================
        async function login() {
            const passcode = getPasscode();
            errorEl.textContent = '';
            loginBtn.disabled = true;

            if (!passcode || passcode.length !== 6) {
                showError('Please enter complete 6-digit passcode');
                loginBtn.disabled = false;
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ passcode: passcode })
                });

                const data = await response.json();

                if (data.success) {
                    window.csrfToken = data.csrfToken;
                    window.location.href = 'index.html';
                } else {
                    showError(data.error || 'Invalid passcode!');
                    loginBtn.disabled = false;
                }
            } catch (e) {
                showError('Connection error. Please try again.');
                loginBtn.disabled = false;
            }
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', function(e) {
            // Ctrl+Shift+C to clear
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                clearAll();
                e.preventDefault();
            }
            // Ctrl+Enter to login
            if (e.ctrlKey && e.key === 'Enter') {
                login();
                e.preventDefault();
            }
        });

        // ==================== AUTO-DETECT COMPLETE PASSCODE ====================
        // This is already handled in the input event for the last input
        // But also check on any input change
        document.addEventListener('input', function() {
            let allFilled = true;
            for (let i = 0; i < 6; i++) {
                if (document.getElementById(inputs[i]).value === '') {
                    allFilled = false;
                    break;
                }
            }
            if (allFilled) {
                // Auto login after small delay
                clearTimeout(window._loginTimeout);
                window._loginTimeout = setTimeout(() => {
                    login();
                }, 400);
            }
        });

        // ==================== CONSOLE WELCOME ====================
        console.log('🔐 Admin Login Panel');
        console.log('📌 Enter 6-digit passcode');
        console.log('💡 Tips:');
        console.log('  - Auto-login when all 6 digits filled');
        console.log('  - Press ESC to clear');
        console.log('  - Ctrl+Shift+C to clear');
        console.log('  - Ctrl+Enter to login');
    </script>
</body>
</html>
