<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .login-box {
            background: white; padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 420px; width: 100%;
            text-align: center; animation: fadeInUp 0.6s ease;
        }
        .login-box .logo { font-size: 60px; margin-bottom: 10px; }
        .login-box h2 { color: #333; margin-bottom: 6px; font-size: 24px; font-weight: 700; }
        .login-box .sub-title { color: #666; margin-bottom: 25px; font-size: 14px; }
        .login-box .passcode-inputs {
            display: flex; gap: 10px; justify-content: center; margin: 15px 0;
        }
        .login-box .passcode-inputs input {
            width: 50px; height: 60px; text-align: center; font-size: 24px; font-weight: 700;
            border: 2px solid #ddd; border-radius: 12px; transition: 0.3s;
            background: #f8f9fa; color: #333; caret-color: #667eea;
        }
        .login-box .passcode-inputs input:focus {
            border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: white;
        }
        .login-box .passcode-inputs input.filled {
            border-color: #667eea; background: rgba(102,126,234,0.05);
        }
        .login-box .passcode-inputs input.error {
            border-color: #fc8181; background: rgba(252,129,129,0.05);
            animation: shake 0.5s ease;
        }
        .login-box .btn {
            width: 100%; padding: 15px; font-size: 18px; margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none;
            border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: 600;
        }
        .login-box .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.3); }
        .login-box .btn:active { transform: scale(0.97); }
        .login-box .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error { color: #fc8181; margin: 10px 0; font-weight: 600; min-height: 24px; font-size: 14px; }
        .error:empty { display: none; }
        .passcode-hint {
            color: #999; font-size: 13px; margin: 8px 0; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .passcode-hint .dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #ddd; transition: 0.3s;
        }
        .passcode-hint .dot.filled { background: #667eea; }
        .passcode-hint .dot.active { background: #667eea; animation: pulse 1s infinite; }
        .footer-text { color: #aaa; font-size: 12px; margin-top: 20px; }
        .footer-text a { color: #667eea; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
        .security-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(72,187,120,0.15);
            color: #48bb78;
            margin-bottom: 10px;
        }
        .security-badge.locked {
            background: rgba(252,129,129,0.15);
            color: #fc8181;
        }
        .twofa-input {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            background: #f8f9fa;
            color: #333;
            display: none;
        }
        .twofa-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: white;
        }
        .twofa-input.show { display: block; }
        .twofa-label {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            display: none;
        }
        .twofa-label.show { display: block; }
        .rate-limit-msg {
            background: #fff3cd;
            color: #856404;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin: 10px 0;
            display: none;
            border: 1px solid #ffc107;
        }
        .rate-limit-msg.show { display: block; }
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
            .login-box .passcode-inputs input { width: 42px; height: 50px; font-size: 20px; }
            .login-box .passcode-inputs { gap: 8px; }
        }
        @media (max-width: 380px) {
            .login-box .passcode-inputs input { width: 35px; height: 42px; font-size: 16px; }
            .login-box .passcode-inputs { gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <div class="security-badge" id="securityBadge">🔒 Secure Connection</div>
        <p class="sub-title" id="loginSubtitle">Enter your passcode</p>
        
        <div class="rate-limit-msg" id="rateLimitMsg">
            ⚠️ Too many login attempts. Please wait <span id="rateLimitCountdown">30</span> minutes.
        </div>
        
        <div class="passcode-inputs" id="passcodeContainer">
            <input type="password" id="pin1" maxlength="1" autofocus inputmode="numeric" aria-label="Pin 1">
            <input type="password" id="pin2" maxlength="1" inputmode="numeric" aria-label="Pin 2">
            <input type="password" id="pin3" maxlength="1" inputmode="numeric" aria-label="Pin 3">
            <input type="password" id="pin4" maxlength="1" inputmode="numeric" aria-label="Pin 4">
            <input type="password" id="pin5" maxlength="1" inputmode="numeric" aria-label="Pin 5">
            <input type="password" id="pin6" maxlength="1" inputmode="numeric" aria-label="Pin 6">
        </div>
        
        <div class="passcode-hint" id="passcodeHint">
            <span class="dot" id="dot1"></span>
            <span class="dot" id="dot2"></span>
            <span class="dot" id="dot3"></span>
            <span class="dot" id="dot4"></span>
            <span class="dot" id="dot5"></span>
            <span class="dot" id="dot6"></span>
        </div>
        
        <input type="text" class="twofa-input" id="twoFAToken" placeholder="Enter 2FA token" maxlength="6" inputmode="numeric" aria-label="2FA Token">
        <div class="twofa-label" id="twoFALabel">Enter the 6-digit code from your authenticator app</div>
        
        <button onclick="login()" class="btn" id="loginBtn">🔑 Login</button>
        <div id="error" class="error"></div>
        <div class="footer-text">
            🔒 Secure | <a href="#" onclick="clearAll(event)">Clear</a>
            <span style="margin:0 8px;">|</span>
            <span style="color:#999;font-size:11px;">2FA Enabled</span>
        </div>
    </div>
    <script>
        var inputs = ['pin1', 'pin2', 'pin3', 'pin4', 'pin5', 'pin6'];
        var dots = ['dot1', 'dot2', 'dot3', 'dot4', 'dot5', 'dot6'];
        var errorEl = document.getElementById('error');
        var loginBtn = document.getElementById('loginBtn');
        var is2FARequired = false;
        var twoFAToken = document.getElementById('twoFAToken');
        var twoFALabel = document.getElementById('twoFALabel');
        var rateLimitMsg = document.getElementById('rateLimitMsg');
        var rateLimitCountdown = document.getElementById('rateLimitCountdown');

        window.addEventListener('load', function() { 
            var pin1 = document.getElementById('pin1');
            if (pin1) pin1.focus(); 
        });

        inputs.forEach(function(id, index) {
            var input = document.getElementById(id);
            var dot = document.getElementById(dots[index]);
            
            if (!input) return;
            
            input.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length === 1) {
                    this.classList.add('filled');
                    if (dot) dot.classList.add('filled');
                    if (dot) dot.classList.remove('active');
                    if (errorEl) errorEl.textContent = '';
                    if (index < 5) {
                        var next = document.getElementById(inputs[index + 1]);
                        if (next) next.focus();
                    } else {
                        setTimeout(function() { login(); }, 300);
                    }
                } else {
                    this.classList.remove('filled');
                    if (dot) dot.classList.remove('filled');
                }
                updateDots();
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    var prev = document.getElementById(inputs[index - 1]);
                    if (prev) {
                        prev.focus();
                        prev.select();
                    }
                }
                if (e.key === 'Enter') login();
                if (e.key === 'Escape') clearAll(e);
            });

            input.addEventListener('focus', function() {
                this.select();
                dots.forEach(function(d, i) {
                    var dotEl = document.getElementById(d);
                    if (!dotEl) return;
                    if (i === index && !dotEl.classList.contains('filled')) {
                        dotEl.classList.add('active');
                    } else if (!dotEl.classList.contains('filled')) {
                        dotEl.classList.remove('active');
                    }
                });
            });

            input.addEventListener('blur', function() {
                dots.forEach(function(d) {
                    var dotEl = document.getElementById(d);
                    if (!dotEl) return;
                    if (!dotEl.classList.contains('filled')) {
                        dotEl.classList.remove('active');
                    }
                });
            });

            input.addEventListener('paste', function(e) {
                e.preventDefault();
                var paste = (e.clipboardData || window.clipboardData).getData('text');
                var digits = paste.replace(/\D/g, '').slice(0, 6);
                if (digits) {
                    for (var i = 0; i < digits.length && i < 6; i++) {
                        var inp = document.getElementById(inputs[i]);
                        if (!inp) continue;
                        inp.value = digits[i];
                        inp.classList.add('filled');
                    }
                    var nextIndex = Math.min(digits.length, 5);
                    var next = document.getElementById(inputs[nextIndex]);
                    if (next) next.focus();
                    updateDots();
                    if (digits.length === 6) {
                        setTimeout(login, 300);
                    }
                }
            });
        });

        function updateDots() {
            dots.forEach(function(id, index) {
                var dot = document.getElementById(id);
                if (!dot) return;
                var input = document.getElementById(inputs[index]);
                if (!input) return;
                if (input.value.length === 1) {
                    dot.classList.add('filled');
                    dot.classList.remove('active');
                } else {
                    dot.classList.remove('filled');
                }
            });
        }

        function getPasscode() {
            var code = '';
            for (var i = 0; i < 6; i++) {
                var input = document.getElementById(inputs[i]);
                if (!input) return null;
                var val = input.value;
                if (val === '') return null;
                code += val;
            }
            return code;
        }

        function clearAll(e) {
            if (e) e.preventDefault();
            for (var i = 0; i < 6; i++) {
                var input = document.getElementById(inputs[i]);
                if (!input) continue;
                input.value = '';
                input.classList.remove('filled', 'error');
                var dot = document.getElementById(dots[i]);
                if (dot) dot.classList.remove('filled', 'active');
            }
            if (errorEl) errorEl.textContent = '';
            var pin1 = document.getElementById('pin1');
            if (pin1) pin1.focus();
            if (loginBtn) {
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Login';
            }
            var subTitle = document.getElementById('loginSubtitle');
            if (subTitle) subTitle.textContent = 'Enter your passcode';
            is2FARequired = false;
            if (twoFAToken) {
                twoFAToken.value = '';
                twoFAToken.classList.remove('show');
            }
            if (twoFALabel) twoFALabel.classList.remove('show');
            if (rateLimitMsg) rateLimitMsg.classList.remove('show');
        }

        function showError(message) {
            if (!errorEl) return;
            errorEl.textContent = '❌ ' + message;
            for (var i = 0; i < 6; i++) {
                var input = document.getElementById(inputs[i]);
                if (!input) continue;
                input.classList.add('error');
                setTimeout(function() { 
                    if (input) input.classList.remove('error'); 
                }, 600);
            }
            setTimeout(function() { clearAll(null); }, 800);
        }

        function showRateLimit(seconds) {
            if (rateLimitMsg) {
                rateLimitMsg.classList.add('show');
                if (rateLimitCountdown) {
                    var mins = Math.ceil(seconds / 60);
                    rateLimitCountdown.textContent = mins;
                }
            }
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = '⏳ Wait ' + Math.ceil(seconds / 60) + ' min';
            }
        }

        async function login() {
            var passcode = getPasscode();
            if (!errorEl) return;
            errorEl.textContent = '';
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = '⏳ Verifying...';
            }

            if (!passcode || passcode.length !== 6) {
                showError('Please enter complete 6-digit passcode');
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🔑 Login';
                }
                return;
            }

            try {
                var requestBody = { passcode: passcode };
                
                if (is2FARequired && twoFAToken) {
                    if (twoFAToken.value && twoFAToken.value.length >= 6) {
                        requestBody.token = twoFAToken.value;
                    } else {
                        showError('Please enter 2FA token');
                        if (loginBtn) {
                            loginBtn.disabled = false;
                            loginBtn.textContent = '🔑 Login';
                        }
                        return;
                    }
                }
                
                var response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                // ===== FIXED: Handle rate limit and JSON parsing =====
                if (response.status === 429) {
                    // Rate limit error - show message
                    var text = await response.text();
                    showRateLimit(30 * 60); // 30 minutes
                    showError(text || 'Too many attempts. Please wait 30 minutes.');
                    if (loginBtn) {
                        loginBtn.disabled = true;
                        loginBtn.textContent = '⏳ Locked';
                    }
                    return;
                }

                // Parse JSON only if response is OK
                var data;
                try {
                    data = await response.json();
                } catch (e) {
                    var text = await response.text();
                    showError(text || 'Server error. Please try again.');
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🔑 Login';
                    }
                    return;
                }

                if (data.success) {
                    window.csrfToken = data.csrfToken;
                    localStorage.setItem('csrfToken', data.csrfToken);
                    localStorage.setItem('loginTime', Date.now());
                    window.location.href = 'index.html';
                } else if (data.requires2FA) {
                    is2FARequired = true;
                    var subTitle = document.getElementById('loginSubtitle');
                    if (subTitle) subTitle.textContent = 'Enter 2FA token';
                    if (loginBtn) {
                        loginBtn.textContent = '🔑 Verify 2FA';
                        loginBtn.disabled = false;
                    }
                    
                    if (twoFAToken) {
                        twoFAToken.classList.add('show');
                        twoFAToken.value = '';
                        twoFAToken.focus();
                    }
                    if (twoFALabel) twoFALabel.classList.add('show');
                    
                    if (errorEl) {
                        errorEl.textContent = '🔐 2FA required. Enter your authenticator code.';
                        errorEl.style.color = '#667eea';
                    }
                } else {
                    showError(data.error || 'Invalid passcode!');
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🔑 Login';
                    }
                }
            } catch (e) {
                console.error('Login error:', e);
                showError('Connection error. Please try again.');
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🔑 Login';
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'C') { 
                clearAll(e); 
                e.preventDefault(); 
            }
            if (e.ctrlKey && e.key === 'Enter') { 
                login(); 
                e.preventDefault(); 
            }
        });

        document.addEventListener('input', function() {
            var allFilled = true;
            for (var i = 0; i < 6; i++) {
                var input = document.getElementById(inputs[i]);
                if (!input || input.value === '') { allFilled = false; break; }
            }
            if (allFilled && !is2FARequired) {
                clearTimeout(window._loginTimeout);
                window._loginTimeout = setTimeout(function() { login(); }, 400);
            }
            
            if (twoFAToken && twoFAToken.value.length >= 6) {
                clearTimeout(window._loginTimeout);
                window._loginTimeout = setTimeout(function() { login(); }, 400);
            }
        });

        console.log('🔐 Secure Admin Login Panel');
        console.log('🛡️ 2FA Enabled');
        console.log('🔒 Strong Password Required');
        console.log('⏰ Session: 60 minutes');
    </script>
</body>
</html>
