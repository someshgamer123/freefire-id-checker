<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SAFE ANTI-F12 & ANTI-INSPECT SHIELD -->
    <script>
        (function() {
            document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, true);
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); return false;
                }
                if ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(e.key.toUpperCase())) {
                    e.preventDefault(); return false;
                }
            }, true);
            try {
                const noop = () => {};
                ['log', 'debug', 'info', 'warn', 'error', 'table', 'trace'].forEach(m => window.console[m] = noop);
            } catch(e) {}
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a10;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 65%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: rgba(19, 23, 34, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 38px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card-icon {
            font-size: 44px;
            margin-bottom: 12px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #fff; }
        p.sub-desc { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }

        .pin-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pin-group input {
            width: 46px;
            height: 56px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }
        .pin-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: #11141f;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(99, 102, 241, 0.55); }
        .btn-submit:active { transform: scale(0.98); }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            color: #ef4444;
            min-height: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .blocked-banner {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 14px;
            padding: 16px;
            color: #f87171;
            font-size: 13px;
            font-weight: 700;
            margin-top: 16px;
            line-height: 1.5;
            animation: popIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="login-card" id="loginCard">
        <div class="card-icon" id="cardIcon">🔐</div>
        <h2 id="cardTitle">Admin Authentication</h2>
        <p class="sub-desc" id="cardSub">Enter your 6-digit passcode to access the control panel</p>

        <div class="pin-group" id="pinGroup">
            <input type="password" maxlength="1" autofocus inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
        </div>

        <button class="btn-submit" id="loginBtn" onclick="submitPasscode()">Sign In ➜</button>
        <div class="status-msg" id="statusMsg"></div>

        <div class="blocked-banner" id="blockedBanner">
            ⛔ YOUR DEVICE IS PERMANENTLY BLOCKED!
            <span style="display:block;font-size:11px;font-weight:400;margin-top:6px;color:#cbd5e1;">
                Banned due to 3 failed passcode attempts.<br>
                Refreshing will not bypass this ban. Contact administrator to unblock.
            </span>
        </div>
    </div>

    <script>
        // Persistent Client Device Identifier (Prevents unblock on refresh)
        let deviceId = localStorage.getItem('adminDevId');
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
            localStorage.setItem('adminDevId', deviceId);
        }
        document.cookie = `devId=${deviceId}; path=/; max-age=31536000; SameSite=Lax`;

        const inputs = Array.from(document.querySelectorAll('.pin-group input'));
        const btn = document.getElementById('loginBtn');
        const status = document.getElementById('statusMsg');
        const banner = document.getElementById('blockedBanner');

        // Check if device is banned on load
        async function checkInitialBlock() {
            try {
                const res = await fetch('/api/admin/block-status', { credentials: 'include' });
                const data = await res.json();
                if (data.blocked) {
                    lockDeviceUI(data.reason);
                }
            } catch(e) {}
        }
        checkInitialBlock();

        function lockDeviceUI(reason) {
            banner.style.display = 'block';
            inputs.forEach(i => { i.disabled = true; i.value = ''; });
            btn.disabled = true;
            btn.style.opacity = '0.4';
            btn.style.cursor = 'not-allowed';
            status.textContent = '';
            document.getElementById('cardIcon').textContent = '⛔';
            document.getElementById('cardTitle').textContent = 'Access Banned';
            document.getElementById('cardSub').textContent = reason || 'Device permanently blocked';
        }

        inputs.forEach((inp, i) => {
            inp.addEventListener('input', () => {
                if (inp.value.length === 1 && i < 5) inputs[i + 1].focus();
                if (inputs.every(x => x.value.length === 1)) submitPasscode();
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
                if (e.key === 'Enter') submitPasscode();
            });
        });

        async function submitPasscode() {
            const passcode = inputs.map(x => x.value).join('');
            if (passcode.length !== 6) {
                status.textContent = '❌ Please enter all 6 digits';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            status.textContent = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ passcode })
                });
                const data = await res.json();

                if (res.status === 403 || data.error === 'permanently_blocked') {
                    lockDeviceUI(data.message);
                    return;
                }

                if (data && data.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Sign In ➜';
                    status.textContent = '❌ ' + (data.error || 'Incorrect Passcode');
                    inputs.forEach(x => x.value = '');
                    inputs[0].focus();
                }
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Sign In ➜';
                status.textContent = '❌ Network or server error';
            }
        }
    </script>
</body>
</html>
