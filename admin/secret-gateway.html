<!DOCTYPE html>
<html>
<head>
    <title>404 Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container .error-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }
        .container .error-icon {
            font-size: 80px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .container h1 {
            color: #e2e8f0;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .container p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .container .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .container .search-box input {
            padding: 12px 20px;
            border: 1px solid #2d3138;
            border-radius: 12px;
            background: rgba(15,17,23,0.8);
            color: #e2e8f0;
            font-size: 16px;
            width: 250px;
            transition: 0.3s;
            outline: none;
        }
        .container .search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .container .search-box input::placeholder {
            color: #4a4e57;
        }
        .container .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: #2d3138;
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .container .search-box button:hover {
            background: #3b3f48;
            transform: translateY(-2px);
        }
        .container .footer-text {
            margin-top: 30px;
            font-size: 13px;
            color: #4a4e57;
        }
        .container .footer-text span {
            color: #6366f1;
            cursor: pointer;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 500;
        }

        /* ===== INVISIBLE SECRET AREA ===== */
        .secret-tap-area {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            z-index: 9999;
            cursor: pointer;
            opacity: 0.01;
            background: transparent;
            border: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .secret-tap-area:hover {
            opacity: 0.05;
        }

        /* ===== SECRET KEY MODAL ===== */
        .secret-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 17, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .secret-modal.show {
            display: flex;
            animation: fadeInUp 0.5s ease;
        }
        .secret-modal .modal-box {
            background: rgba(26, 28, 35, 0.95);
            border-radius: 24px;
            padding: 40px 35px 35px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.05);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .secret-modal .modal-box .lock-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
        }
        .secret-modal .modal-box h2 {
            color: #e2e8f0;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .secret-modal .modal-box .sub-text {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .secret-modal .modal-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #2d3138;
            border-radius: 12px;
            background: rgba(15,17,23,0.8);
            color: #e2e8f0;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            transition: 0.3s;
            outline: none;
        }
        .secret-modal .modal-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .secret-modal .modal-box input::placeholder {
            color: #4a4e57;
        }
        .secret-modal .modal-box input.error-input {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239,68,68,0.15);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .secret-modal .modal-box .btn-unlock {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .secret-modal .modal-box .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(99,102,241,0.3);
        }
        .secret-modal .modal-box .btn-unlock:active {
            transform: scale(0.97);
        }
        .secret-modal .modal-box .btn-close-modal {
            background: transparent;
            border: none;
            color: #4a4e57;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }
        .secret-modal .modal-box .btn-close-modal:hover {
            color: #e2e8f0;
        }
        .secret-modal .modal-box .modal-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }
        .secret-modal .modal-box .modal-success {
            color: #22c55e;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }
        .tap-count-hint {
            position: fixed;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.03);
            font-size: 10px;
            z-index: 9998;
            pointer-events: none;
            user-select: none;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .container .error-code { font-size: 80px; }
            .container .error-icon { font-size: 60px; }
            .container h1 { font-size: 22px; }
            .container .search-box input { width: 100%; }
            .secret-modal .modal-box { padding: 30px 20px 25px; }
            .secret-modal .modal-box h2 { font-size: 18px; }
            .secret-tap-area { width: 80px; height: 30px; bottom: 50px; }
        }
        @media (max-width: 380px) {
            .secret-modal .modal-box { padding: 20px 14px 18px; }
            .secret-modal .modal-box h2 { font-size: 16px; }
            .secret-modal .modal-box input { padding: 12px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved.<br>Try searching for something else.</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for pages..." maxlength="50">
            <button onclick="fakeSearch()">Search</button>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        
        <p class="footer-text">If you believe this is a mistake, contact <span>support@example.com</span></p>
    </div>

    <!-- ===== INVISIBLE TAP AREA ===== -->
    <div class="secret-tap-area" id="secretTapArea" title=""></div>
    <div class="tap-count-hint" id="tapCountHint">••••</div>

    <!-- ===== SECRET KEY MODAL ===== -->
    <div class="secret-modal" id="secretModal">
        <div class="modal-box">
            <span class="lock-icon">🔐</span>
            <h2>Admin Access</h2>
            <p class="sub-text">Enter the secret key to continue</p>
            <input type="password" id="secretKeyInput" placeholder="Enter secret key..." maxlength="50" autofocus>
            <div id="modalStatus" class="modal-error"></div>
            <button class="btn-unlock" onclick="verifySecretKey()">🔑 Unlock</button>
            <br>
            <button class="btn-close-modal" onclick="closeSecretModal()">✕ Cancel</button>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        let tapCount = 0;
        const TAP_REQUIRED = 4;
        let tapTimer = null;
        let secretKey = 'admin@2024';

        // ===== FETCH SECRET KEY FROM SERVER =====
        async function loadSecretKey() {
            try {
                const response = await fetch('/api/admin/public-secret-key');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.secretKey) {
                        secretKey = data.secretKey;
                        console.log('🔑 Secret key loaded from server:', secretKey);
                    }
                }
            } catch (e) {
                console.log('⚠️ Using default secret key: admin@2024');
            }
        }

        // ===== FAKE SEARCH (Always shows error) =====
        function fakeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            if (!query) {
                errorMsg.textContent = '❌ Please enter a search term';
                return;
            }
            errorMsg.textContent = '❌ No results found for "' + query + '"';
            setTimeout(() => { errorMsg.textContent = ''; }, 3000);
            
            const input = document.getElementById('searchInput');
            input.style.borderColor = '#ef4444';
            input.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.15)';
            setTimeout(() => {
                input.style.borderColor = '#2d3138';
                input.style.boxShadow = 'none';
            }, 800);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fakeSearch();
        });

        // ===== INVISIBLE TAP AREA =====
        document.getElementById('secretTapArea').addEventListener('click', function(e) {
            e.stopPropagation();
            tapCount++;
            
            const hint = document.getElementById('tapCountHint');
            const dots = '●'.repeat(tapCount) + '○'.repeat(TAP_REQUIRED - tapCount);
            hint.textContent = dots;
            hint.style.color = tapCount >= TAP_REQUIRED ? 'rgba(99,102,241,0.15)' : 'rgba(255,255,255,0.03)';
            
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => {
                tapCount = 0;
                hint.textContent = '••••';
                hint.style.color = 'rgba(255,255,255,0.03)';
            }, 5000);
            
            if (tapCount >= TAP_REQUIRED) {
                tapCount = 0;
                hint.textContent = '••••';
                hint.style.color = 'rgba(255,255,255,0.03)';
                showSecretModal();
            }
        });

        // ===== SHOW SECRET MODAL =====
        function showSecretModal() {
            const modal = document.getElementById('secretModal');
            modal.classList.add('show');
            setTimeout(() => {
                document.getElementById('secretKeyInput').focus();
            }, 300);
            document.getElementById('modalStatus').textContent = '';
            document.getElementById('modalStatus').className = 'modal-error';
        }

        function closeSecretModal() {
            document.getElementById('secretModal').classList.remove('show');
            document.getElementById('secretKeyInput').value = '';
            document.getElementById('modalStatus').textContent = '';
            document.getElementById('modalStatus').className = 'modal-error';
        }

        // ===== VERIFY SECRET KEY =====
        async function verifySecretKey() {
            const key = document.getElementById('secretKeyInput').value.trim();
            const statusEl = document.getElementById('modalStatus');
            
            if (!key) {
                statusEl.textContent = '❌ Please enter the secret key';
                statusEl.className = 'modal-error';
                const input = document.getElementById('secretKeyInput');
                input.classList.add('error-input');
                setTimeout(() => input.classList.remove('error-input'), 600);
                return;
            }
            
            // ✅ First check with loaded secret key
            if (key === secretKey) {
                statusEl.textContent = '✅ Access granted! Redirecting...';
                statusEl.className = 'modal-success';
                setTimeout(() => {
                    window.location.href = '/admin/login.html';
                }, 800);
                return;
            }
            
            // ✅ If not match, check with server
            try {
                const response = await fetch('/api/admin/verify-secret-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });
                const data = await response.json();
                if (data && data.success) {
                    statusEl.textContent = '✅ Access granted! Redirecting...';
                    statusEl.className = 'modal-success';
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 800);
                    return;
                }
            } catch (e) {
                // Server check failed
            }
            
            // ❌ Wrong key
            statusEl.textContent = '❌ Invalid secret key. Please try again.';
            statusEl.className = 'modal-error';
            const input = document.getElementById('secretKeyInput');
            input.classList.add('error-input');
            input.value = '';
            setTimeout(() => input.classList.remove('error-input'), 600);
            setTimeout(() => input.focus(), 300);
        }

        document.getElementById('secretKeyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifySecretKey();
        });

        document.getElementById('secretKeyInput').addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeSecretModal();
        });

        // Close modal on outside click
        document.getElementById('secretModal').addEventListener('click', function(e) {
            if (e.target === this) closeSecretModal();
        });

        // ===== URL PARAMETER CHECK =====
        const params = new URLSearchParams(window.location.search);
        const keyParam = params.get('key');
        if (keyParam) {
            fetch('/api/admin/verify-secret-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: keyParam })
            }).then(r => r.json()).then(data => {
                if (data && data.success) {
                    window.location.href = '/admin/login.html';
                }
            }).catch(() => {
                if (keyParam === secretKey) {
                    window.location.href = '/admin/login.html';
                }
            });
        }

        // ===== LOAD SECRET KEY =====
        loadSecretKey();

        console.log('🔐 404 Not Found - Secret Gateway');
        console.log('👆 Tap the invisible area 4 times to reveal admin login');
        console.log('🔑 Secret key is stored securely on server');
        console.log('🔑 Default key: admin@2024');
    </script>
</body>
</html>
