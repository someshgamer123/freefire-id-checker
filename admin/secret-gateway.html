<!DOCTYPE html>
<html>
<head>
    <title>404 Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container .error-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }
        .container .error-icon {
            font-size: 80px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .container h1 {
            color: #e2e8f0;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .container p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .container .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .container .search-box input {
            padding: 12px 20px;
            border: 1px solid #2d3138;
            border-radius: 12px;
            background: rgba(15,17,23,0.8);
            color: #e2e8f0;
            font-size: 16px;
            width: 250px;
            transition: 0.3s;
            outline: none;
        }
        .container .search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .container .search-box input::placeholder {
            color: #4a4e57;
        }
        .container .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: #2d3138;
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .container .search-box button:hover {
            background: #3b3f48;
            transform: translateY(-2px);
        }
        .container .footer-text {
            margin-top: 30px;
            font-size: 13px;
            color: #4a4e57;
        }
        .container .footer-text span {
            color: #6366f1;
            cursor: pointer;
        }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            font-weight: 500;
            min-height: 24px;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @media (max-width: 480px) {
            .container .error-code { font-size: 80px; }
            .container .error-icon { font-size: 60px; }
            .container h1 { font-size: 22px; }
            .container .search-box input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved.<br>Try searching for something else.</p>
        
        <div class="search-box">
            <input type="text" id="secretKeyInput" placeholder="Search for pages..." maxlength="50" autocomplete="off">
            <button onclick="verifySecretKey()">Search</button>
        </div>
        
        <div id="statusMessage" class="error-msg"></div>
        
        <p class="footer-text">If you believe this is a mistake, contact <span>support@somu.com</span></p>
    </div>

    <script>
        // The secret key to reveal the admin login
        const SECRET_KEY = '@somu93370899';
        let correctAttemptCount = 0;
        let isUnlocked = false;
        
        function verifySecretKey() {
            // If already unlocked, don't process further
            if (isUnlocked) return;
            
            const input = document.getElementById('secretKeyInput');
            const key = input.value.trim();
            const statusEl = document.getElementById('statusMessage');
            
            // If key is empty, show error
            if (!key) {
                statusEl.textContent = '❌ Please enter a search term.';
                input.style.borderColor = '#ef4444';
                input.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.15)';
                setTimeout(() => {
                    input.style.borderColor = '#2d3138';
                    input.style.boxShadow = 'none';
                }, 800);
                return;
            }
            
            // Check if the entered key is correct
            if (key === SECRET_KEY) {
                // Correct key entered
                correctAttemptCount++;
                input.value = ''; // Clear input after each attempt
                
                if (correctAttemptCount < 3) {
                    // 1st and 2nd correct attempt: Show fake error
                    statusEl.textContent = `❌ No results found for "${key}".`;
                    input.style.borderColor = '#ef4444';
                    input.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.15)';
                    setTimeout(() => {
                        input.style.borderColor = '#2d3138';
                        input.style.boxShadow = 'none';
                    }, 800);
                } else {
                    // 3rd correct attempt: SILENT UNLOCK - No message, just redirect
                    isUnlocked = true;
                    statusEl.textContent = ''; // Clear any previous message
                    input.style.borderColor = '#22c55e';
                    input.style.boxShadow = '0 0 0 3px rgba(34,197,94,0.15)';
                    
                    // Redirect to login page after 0.5 seconds (silent)
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 500);
                }
            } else {
                // Wrong key: Reset correct attempts and show error
                correctAttemptCount = 0;
                statusEl.textContent = `❌ No results found for "${key}".`;
                input.style.borderColor = '#ef4444';
                input.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.15)';
                setTimeout(() => {
                    input.style.borderColor = '#2d3138';
                    input.style.boxShadow = 'none';
                }, 800);
            }
        }
        
        // Handle Enter key
        document.getElementById('secretKeyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifySecretKey();
            }
        });
        
        // Handle manual URL parameter (easter egg)
        const params = new URLSearchParams(window.location.search);
        const keyParam = params.get('key');
        if (keyParam && keyParam === SECRET_KEY) {
            // If someone tries to use ?key=@somu93370899, redirect to login directly
            window.location.href = '/admin/login.html';
        }
        
        // Reset attempt count when page reloads
        console.log('🔒 Secret Gateway initialized. Correct Attempts: 0/3');
    </script>
</body>
</html>
