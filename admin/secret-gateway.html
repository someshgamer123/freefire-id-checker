<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        window.addEventListener('keydown', e => {
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        }, true);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #94a3b8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            user-select: none;
        }
        .error-code {
            font-size: 110px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h1 { color: #f8fafc; font-size: 24px; margin: 14px 0 6px; }
        p { font-size: 14px; }

        .secret-trigger {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 60px;
            cursor: pointer;
            opacity: 0.01;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The requested URL was not found on this server.</p>
    </div>

    <!-- 4 Taps here opens Login Page directly -->
    <div class="secret-trigger" id="secretTrigger" title="Secret Area"></div>

    <script>
        let taps = 0;
        let timer;
        document.getElementById('secretTrigger').addEventListener('click', () => {
            taps++;
            clearTimeout(timer);
            timer = setTimeout(() => { taps = 0; }, 3000);

            if (taps >= 4) {
                taps = 0;
                window.location.href = '/admin/login.html';
            }
        });
    </script>
</body>
</html>
