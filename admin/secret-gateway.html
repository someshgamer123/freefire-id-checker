<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ANTI-F12 & INSPECT SHIELD -->
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            window.addEventListener('keydown', e => {
                if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                    e.preventDefault();
                }
            }, true);
            try { ['log', 'debug', 'info', 'warn', 'error'].forEach(m => window.console[m] = () => {}); } catch(e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #94a3b8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-num {
            font-size: 100px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        h1 { color: #f8fafc; font-size: 24px; margin: 12px 0 6px; }

        /* Secret trigger element at bottom */
        .secret-trigger {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
            cursor: pointer;
            opacity: 0.01;
            z-index: 999;
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }
        .modal-bg.show { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: #141722;
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .modal-box input {
            width: 100%;
            padding: 13px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            text-align: center;
            font-size: 16px;
            margin: 14px 0 8px;
            outline: none;
        }
        .modal-box input:focus { border-color: #6366f1; }

        .btn-unlock {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #6366f1;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-unlock:active { transform: scale(0.98); }

        .status-msg {
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
            font-weight: 600;
        }
        .status-msg.error { color: #ef4444; }
        .status-msg.success { color: #22c55e; }

        .direct-link {
            display: inline-block;
            margin-top: 14px;
            font-size: 12px;
            color: #6366f1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div>
        <div class="error-num">404</div>
        <h1>Page Not Found</h1>
        <p>The requested URL was not found on this server.</p>
    </div>

    <!-- Hidden 4-tap trigger at bottom -->
    <div class="secret-trigger" id="secretTrigger" title="Tap 4 times"></div>

    <div class="modal-bg" id="modal">
        <div class="modal-box">
            <h3 style="color:#fff;font-size:18px;">Portal Authentication</h3>
            <p style="font-size:12px;color:#94a3b8;margin-top:4px;">Enter secret key or admin passcode</p>
            <input 
                type="password" 
                id="secretKeyInput" 
                placeholder="Key (admin@2024 or 951753)"
                autocapitalize="none"
                autocorrect="off"
                autocomplete="off"
                spellcheck="false">
            <button class="btn-unlock" id="verifyBtn" onclick="unlockGateway()">Verify</button>
            <div class="status-msg" id="statusText"></div>
            <a href="/admin/login.html" class="direct-link">Direct Login Page ➜</a>
        </div>
    </div>

    <script>
        let taps = 0;
        let tapTimeout;
        const trigger = document.getElementById('secretTrigger');
        const modal = document.getElementById('modal');
        const input = document.getElementById('secretKeyInput');
        const btn = document.getElementById('verifyBtn');
        const status = document.getElementById('statusText');

        // Check URL parameter for auto-open (?key=...)
        const urlKey = new URLSearchParams(window.location.search).get('key');
        if (urlKey) {
            modal.classList.add('show');
            input.value = urlKey;
            unlockGateway();
        }

        trigger.addEventListener('click', () => {
            taps++;
            clearTimeout(tapTimeout);
            tapTimeout = setTimeout(() => { taps = 0; }, 3000);
            if (taps >= 4) {
                taps = 0;
                modal.classList.add('show');
                input.focus();
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlockGateway();
        });

        async function unlockGateway() {
            const rawKey = input.value.trim();
            const key = rawKey.toLowerCase();

            if (!rawKey) {
                status.className = 'status-msg error';
                status.textContent = '❌ Please enter key or passcode';
                return;
            }

            btn.textContent = 'Verifying...';
            btn.disabled = true;
            status.textContent = '';

            // Instant Client-side Match Check
            if (key === 'admin@2024' || rawKey === '951753') {
                status.className = 'status-msg success';
                status.textContent = '✅ Access Granted! Opening...';
                btn.textContent = 'Redirecting...';
                setTimeout(() => {
                    window.location.href = '/admin/login.html';
                }, 400);
                return;
            }

            // Server-side verification
            try {
                const res = await fetch('/api/admin/verify-secret-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: rawKey })
                });
                const d = await res.json();
                if (d && d.success) {
                    status.className = 'status-msg success';
                    status.textContent = '✅ Verified! Opening...';
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 400);
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Verify';
                    status.className = 'status-msg error';
                    status.textContent = '❌ Invalid key! (Default: admin@2024)';
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Verify';
                status.className = 'status-msg error';
                status.textContent = '❌ Server unreachable. Check connection.';
            }
        }
    </script>
</body>
</html>
