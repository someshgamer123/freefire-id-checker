<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ANTI-F12 SHIELD -->
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            window.addEventListener('keydown', e => {
                if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                    e.preventDefault();
                }
            }, true);
            try { ['log', 'debug', 'info', 'warn', 'error'].forEach(m => window.console[m] = () => {}); } catch(e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #090a0f;
            color: #94a3b8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-num {
            font-size: 110px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        h1 { color: #f8fafc; font-size: 26px; margin: 12px 0 6px; }

        /* Secret trigger element */
        .secret-trigger {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            cursor: pointer;
            opacity: 0.01;
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-bg.show { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: #141722;
            padding: 28px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            margin: 14px 0;
        }

        .btn-unlock {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #6366f1;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <div class="error-num">404</div>
        <h1>Page Not Found</h1>
        <p>The requested URL was not found on this server.</p>
    </div>

    <!-- Hidden 4-tap trigger -->
    <div class="secret-trigger" id="secretTrigger"></div>

    <div class="modal-bg" id="modal">
        <div class="modal-box">
            <h3 style="color:#fff;">Portal Authentication</h3>
            <input type="password" id="secretKeyInput" placeholder="Enter Secret Passphrase">
            <button class="btn-unlock" onclick="unlockGateway()">Verify</button>
        </div>
    </div>

    <script>
        let taps = 0;
        document.getElementById('secretTrigger').addEventListener('click', () => {
            taps++;
            if (taps >= 4) {
                taps = 0;
                document.getElementById('modal').classList.add('show');
            }
        });

        async function unlockGateway() {
            const key = document.getElementById('secretKeyInput').value.trim();
            const res = await fetch('/api/admin/verify-secret-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            const d = await res.json();
            if (d && d.success) {
                window.location.href = '/admin/login.html';
            } else {
                alert('Invalid security key');
            }
        }
    </script>
</body>
</html>
