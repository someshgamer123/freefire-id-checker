<!DOCTYPE html>
<html>
<head>
    <title>UID Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0a1a;
            position: relative;
            overflow: hidden;
        }
        
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden;
        }
        .bg-container img {
            width: 100%; height: 100%; object-fit: cover; filter: blur(8px) brightness(0.4); transform: scale(1.1);
        }
        .bg-container .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
        }
        
        .container {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .logo { font-size: 50px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .container h2 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
        .container .sub-title { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 300; margin-bottom: 25px; }
        
        .uid-input-wrapper { position: relative; margin-bottom: 15px; }
        .uid-input-wrapper input {
            width: 100%; padding: 16px 20px; padding-right: 50px;
            border: 2px solid rgba(255,255,255,0.15); border-radius: 16px; font-size: 18px; font-weight: 500;
            text-align: center; letter-spacing: 3px; background: rgba(255,255,255,0.07); color: #fff;
            transition: all 0.3s ease; outline: none;
        }
        .uid-input-wrapper input::placeholder { color: rgba(255,255,255,0.35); letter-spacing: 1px; font-weight: 300; }
        .uid-input-wrapper input:focus { border-color: rgba(102,126,234,0.6); box-shadow: 0 0 30px rgba(102,126,234,0.15); background: rgba(255,255,255,0.1); }
        .uid-input-wrapper input.error-input {
            border-color: #fc8181;
            box-shadow: 0 0 30px rgba(252,129,129,0.2);
            animation: shakeInput 0.5s ease;
        }
        @keyframes shakeInput {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .uid-input-wrapper .clear-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: rgba(255,255,255,0.4); font-size: 20px; cursor: pointer; display: none; transition: 0.3s;
        }
        .uid-input-wrapper .clear-btn.show { display: block; }
        .uid-input-wrapper .clear-btn:hover { color: #fff; }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; padding: 16px;
            border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px;
            transition: all 0.3s ease; letter-spacing: 0.5px; position: relative; overflow: hidden;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.4); }
        .btn:active { transform: scale(0.97); }
        .btn .ripple {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0);
            animation: rippleAnim 0.6s linear; pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        
        .loading-container { display: none; margin: 30px 0 20px; padding: 20px; }
        .loading-container.show { display: block; animation: fadeIn 0.4s ease; }
        .spinner {
            width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #667eea;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-container p { color: rgba(255,255,255,0.7); margin-top: 15px; font-size: 14px; font-weight: 300; }
        
        .success-popup {
            display: none; margin: 20px 0; padding: 25px;
            background: rgba(72,187,120,0.15); border: 1px solid rgba(72,187,120,0.3); border-radius: 20px;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .success-popup.show { display: block; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .success-popup .icon { font-size: 50px; display: block; margin-bottom: 8px; }
        .success-popup .label { color: #48bb78; font-size: 18px; font-weight: 700; }
        .success-popup .sub-label { color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 300; }
        
        .buttons-container { display: none; margin-top: 20px; gap: 12px; animation: fadeIn 0.5s ease; }
        .buttons-container.show { display: flex; flex-direction: column; }
        .action-btn {
            padding: 16px; border: none; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; width: 100%; color: #fff; letter-spacing: 0.5px; position: relative; overflow: hidden;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.btn-1 { background: linear-gradient(135deg, #48bb78, #38a169); }
        .action-btn.btn-1:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(72,187,120,0.4); }
        .action-btn.btn-2 { background: linear-gradient(135deg, #4299e1, #3182ce); }
        .action-btn.btn-2:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(66,153,225,0.4); }
        .action-btn.tap-effect { animation: tapPulse 0.3s ease; }
        @keyframes tapPulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeInOverlay 0.3s ease;
        }
        .custom-alert-overlay.show {
            display: flex;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .custom-alert-box {
            background: linear-gradient(145deg, rgba(25,25,55,0.97), rgba(15,15,35,0.98));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 34px 30px 30px;
            max-width: 380px;
            width: 92%;
            text-align: center;
            border: 2px solid rgba(252,129,129,0.25);
            box-shadow: 0 0 80px rgba(252,129,129,0.08), inset 0 0 80px rgba(252,129,129,0.02);
            animation: alertPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .custom-alert-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(252,129,129,0.2), rgba(229,62,62,0.1), rgba(252,129,129,0.2));
            z-index: -1;
            animation: alertBorderPulse 2s ease-in-out infinite;
        }
        @keyframes alertBorderPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        @keyframes alertPopIn {
            from { opacity: 0; transform: scale(0.85) translateY(30px) rotate(-2deg); }
            to { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }
        
        .custom-alert-box .alert-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 8px;
            animation: alertShake 0.6s ease;
        }
        @keyframes alertShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-20deg) scale(1.1); }
            30% { transform: rotate(20deg) scale(1.1); }
            45% { transform: rotate(-12deg) scale(1.05); }
            60% { transform: rotate(12deg) scale(1.05); }
            80% { transform: rotate(-5deg) scale(1); }
        }
        
        .custom-alert-box .alert-title {
            font-size: 24px;
            font-weight: 800;
            color: #fc8181;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(252,129,129,0.15);
        }
        .custom-alert-box .alert-message {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 22px;
            line-height: 1.7;
        }
        .custom-alert-box .alert-message strong {
            color: #fc8181;
            font-weight: 700;
        }
        .custom-alert-box .alert-message .rule {
            display: inline-block;
            background: rgba(252,129,129,0.08);
            padding: 2px 12px;
            border-radius: 6px;
            margin: 0 2px;
            font-weight: 600;
            color: #fc8181;
        }
        
        .custom-alert-box .alert-btn {
            padding: 13px 44px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #fc8181, #e53e3e);
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(252,129,129,0.2);
            position: relative;
            overflow: hidden;
        }
        .custom-alert-box .alert-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 60px rgba(252,129,129,0.35);
        }
        .custom-alert-box .alert-btn:active {
            transform: scale(0.96);
        }
        .custom-alert-box .alert-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        
        .error-page {
            display: none;
            padding: 20px 0;
            animation: fadeInUp 0.6s ease;
        }
        .error-page.show { display: block; }
        .error-page .error-icon {
            font-size: 70px;
            display: block;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        .error-page .error-title {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
        .error-page .error-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }
        .error-page .error-status {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .error-page .error-status.suspended {
            background: rgba(246,173,85,0.2);
            color: #f6ad55;
            border: 1px solid rgba(246,173,85,0.2);
        }
        .error-page .error-status.disabled {
            background: rgba(252,129,129,0.2);
            color: #fc8181;
            border: 1px solid rgba(252,129,129,0.2);
        }
        .error-page .error-status.expired {
            background: rgba(252,129,129,0.2);
            color: #fc8181;
            border: 1px solid rgba(252,129,129,0.2);
        }
        .error-page .error-status.not_found {
            background: rgba(160,174,192,0.2);
            color: #a0aec0;
            border: 1px solid rgba(160,174,192,0.2);
        }
        .error-page .btn-back {
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .error-page .btn-back:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102,126,234,0.3); }
        
        @media (max-width: 480px) {
            .container { padding: 28px 20px; border-radius: 24px; }
            .container h2 { font-size: 19px; }
            .uid-input-wrapper input { font-size: 16px; padding: 14px 16px; padding-right: 45px; }
            .btn { font-size: 16px; padding: 14px; }
            .action-btn { font-size: 15px; padding: 14px; }
            .logo { font-size: 40px; }
            .success-popup .icon { font-size: 40px; }
            .error-page .error-icon { font-size: 50px; }
            .error-page .error-title { font-size: 20px; }
            .custom-alert-box { padding: 26px 20px 24px; }
            .custom-alert-box .alert-title { font-size: 20px; }
            .custom-alert-box .alert-icon { font-size: 50px; }
            .custom-alert-box .alert-btn { padding: 11px 32px; font-size: 14px; }
            .custom-alert-box .alert-message { font-size: 13px; }
        }
        @media (max-width: 380px) {
            .custom-alert-box { padding: 20px 16px; }
            .custom-alert-box .alert-title { font-size: 17px; }
            .custom-alert-box .alert-icon { font-size: 40px; }
            .custom-alert-box .alert-btn { padding: 10px 24px; font-size: 13px; }
            .custom-alert-box .alert-message { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="bg-container" id="bgContainer">
        <img id="bgImage" src="" alt="background">
        <div class="overlay"></div>
    </div>
    
    <div class="container">
        <div class="logo">🎮</div>
        <h2>Enter Your UID</h2>
        <p class="sub-title">Enter your Free Fire UID to continue</p>
        
        <div id="normalContent">
            <div class="uid-input-wrapper">
                <input type="text" id="uidInput" placeholder="Enter UID" maxlength="12" autofocus>
                <button class="clear-btn" id="clearBtn" onclick="clearInput()">✕</button>
            </div>
            <button onclick="checkUID()" class="btn" id="checkBtn">➜ Process</button>
            
            <div class="loading-container" id="loadingContainer">
                <div class="spinner"></div>
                <p>⏳ Verifying UID...</p>
            </div>
            
            <div class="success-popup" id="successPopup">
                <span class="icon">✅</span>
                <div class="label">UID Verified!</div>
                <div class="sub-label">Redirecting to video page...</div>
            </div>
            
            <div class="buttons-container" id="buttonsContainer">
                <button class="action-btn btn-1" id="btn1" onclick="handleButtonClick(1)">Watch Video</button>
                <button class="action-btn btn-2" id="btn2" onclick="handleButtonClick(2)">Get Reward</button>
            </div>
        </div>
        
        <div class="error-page" id="errorPage">
            <span class="error-icon" id="errorIcon">🚫</span>
            <div class="error-title" id="errorTitle">Link Suspended</div>
            <div class="error-sub" id="errorSub">This link has been suspended by the admin</div>
            <div class="error-status" id="errorStatus">SUSPENDED</div>
            <br>
            <button class="btn-back" onclick="goBack()">🔙 Go Back</button>
        </div>
    </div>

    <div class="custom-alert-overlay" id="customAlert">
        <div class="custom-alert-box">
            <span class="alert-icon">❌</span>
            <div class="alert-title">Invalid UID!</div>
            <div class="alert-message">
                Please enter a valid <strong>8-12 digit</strong> UID.<br>
                Only <span class="rule">numbers</span> are allowed.<br>
                <span style="font-size:12px;color:rgba(255,255,255,0.3);">Example: 1234567890</span>
            </div>
            <button class="alert-btn" id="alertBtn" onclick="closeAlert()">OK, Got it! ✅</button>
        </div>
    </div>

    <script>
        function playTapSound() {
            try {
                var audio = new Audio('data:audio/wav;base64,UklGRlAAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqNk5mdoqGko6CgmZaPioWDeXJsaGZkZGNkZ2ZqaWxucHFycXBvcG9ubm5ub25ubW1tbG1sbGxra2pqaWloZ2ZmZWVkZGNjYmJhYV9fXg==');
                audio.volume = 0.3;
                audio.play().catch(function() {});
            } catch (e) {}
        }
        
        async function loadBackground() {
            try {
                var r = await fetch('/api/settings');
                var data = await r.json();
                if (data && data.background) {
                    document.getElementById('bgImage').src = data.background;
                } else {
                    document.getElementById('bgImage').style.display = 'none';
                    document.querySelector('.bg-container').style.background = 'linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%)';
                }
            } catch (e) {}
        }
        
        function showCustomAlert() {
            document.getElementById('customAlert').classList.add('show');
            var input = document.getElementById('uidInput');
            input.classList.add('error-input');
            setTimeout(function() { input.classList.remove('error-input'); }, 600);
            setTimeout(function() { document.getElementById('alertBtn').focus(); }, 300);
        }
        
        function closeAlert() {
            document.getElementById('customAlert').classList.remove('show');
            document.getElementById('uidInput').focus();
            document.getElementById('uidInput').select();
        }
        
        document.getElementById('customAlert').addEventListener('click', function(e) {
            if (e.target === this) closeAlert();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAlert();
        });
        
        document.getElementById('alertBtn').addEventListener('click', function(e) {
            var ripple = document.createElement('span');
            ripple.className = 'ripple';
            var rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);
        });
        
        var linkData = null;
        var errorStatus = null;
        
        async function loadLinkData() {
            var linkId = new URLSearchParams(window.location.search).get('link');
            if (linkId) {
                try {
                    var r = await fetch('/api/link/' + linkId);
                    
                    if (r.status === 403) {
                        var error = await r.json();
                        var status = error.status || 'suspended';
                        showErrorPage(status);
                        return;
                    }
                    
                    if (r.status === 404) {
                        showErrorPage('not_found');
                        return;
                    }
                    
                    if (!r.ok) {
                        showErrorPage('not_found');
                        return;
                    }
                    
                    var data = await r.json();
                    if (data && data.id) {
                        linkData = data;
                        document.getElementById('btn1').textContent = data.button1 || 'Watch Video';
                        document.getElementById('btn2').textContent = data.button2 || 'Get Reward';
                        document.getElementById('normalContent').style.display = 'block';
                        document.getElementById('errorPage').classList.remove('show');
                    } else {
                        showErrorPage('not_found');
                    }
                } catch (e) {
                    console.error('Error loading link:', e);
                    showErrorPage('not_found');
                }
            }
        }
        
        function showErrorPage(status) {
            document.getElementById('normalContent').style.display = 'none';
            document.getElementById('errorPage').classList.add('show');
            
            var icons = {
                'suspended': '⛔',
                'disabled': '🚫',
                'expired': '⌛',
                'not_found': '🔍',
                'inactive': '⚠️'
            };
            var titles = {
                'suspended': 'Link Suspended',
                'disabled': 'Link Disabled',
                'expired': 'Link Expired',
                'not_found': 'Link Not Found',
                'inactive': 'Link Inactive'
            };
            var subs = {
                'suspended': 'This link has been temporarily suspended by the admin',
                'disabled': 'This link has been permanently disabled',
                'expired': 'This link has expired and is no longer active',
                'not_found': 'The link you are looking for does not exist',
                'inactive': 'This link is currently inactive'
            };
            
            document.getElementById('errorIcon').textContent = icons[status] || '🚫';
            document.getElementById('errorTitle').textContent = titles[status] || 'Link Not Available';
            document.getElementById('errorSub').textContent = subs[status] || 'This link is not available';
            document.getElementById('errorStatus').textContent = (status || 'UNKNOWN').toUpperCase();
            document.getElementById('errorStatus').className = 'error-status ' + (status || 'disabled');
        }
        
        function goBack() {
            window.history.back();
        }
        
        function checkUID() {
            var uid = document.getElementById('uidInput').value.trim();
            if (uid.length < 8 || uid.length > 12 || !/^\d+$/.test(uid)) {
                playTapSound();
                showCustomAlert();
                return;
            }
            playTapSound();
            localStorage.setItem('playerUID', uid);
            document.getElementById('checkBtn').style.display = 'none';
            document.getElementById('loadingContainer').classList.add('show');
            document.getElementById('successPopup').classList.remove('show');
            document.getElementById('buttonsContainer').classList.remove('show');
            
            var delay = 1000 + Math.random() * 1000;
            setTimeout(function() {
                document.getElementById('loadingContainer').classList.remove('show');
                document.getElementById('successPopup').classList.add('show');
                setTimeout(function() { redirectToVideoPage(); }, 1200);
            }, delay);
        }
        
        function redirectToVideoPage() {
            var videoUrl, claimUrl, buttonText, headline;
            if (linkData) {
                videoUrl = linkData.video || 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = linkData.claim || '#';
                buttonText = linkData.buttonText || 'Claim Now';
                headline = linkData.headline || '';
            } else {
                videoUrl = 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = '#';
                buttonText = 'Claim Now';
                headline = '';
            }
            
            // FIXED: Properly encode all parameters
            const videoEncoded = encodeURIComponent(videoUrl);
            const claimEncoded = encodeURIComponent(claimUrl);
            const btnEncoded = encodeURIComponent(buttonText);
            const headlineEncoded = encodeURIComponent(headline);
            
            localStorage.setItem('videoUrl', videoUrl);
            localStorage.setItem('claimUrl', claimUrl);
            localStorage.setItem('buttonText', buttonText);
            localStorage.setItem('headline', headline);
            
            const linkId = linkData ? linkData.id : 'default';
            window.location.href = `/v/${linkId}?video=${videoEncoded}&claim=${claimEncoded}&btn=${btnEncoded}&headline=${headlineEncoded}`;
        }
        
        function handleButtonClick(num) {
            playTapSound();
            var btn = document.getElementById('btn' + num);
            btn.classList.add('tap-effect');
            setTimeout(function() { btn.classList.remove('tap-effect'); }, 300);
            
            var videoUrl, claimUrl, buttonText, headline;
            if (linkData) {
                videoUrl = num === 1 ? linkData.video : linkData.video2 || linkData.video;
                claimUrl = num === 1 ? linkData.claim : linkData.claim2 || linkData.claim;
                buttonText = linkData.buttonText || 'Claim Now';
                headline = linkData.headline || '';
            } else {
                videoUrl = 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = '#';
                buttonText = 'Claim Now';
                headline = '';
            }
            
            localStorage.setItem('videoUrl', videoUrl);
            localStorage.setItem('claimUrl', claimUrl);
            localStorage.setItem('buttonText', buttonText);
            localStorage.setItem('headline', headline);
            window.location.href = '/v/' + (linkData ? linkData.id : 'default') + '?video=' + encodeURIComponent(videoUrl) + '&claim=' + encodeURIComponent(claimUrl) + '&btn=' + encodeURIComponent(buttonText) + '&headline=' + encodeURIComponent(headline);
        }
        
        function clearInput() {
            document.getElementById('uidInput').value = '';
            document.getElementById('clearBtn').classList.remove('show');
            document.getElementById('uidInput').focus();
            playTapSound();
        }
        
        document.getElementById('uidInput').addEventListener('input', function() {
            document.getElementById('clearBtn').classList.toggle('show', this.value.length > 0);
            this.classList.remove('error-input');
        });
        document.getElementById('uidInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkUID();
        });
        
        loadBackground();
        loadLinkData();
    </script>
</body>
</html>
