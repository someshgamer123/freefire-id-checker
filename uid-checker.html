<!DOCTYPE html>
<html>
<head>
    <title>UID Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0a1a;
            position: relative;
            overflow: hidden;
        }
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .bg-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px) brightness(0.4);
            transform: scale(1.1);
        }
        .bg-container .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo { font-size: 50px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .container h2 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
        .container .sub-title { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 300; margin-bottom: 25px; }
        .uid-input-wrapper { position: relative; margin-bottom: 15px; }
        .uid-input-wrapper input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            letter-spacing: 3px;
            background: rgba(255,255,255,0.07);
            color: #fff;
            transition: all 0.3s ease;
            outline: none;
        }
        .uid-input-wrapper input::placeholder { color: rgba(255,255,255,0.35); letter-spacing: 1px; font-weight: 300; }
        .uid-input-wrapper input:focus { border-color: rgba(102,126,234,0.6); box-shadow: 0 0 30px rgba(102,126,234,0.15); background: rgba(255,255,255,0.1); }
        .uid-input-wrapper .clear-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }
        .uid-input-wrapper .clear-btn.show { display: block; }
        .uid-input-wrapper .clear-btn:hover { color: #fff; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.4); }
        .btn:active { transform: scale(0.97); }
        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        .loading-container { display: none; margin: 30px 0 20px; padding: 20px; }
        .loading-container.show { display: block; animation: fadeIn 0.4s ease; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-container p { color: rgba(255,255,255,0.7); margin-top: 15px; font-size: 14px; font-weight: 300; }
        .success-popup {
            display: none;
            margin: 20px 0;
            padding: 25px;
            background: rgba(72,187,120,0.15);
            border: 1px solid rgba(72,187,120,0.3);
            border-radius: 20px;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .success-popup.show { display: block; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .success-popup .icon { font-size: 50px; display: block; margin-bottom: 8px; }
        .success-popup .label { color: #48bb78; font-size: 18px; font-weight: 700; }
        .success-popup .sub-label { color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 300; }
        .buttons-container { display: none; margin-top: 20px; gap: 12px; animation: fadeIn 0.5s ease; }
        .buttons-container.show { display: flex; flex-direction: column; }
        .action-btn {
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            color: #fff;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.btn-1 { background: linear-gradient(135deg, #48bb78, #38a169); }
        .action-btn.btn-1:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(72,187,120,0.4); }
        .action-btn.btn-2 { background: linear-gradient(135deg, #4299e1, #3182ce); }
        .action-btn.btn-2:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(66,153,225,0.4); }
        .action-btn.tap-effect { animation: tapPulse 0.3s ease; }
        @keyframes tapPulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 480px) {
            .container { padding: 28px 20px; border-radius: 24px; }
            .container h2 { font-size: 19px; }
            .uid-input-wrapper input { font-size: 16px; padding: 14px 16px; padding-right: 45px; }
            .btn { font-size: 16px; padding: 14px; }
            .action-btn { font-size: 15px; padding: 14px; }
            .logo { font-size: 40px; }
            .success-popup .icon { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="bg-container" id="bgContainer">
        <img id="bgImage" src="" alt="background">
        <div class="overlay"></div>
    </div>
    <div class="container">
        <div class="logo">🎮</div>
        <h2>Enter Your UID</h2>
        <p class="sub-title">Enter your Free Fire UID to continue</p>
        <div class="uid-input-wrapper">
            <input type="text" id="uidInput" placeholder="Enter UID" maxlength="12" autofocus>
            <button class="clear-btn" id="clearBtn" onclick="clearInput()">✕</button>
        </div>
        <button onclick="checkUID()" class="btn" id="checkBtn">➜ Process</button>
        <div class="loading-container" id="loadingContainer">
            <div class="spinner"></div>
            <p>⏳ Verifying UID...</p>
        </div>
        <div class="success-popup" id="successPopup">
            <span class="icon">✅</span>
            <div class="label">UID Verified!</div>
            <div class="sub-label">Redirecting to video page...</div>
        </div>
        <div class="buttons-container" id="buttonsContainer">
            <button class="action-btn btn-1" id="btn1" onclick="handleButtonClick(1)">Watch Video</button>
            <button class="action-btn btn-2" id="btn2" onclick="handleButtonClick(2)">Get Reward</button>
        </div>
    </div>
    <script>
        function playTapSound() {
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRlAAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqNk5mdoqGko6CgmZaPioWDeXJsaGZkZGNkZ2ZqaWxucHFycXBvcG9ubm5ub25ubW1tbG1sbGxra2pqaWloZ2ZmZWVkZGNjYmJhYV9fXg==');
                audio.volume = 0.3;
                audio.play().catch(() => {});
            } catch (e) {}
        }
        async function loadBackground() {
            try {
                const r = await fetch('/api/settings');
                const data = await r.json();
                if (data && data.background) {
                    document.getElementById('bgImage').src = data.background;
                } else {
                    document.getElementById('bgImage').style.display = 'none';
                    document.querySelector('.bg-container').style.background = 'linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%)';
                }
            } catch (e) {}
        }
        let linkData = null;
        async function loadLinkData() {
            const linkId = new URLSearchParams(window.location.search).get('link');
            if (linkId) {
                try {
                    const r = await fetch(`/api/link/${linkId}`);
                    if (r.status === 403) { alert('❌ ' + (await r.json()).error); window.location.href = '/'; return; }
                    const data = await r.json();
                    if (data && data.id) {
                        linkData = data;
                        document.getElementById('btn1').textContent = data.button1 || 'Watch Video';
                        document.getElementById('btn2').textContent = data.button2 || 'Get Reward';
                    }
                } catch (e) {}
            }
        }
        function checkUID() {
            const uid = document.getElementById('uidInput').value.trim();
            if (uid.length < 8 || !/^\d+$/.test(uid)) {
                alert('❌ Enter valid UID (8-12 digits)');
                playTapSound();
                return;
            }
            playTapSound();
            localStorage.setItem('playerUID', uid);
            document.getElementById('checkBtn').style.display = 'none';
            document.getElementById('loadingContainer').classList.add('show');
            document.getElementById('successPopup').classList.remove('show');
            document.getElementById('buttonsContainer').classList.remove('show');
            const delay = 1000 + Math.random() * 1000;
            setTimeout(() => {
                document.getElementById('loadingContainer').classList.remove('show');
                document.getElementById('successPopup').classList.add('show');
                setTimeout(() => { redirectToVideoPage(); }, 1200);
            }, delay);
        }
        function redirectToVideoPage() {
            let videoUrl, claimUrl, buttonText, headline;
            if (linkData) {
                videoUrl = linkData.video || 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = linkData.claim || '#';
                buttonText = linkData.buttonText || 'Claim Now';
                headline = linkData.headline || '';
            } else {
                videoUrl = 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = '#';
                buttonText = 'Claim Now';
                headline = '';
            }
            localStorage.setItem('videoUrl', videoUrl);
            localStorage.setItem('claimUrl', claimUrl);
            localStorage.setItem('buttonText', buttonText);
            localStorage.setItem('headline', headline);
            window.location.href = `/v/${linkData ? linkData.id : 'default'}?video=${encodeURIComponent(videoUrl)}&claim=${encodeURIComponent(claimUrl)}&btn=${encodeURIComponent(buttonText)}&headline=${encodeURIComponent(headline)}`;
        }
        function handleButtonClick(num) {
            playTapSound();
            const btn = document.getElementById('btn' + num);
            btn.classList.add('tap-effect');
            setTimeout(() => btn.classList.remove('tap-effect'), 300);
            let videoUrl, claimUrl, buttonText, headline;
            if (linkData) {
                videoUrl = num === 1 ? linkData.video : linkData.video2 || linkData.video;
                claimUrl = num === 1 ? linkData.claim : linkData.claim2 || linkData.claim;
                buttonText = linkData.buttonText || 'Claim Now';
                headline = linkData.headline || '';
            } else {
                videoUrl = 'https://youtu.be/dQw4w9WgXcQ';
                claimUrl = '#';
                buttonText = 'Claim Now';
                headline = '';
            }
            localStorage.setItem('videoUrl', videoUrl);
            localStorage.setItem('claimUrl', claimUrl);
            localStorage.setItem('buttonText', buttonText);
            localStorage.setItem('headline', headline);
            window.location.href = `/v/${linkData ? linkData.id : 'default'}?video=${encodeURIComponent(videoUrl)}&claim=${encodeURIComponent(claimUrl)}&btn=${encodeURIComponent(buttonText)}&headline=${encodeURIComponent(headline)}`;
        }
        function clearInput() {
            document.getElementById('uidInput').value = '';
            document.getElementById('clearBtn').classList.remove('show');
            document.getElementById('uidInput').focus();
            playTapSound();
        }
        document.getElementById('uidInput').addEventListener('input', function() {
            document.getElementById('clearBtn').classList.toggle('show', this.value.length > 0);
        });
        document.getElementById('uidInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkUID();
        });
        loadBackground();
        loadLinkData();
    </script>
</body>
</html>
