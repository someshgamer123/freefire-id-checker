<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reward Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault(), true);
        window.addEventListener('keydown', e => {
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        }, true);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            background: #090a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #131722;
            border-radius: 24px;
            padding: 36px 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .badge-icon { font-size: 44px; margin-bottom: 12px; }
        h2 { font-size: 22px; font-weight: 800; }
        p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 18px;
        }
        .input-group input:focus { border-color: #6366f1; }

        .btn-proceed {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-proceed:active { transform: scale(0.98); }

        .status-box {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-box.error { display: block; background: rgba(239, 68, 68, 0.12); color: #f87171; }
        .status-box.loading { display: block; background: rgba(99, 102, 241, 0.12); color: #818cf8; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="badge-icon">🎮</div>
        <h2>Verify Free Fire UID</h2>
        <p class="sub">Enter your gaming UID to unlock video rewards</p>

        <div class="input-group">
            <input type="text" id="uidInput" placeholder="Enter UID" maxlength="12" autofocus inputmode="numeric">
        </div>

        <button class="btn-proceed" id="submitBtn" onclick="verifyAndProceed()">Continue ➜</button>
        <div class="status-box" id="statusMsg"></div>
    </div>

    <script>
        const linkParam = new URLSearchParams(window.location.search).get('link') || 'default';

        document.getElementById('uidInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyAndProceed();
        });

        function verifyAndProceed() {
            const uid = document.getElementById('uidInput').value.trim();
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('submitBtn');

            if (!/^\d{8,12}$/.test(uid)) {
                status.className = 'status-box error';
                status.textContent = '❌ Please enter a valid 8-12 digit numeric UID';
                return;
            }

            localStorage.setItem('playerUID', uid);
            btn.disabled = true;
            status.className = 'status-box loading';
            status.textContent = '⏳ Verifying UID... Opening Video Page';

            setTimeout(() => {
                window.location.href = `/v/${linkParam}`;
            }, 500);
        }
    </script>
</body>
</html>
